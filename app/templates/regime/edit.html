{% extends "base.html" %}
{% block title %}Regime {{ quarter }}{% endblock %}
{% block content %}
<h1>市场钟摆 · {{ quarter }}</h1>

<p><a href="/regime">← 返回列表</a></p>

{% if error %}<p class="warn">{{ error }}</p>{% endif %}

<form method="post" action="/regime/{{ quarter }}">
  <fieldset>
    <legend>客观指标</legend>
    <label>估值分位（0-100，越高越贵）
      <input name="valuation_percentile" value="{{ fm.valuation_percentile if fm.valuation_percentile is not none }}" placeholder="例如 78">
    </label>
    <label>VIX 水平
      <input name="vix_level" value="{{ fm.vix_level if fm.vix_level is not none }}" placeholder="例如 14.5">
    </label>
    <label>信用利差（bps，IG 与国债）
      <input name="credit_spread_bps" value="{{ fm.credit_spread_bps if fm.credit_spread_bps is not none }}" placeholder="例如 90">
    </label>
    <label>10Y 国债收益率（小数，如 0.042 表示 4.2%）
      <input name="ust_10y_yield" value="{{ fm.ust_10y_yield if fm.ust_10y_yield is not none }}" placeholder="例如 0.042" type="number" step="0.0001">
    </label>
  </fieldset>

  <fieldset>
    <legend>定性判断</legend>
    <label>散户情绪
      <select name="retail_sentiment">
        <option value="">—</option>
        {% for s in sentiments %}
        <option value="{{ s }}" {% if fm.retail_sentiment == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </label>
    <label>宏观反应
      <select name="macro_reaction">
        <option value="">—</option>
        {% for r in reactions %}
        <option value="{{ r }}" {% if fm.macro_reaction == r %}selected{% endif %}>{{ r }}</option>
        {% endfor %}
      </select>
    </label>
    <label>钟摆判断
      <select name="verdict">
        <option value="">—</option>
        {% for v in verdicts %}
        <option value="{{ v }}" {% if fm.verdict == v %}selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select>
    </label>
  </fieldset>

  <fieldset>
    <legend>对组合的提示</legend>
    <label>仓位提示（自由文本）
      <input name="position_hint" value="{{ fm.position_hint or '' }}" placeholder="例如：估值偏高，控制新开仓；减仓条件未触发，保持持仓不加">
    </label>
    <label>现金下限建议（%）
      <input name="cash_floor_hint" value="{{ fm.cash_floor_hint if fm.cash_floor_hint is not none }}" placeholder="例如 15">
    </label>
  </fieldset>

  <fieldset>
    <legend>说明正文（markdown）</legend>
    <textarea name="body" rows="12">{{ body }}</textarea>
    <p class="hint">写清楚：这些数字的来源，为什么做出这个判断，哪些事件会推翻这个判断。</p>
  </fieldset>

  <button type="submit">保存</button>
</form>
{% endblock %}
