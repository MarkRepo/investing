{% extends "base.html" %}
{% block title %}meta · {{ ticker }}{% endblock %}
{% block content %}
<h1>meta.md · {{ ticker }}</h1>
<p><a href="/companies/{{ key }}">← 返回公司</a></p>

<p class="warn">
  <strong>事实层来源纪律（DESIGN §8 坑 9）</strong>：这里的字段来源只允许年报、公司公告、多份研报交叉验证的"公司简介"。
  新闻属于 claim，不升级为事实层。
</p>

<form method="post" action="/companies/{{ key }}/meta">
  <fieldset>
    <legend>稳定事实</legend>
    <label>name（公司名）
      <input name="name" value="{{ doc.frontmatter.name or ticker }}" />
    </label>
    <label>industry_primary
      <select name="industry_primary">
        <option value="">（未设置）</option>
        {% for s in sectors %}
          <option value="{{ s }}" {% if doc.frontmatter.industry_primary == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </label>
    <label>themes（逗号分隔，如 <code>ai, weight_loss, clean_energy</code>）
      <input name="themes" value="{% if doc.frontmatter.themes %}{{ doc.frontmatter.themes | join(', ') }}{% endif %}" placeholder="逗号分隔" />
    </label>
    <label>listed_date
      <input name="listed_date" value="{{ doc.frontmatter.listed_date or '' }}" placeholder="YYYY-MM-DD" />
    </label>
    <label>currency
      <input name="currency" value="{{ doc.frontmatter.currency or 'USD' }}" />
    </label>
    <label>website
      <input name="website" value="{{ doc.frontmatter.website or '' }}" />
    </label>
  </fieldset>
  <fieldset>
    <legend>正文（稳定事实清单）</legend>
    <p class="hint">只放年报/公告里能核对的字段：主营、总部、CEO、实控人。不要放本季度动态。</p>
    <textarea name="body" rows="16">{{ doc.body }}</textarea>
  </fieldset>
  <button type="submit">保存</button>
</form>
{% endblock %}
