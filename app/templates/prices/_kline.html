<div class="chart-wrap" id="kline-wrap">
  <div class="chart-toolbar">
    <button class="period-btn active" data-period="1d">日 K</button>
    <button class="period-btn" data-period="1w">周 K</button>
    <button class="period-btn" data-period="1M">月 K</button>
    <span class="fill"></span>
    {% if not kline %}<span class="hint">暂无历史数据，点"↻ 刷新"回补</span>{% endif %}
    <button id="kline-fullscreen" class="period-btn" title="最大化 / 退出 (Esc)">⛶ 最大化</button>
  </div>
  <div id="kline-chart" style="width:100%; height:560px"></div>
</div>
