{% extends "base.html" %}
{% block title %}{{ entry.source_id }}{% endblock %}
{% block content %}
<style>
  main { max-width: none !important; margin: 0 !important; padding: 0 !important; }
  .pdf-bar { display:flex; align-items:center; gap:16px; padding:6px 16px; font-size:13px; background:#fff; border-bottom:1px solid #eaeaea; }
  #pdf-frame { display:block; width:100%; border:none; }
</style>

<div class="pdf-bar" id="pdf-bar">
  <a href="/bundles/{{ entry.source_id }}">← Bundle 详情</a>
  <span class="hint">{{ entry.source_file_path }}</span>
</div>

{% if is_pdf %}
<iframe src="/sources/{{ entry.source_id }}/raw" id="pdf-frame"></iframe>
<script>
  (function() {
    function resize() {
      var nav = document.querySelector('nav.top');
      var bar = document.getElementById('pdf-bar');
      var frame = document.getElementById('pdf-frame');
      var used = (nav ? nav.getBoundingClientRect().height : 0)
               + (bar ? bar.getBoundingClientRect().height : 0);
      frame.style.height = (window.innerHeight - used) + 'px';
    }
    resize();
    window.addEventListener('resize', resize);
  })();
</script>
{% else %}
<p style="padding:20px">文件路径：<code>{{ source_path }}</code>（非 PDF，请在文件系统查看）</p>
{% endif %}
{% endblock %}
