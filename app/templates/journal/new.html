{% extends "base.html" %}
{% block title %}记录决策{% endblock %}
{% block content %}
<h1>记录决策</h1>
<p>创建后会自动快照当前 V0 内容并写入文件骨架。</p>
<form method="post" action="/journal/new">
  <label>ticker<input name="ticker" value="{{ ticker }}" required autofocus /></label>
  <label>market
    <select name="market">
      {% for m in markets %}<option value="{{ m }}" {% if m == market %}selected{% endif %}>{{ m }}</option>{% endfor %}
    </select>
  </label>
  <label>动作
    <select name="action">
      {% for a in actions %}<option value="{{ a }}" {% if a == action %}selected{% endif %}>{{ a }}</option>{% endfor %}
    </select>
  </label>
  <label>日期<input name="entry_date" value="{{ today }}" required /></label>
  <label>价格<input name="price" type="number" step="0.01" value="0" /></label>
  <label>仓位变化（%，可正可负）<input name="position_change" type="number" step="0.1" value="0" /></label>
  <button>创建</button>
</form>
{% endblock %}
