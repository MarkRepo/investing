# 主 agent 汇总 subagent 产出后要做的交叉校验
#
# on_fail:
#   pause  — 暂停走 AskUserQuestion，用户决定如何处理
#   merge  — 自动合并/去重，留日志
#   warn   — 不暂停，在最终报告里标记
#   abort  — 直接中止，不写入

checks:
  - id: revenue_consistency
    desc: |
      claims 里定量 revenue 数字（claim_text 含"营收/收入"且 subject_tag=revenue_growth
      或 claim_type=quantitative 且 metric=revenue）vs financials CSV 同 period 的 revenue。
    scope: [claims, financials]
    tolerance: 0.02
    on_fail: pause

  - id: segment_sum
    desc: |
      profile §2 收入结构表的分部合计 vs financials CSV 同 period 的 revenue。
      容差 5%（少数公司有"其它"分部或汇总差异）。
    scope: [profile.§2, financials]
    tolerance: 0.05
    on_fail: pause

  - id: period_consistency
    desc: |
      所有 subagent 产出的 claim.timeframe 里，出现频率最高的 period
      应该和 meta.fiscal_year 一致。不一致说明某 agent 抽错年份。
    scope: [claims, meta]
    on_fail: pause

  - id: claim_dedup
    desc: |
      去重：同 claim_text + subject_tag + timeframe 的 claim 出现多次（多 section
      抽到同一论点）→ 保留 evidence_text 更长/更具体那条，其余丢弃。
    scope: [claims]
    method: fuzzy
    similarity_threshold: 0.85
    on_fail: merge

  - id: empty_section_warn
    desc: |
      keep 类 section 对应的 subagent 返回 claims=[] 且 profile_fragments={} 且
      financial_rows=[]（即零产出）→ 警告，可能是 prompt 太严或 section 切错。
    scope: [subagent_output]
    on_fail: warn

  - id: financials_required_columns
    desc: |
      financial_rows CSV 至少要有 revenue、net_income 两列；缺失 → 暂停问。
      其它列缺失允许（年报披露不完整），写入时 NULL。
    scope: [financials]
    required: [revenue, net_income]
    on_fail: pause

  - id: subjects_whitelist
    desc: |
      所有 claim.subject_tag 必须在 controlled-vocab/subjects.yaml 的 id 列表内。
      这条实际上由 claims_io.validate_batch 内部保证，此处仅声明以备查。
    scope: [claims]
    on_fail: abort   # 写入阶段会被 validate_batch 拒，等同 abort
