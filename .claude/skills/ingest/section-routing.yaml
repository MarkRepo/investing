# Section action 路由表（Plan 3 后架构）
#
# Plan 3 digest dispatch 架构下，workflow 不再按 section 分派 subagent；
# 每份报告只派 1 个 digest subagent 读整份文本。本 yaml 的作用退化到：
#   1. 标记哪些 section `action: skip`（样板、免责、附件清单）—— preprocess 时丢掉
#   2. 标记 `action: extract` 让整段 text 进入 digest 的 full_text 拼接
#
# 字段：
#   action: skip | extract
#   reason: (可选) skip 时的说明
#
# 历史字段 `subagent` / `targets` / `max_chars` / `oversize_action` / `oversize_reason`
# 已删除（v1 section-per-subagent 架构使用；Plan 3 废弃）。对应的 v1 prompt 文件
# 归档在 `prompts/_v1_archived/`。

a-share-annual:
  重要提示_目录_释义:     {action: skip, reason: 模版样板}
  公司简介_财务指标:      {action: extract}
  管理层讨论与分析:       {action: extract}
  公司治理:               {action: extract}
  环境与社会责任:         {action: skip, reason: ESG 与投资分析弱相关}
  重要事项:               {action: extract}
  股份变动_股东情况:      {action: extract}
  优先股情况:             {action: skip, reason: 多数公司无}
  债券情况:               {action: skip, reason: 多数公司无}
  财务报告:               {action: skip, reason: 数字已由 API 入库，叙述由 MD&A 覆盖}

us-10k:
  Item_1_Business:                   {action: extract}
  Item_1A_Risk_Factors:              {action: extract}
  Item_1B_Unresolved_Staff_Comments: {action: skip, reason: 通常 None}
  Item_1C_Cybersecurity:             {action: extract}
  Item_2_Properties:                 {action: extract}
  Item_3_Legal_Proceedings:          {action: extract}
  Item_4_Mine_Safety:                {action: skip, reason: N/A}
  Item_5_Market_for_Equity:          {action: extract}
  Item_6_Reserved:                   {action: skip, reason: SEC 保留位}
  Item_7_MDA:                        {action: extract}
  Item_7A_Quantitative_Market_Risk:  {action: skip, reason: 对个人分析价值低}
  Item_8_Financial_Statements:       {action: skip, reason: 数字已由 API 入库，叙述由 MD&A 覆盖}
  Item_9_Changes_Disagreements:      {action: skip, reason: 通常 None}
  Item_9A_Controls_Procedures:       {action: skip, reason: 标准披露}
  Item_9B_Other_Information:         {action: skip, reason: 边角}
  Item_9C_Foreign_Jurisdictions:     {action: skip, reason: 境外上市才相关}
  Item_10_Directors_Officers:        {action: extract}
  Item_11_Executive_Compensation:    {action: extract}
  Item_12_Security_Ownership:        {action: extract}
  Item_13_Related_Transactions:      {action: extract}
  Item_14_Principal_Accountant_Fees: {action: extract}
  Item_15_Exhibits:                  {action: skip, reason: 附件清单}

us-10q:
  # 季报：过去版本给 Part II Item 1A 设 max_chars=20000（检测 10-K 整段复制场景）；
  # digest 架构下不需要——digest 吃整份，复制段落的重复由 digest 自己判断。
  Part_I_Item_1_Financial_Statements: {action: skip, reason: 数字已由 API 入库，叙述由 MD&A 覆盖}
  Part_I_Item_2_MDA:                  {action: extract}
  Part_I_Item_3_Market_Risk:          {action: skip, reason: 对个人分析价值低}
  Part_I_Item_4_Controls:             {action: skip, reason: 标准披露}
  Part_II_Item_1_Legal_Proceedings:   {action: extract, reason: 仅已立案具体诉讼有价值}
  Part_II_Item_1A_Risk_Factors:       {action: extract, reason: 10-Q Part II Item 1A 仅披露相对 10-K 的 material changes}
  Part_II_Item_2_Unregistered_Sales:  {action: extract, reason: share repurchase 数字}
  Part_II_Item_3_Defaults:            {action: skip, reason: 通常 None}
  Part_II_Item_4_Mine_Safety:         {action: skip, reason: N/A 非矿业公司}
  Part_II_Item_5_Other_Information:   {action: skip, reason: 通常空或样板}
  Part_II_Item_6_Exhibits:            {action: skip, reason: 附件清单}

a-share-quarterly:
  主要财务数据:       {action: skip, reason: 数字已由 API 入库}
  股东信息:           {action: skip, reason: 前十大股东快照变化通常不显著}
  其他提醒事项:       {action: extract, reason: 重大合同/担保/关联方进展}
  季度财务报表:       {action: skip, reason: 数字已由 API 入库}

# 卖方公司研报：digest 吃整份；保留几条常见 section 的 skip 规则
sell-side-generic:
  investment_thesis: {action: extract}
  forecasts:         {action: extract}
  valuation:         {action: extract}
  risk_section:      {action: extract}
  disclaimer:        {action: skip, reason: 免责声明模版}
  analyst_bio:       {action: skip, reason: 分析师信息}
  rating_definition: {action: skip, reason: 评级定义模版}

# 行业研报通道：所有已知维度都 extract；fallback 也 extract
industry-generic:
  _fallback:       {action: extract}
  market_size:     {action: extract}
  competition:     {action: extract}
  value_chain:     {action: extract}
  technology:      {action: extract}
  regulation:      {action: extract}
  drivers:         {action: extract}
  lifecycle:       {action: extract}
  risks:           {action: extract}
  valuation:       {action: extract}

# 默认 fallback：未匹配任何通道的 section 一律 extract（保守策略）
_fallback: {action: extract}
