# source_id 生成规则
#
# 用于给 claims.jsonl 里每条 claim 加 source_id，同时作为碰撞检测的 key。
# sha8 = 原文件 sha256 前 8 位（不是预处理后的文本——后者会因规则升级而变）。
# 同一份文件重 ingest 一定命中 sha8，触发碰撞检测。

formats:
  us-10k:            "10-K-{fiscal_year}-{sha8}"
  us-10q:            "10-Q-{period}-{sha8}"
  us-20f:            "20-F-{fiscal_year}-{sha8}"
  a-share-annual:    "年报-{fiscal_year}-{sha8}"
  a-share-quarterly: "季报-{period}-{sha8}"
  a-share-interim:   "半年报-{fiscal_year}-{sha8}"
  sell-side:         "研报-{institution}-{date}-{sha8}"

# 字段来源（从预处理 meta 读取哪个字段）
field_sources:
  fiscal_year:  meta.fiscal_year
  period:       meta.reporting_period
  sha8:         meta.sha8
  institution:  meta.institution   # sell-side 专用，预处理从研报封面抽
  date:         meta.publish_date  # sell-side 专用

# 碰撞处理策略（由 workflow 消费）
collision_policy:
  detect_by: source_id              # 或 sha8：按 sha 更严格但跨文件改名会误判
  on_collision: ask_user            # 让用户选 overwrite / discard / new_version
  new_version_suffix: "-v{n}"       # new_version 模式下自动递增 -v2, -v3
