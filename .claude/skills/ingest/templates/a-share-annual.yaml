# A 股年报预处理规则（巨潮资讯下载的 PDF）
#
# 结构参考 CSRC《公开发行证券的公司信息披露内容与格式准则》。
# 不同公司和披露年度有差异，此处按"并集"列出常见 section，预处理时只要匹配到就切。

market: a-share
form: annual

# section 切分正则（按顺序尝试，第一个命中即取）
# group 1 = 中文/数字编号；group 2 = section 标题文字
section_detection:
  patterns:
    - '^\s*第\s*(一|二|三|四|五|六|七|八|九|十|十一|十二|十三|十四|十五|[一二三四五六七八九十百千万亿])+\s*节\s+(.+?)\s*$'
    - '^\s*第\s*(\d+)\s*节\s+(.+?)\s*$'
    - '^\s*(\d+)[\.、)]\s*(公司简介|财务状况|经营情况|公司治理|股东情况|财务报告|重要事项|风险因素)'

# 标准 section 名归一化表（原文标题 → 标准 key）
# 预处理抽到原文标题后，按此表映射到统一 key；routing YAML 只消费标准 key
section_normalize:
  # 重要提示类
  "重要提示": 重要提示_目录_释义
  "目录": 重要提示_目录_释义
  "释义": 重要提示_目录_释义
  "重要提示、目录和释义": 重要提示_目录_释义
  "重要提示和释义": 重要提示_目录_释义
  # 公司简介和财务数据
  "公司简介和主要财务指标": 公司简介_财务指标
  "公司简介": 公司简介_财务指标
  "公司简介及主要财务数据": 公司简介_财务指标
  "公司概况": 公司简介_财务指标
  # 管理层讨论
  "管理层讨论与分析": 管理层讨论与分析
  "经营情况讨论与分析": 管理层讨论与分析
  "经营情况的讨论与分析": 管理层讨论与分析
  # 公司治理
  "公司治理": 公司治理
  "公司治理结构": 公司治理
  # ESG
  "环境和社会责任": 环境与社会责任
  "环境与社会责任": 环境与社会责任
  "可持续发展": 环境与社会责任
  # 重要事项
  "重要事项": 重要事项
  "其他重要事项": 重要事项
  # 股东情况
  "股份变动及股东情况": 股份变动_股东情况
  "股本变动及股东情况": 股份变动_股东情况
  "股份变动": 股份变动_股东情况
  "股东情况": 股份变动_股东情况
  # 优先股/债券（大多数公司没有）
  "优先股相关情况": 优先股情况
  "债券相关情况": 债券情况
  # 财务报告
  "财务报告": 财务报告
  "财务会计报告": 财务报告

# 模版剔除规则：标记 action=skip，文本保留
skip_rules:
  # 整个 section 跳过
  sections:
    - 重要提示_目录_释义
    - 环境与社会责任
    - 优先股情况
    - 债券情况

  # 段落级跳过（命中任一正则则段落标 skip，不影响所在 section 的其它内容）
  paragraphs:
    - name: 董事会声明
      pattern: '本公司(?:及)?董事会(?:及全体董事|全体(?:董事|成员))保证.*?真实.*?准确'
    - name: 审计意见模版开头
      pattern: '(?:立信|安永|毕马威|德勤|普华永道|致同|大华|天健|信永中和).*?会计师事务所.*?出具'
    - name: 备查文件清单
      pattern: '^备查文件(?:目录)?[:：]?\s*$'
    - name: 页脚页眉样板
      pattern: '^\s*\d{4}\s*年\s*年度报告\s*$'

# 识别形式的判据（用于 preprocess_report 推断 detected_form）
# 命中任一 positive pattern 且无 negative pattern 视为本形式
form_detection:
  positive:
    - '\d{4}\s*年\s*年度报告'
    - '年度报告\s*\d{4}'
  negative:
    - '季度报告'
    - '半年度报告'

# fiscal_year 提取规则
fiscal_year_extraction:
  patterns:
    - '(\d{4})\s*年\s*年度报告'
    - '年度报告\s*(\d{4})'
  format: "{year}"      # 最终输出 "2025" 这种

# 报告期（reporting_period）提取
reporting_period_extraction:
  patterns:
    - '(\d{4})\s*年\s*12\s*月\s*31\s*日'
  format: "{year}-12-31"
