# A 股季度报告预处理规则（巨潮资讯下载的 PDF）
#
# A 股季报两种典型：一季度报告（Q1）/ 三季度报告（Q3）
# 半年度报告（H1）另有结构，当前版本走 annual-report workflow 处理
#
# 季报结构参考 CSRC《公开发行证券的公司信息披露内容与格式准则 - 第13号 季度报告》：
#   一、主要财务数据
#       （一）主要会计数据和财务指标
#       （二）非经常性损益项目和金额
#       （三）主要会计数据、财务指标发生变动的情况、原因
#   二、股东信息
#       （一）普通股股东总数和前十名股东持股情况表
#       （二）公司优先股股东总数及前十名优先股股东持股情况表
#   三、其他提醒事项
#   四、季度财务报表
#       （合并/母公司资产负债表、利润表、现金流量表）

market: a-share
form: quarterly

# section 切分正则（季报特殊：严格只匹配 4 个顶级标题，避免"一、营业总收入"
# 等子项被当成独立 section 切分）
#
# 如果未来季报加了新顶级 section，按相同模式加别名即可
section_detection:
  patterns:
    # 第一组：顶级中文序号 + 白名单标题（字段准确匹配）
    - '^\s*(一|二|三|四|五|六|七|八|九|十)[、.]\s*(主要财务数据(?:和指标|和财务指标)?|股东信息|股东情况|普通股股东(?:情况|信息)?|其他提醒事项|重要事项|季度财务报表|财务报表|财务会计报告)\s*$'
    # 第二组：阿拉伯数字变体（有的季报用 "1." / "1、"）
    - '^\s*(\d+)[\.、)]\s*(主要财务数据|股东信息|股东情况|其他提醒事项|季度财务报表|财务报表)\s*$'

# 标准 section 名归一化
section_normalize:
  "主要财务数据":               主要财务数据
  "主要财务数据和指标":         主要财务数据
  "主要会计数据和财务指标":     主要财务数据
  "股东信息":                   股东信息
  "股东情况":                   股东信息
  "普通股股东情况":             股东信息
  "其他提醒事项":               其他提醒事项
  "重要事项":                   其他提醒事项
  "季度财务报表":               季度财务报表
  "财务报表":                   季度财务报表
  "财务会计报告":               季度财务报表

# 模版剔除规则
skip_rules:
  sections:
    # 季报没有特别需要整段跳过的 section（§2 股东信息虽然变化少但仍保留——
    # 主要股东增减持是关键信号）。保留全部 section 走 routing。
    - 股东信息  # 季报中股东信息通常仅前十名快照，和年报重复；routing 层决定抽不抽
    - 季度财务报表  # 数字已由 API 入库
    - 主要财务数据  # 数字已由 API 入库

  paragraphs:
    - name: 董事会声明
      pattern: '本公司(?:及)?董事会(?:及全体董事|全体(?:董事|成员))保证.*?真实.*?准确'
    - name: 季报封面样板
      pattern: '^\s*\d{4}\s*年\s*第[一二三四]\s*季度报告\s*$'
    - name: 备查文件清单
      pattern: '^备查文件(?:目录)?[:：]?\s*$'

# form detection
form_detection:
  positive:
    - '\d{4}\s*年\s*第\s*[一二三四]\s*季度报告'
    - '第[一二三四]季度报告'
  negative:
    - '年度报告\s*\d{4}'
    - '半年度报告'

# fiscal_year 提取（季报所在财年）
fiscal_year_extraction:
  patterns:
    - '(\d{4})\s*年\s*第\s*[一二三四]\s*季度报告'
  format: "{year}"

# reporting_period 提取：输出 "YYYY 年第X季度" 原文，workflow 层换算为 YYYYQN
# workflow 规则：
#   "第一季度" → Q1
#   "第二季度" / "中期" → Q2（罕见，A 股 Q2 走半年报）
#   "第三季度" → Q3
#   "第四季度" → Q4（罕见，A 股 Q4 通常走年报）
reporting_period_extraction:
  patterns:
    - '(\d{4}\s*年\s*第\s*[一二三四]\s*季度报告)'
  format: "{raw}"
