# 卖方研报预处理规则（机构中性版本；具体机构如中信/摩根的差异后期单独叠加）
#
# 研报结构在不同机构差异较大，但主流节块总能映射到以下 canonical 名称：
#   - investment_thesis   投资要点 / 核心观点 / Investment Thesis / Key Points
#   - forecasts           盈利预测 / 业绩预测 / Forecasts / Earnings Model
#   - valuation           估值分析 / 目标价 / Valuation / Price Target
#   - risk_section        风险提示 / Key Risks
#   - disclaimer / analyst_bio / rating_definition（skip 类）
#
# 研报当前版本的策略：
#   - 预处理不严格按中文/英文做两套正则；用宽松 section_detection + normalize 白名单
#   - 拿不到 institution / publish_date 时返回 null，workflow 层 AskUserQuestion
#   - **多公司检测**不在预处理做（没有可靠低误差的启发式）；workflow 层让主 agent 读
#     HEADER + investment_thesis 前 1K 字后判断"是否单一公司",多个 ticker → 拒绝

market: any        # 研报不限 A 股 / 美股；workflow 层按公司 key 决定落位
form: sell-side

# 未被 section_normalize 命中的 section 默认归入这个通道。
# 研报正文的章节标题五花八门（"深耕线缆用高分子材料二十载"这类定制标题），
# 语义上都是 thesis 的论据支撑，统一走 thesis subagent 最稳。
# 注意：只有在 section_detection **匹配成功**时 fallback 才生效——
# 未匹配的行压根不会成为 section，所以 PDF 表格里的独立数字行不会泄漏进来。
_section_fallback: investment_thesis

section_detection:
  patterns:
    # (A) 研报白名单专有标题：整行就是 "投资要点" / "投资建议" / "风险提示" 等（前后可选【】）
    - '^\s*(?:【|\[)?(投资要点|核心观点|投资逻辑|关键假设|投资建议|风险提示|主要风险|盈利预测|业绩预测|财务预测|估值|估值分析|目标价|免责声明|评级说明|评级定义|分析师介绍)(?:】|\])?\s*$'
    - '^\s*(Investment\s+Thesis|Investment\s+Summary|Key\s+Points|Forecasts|Financial\s+Forecasts|Earnings\s+Model|Valuation|Price\s+Target|Key\s+Risks|Risk\s+Factors|Disclaimer)\s*$'
    # (B) 数字章节（一/二级）。三层防误匹配约束：
    #   1. 数字**只能**是 1-9 单数字（或 X.Y 形式）—— 研报章节极少超过 9 章，过滤
    #      正文里"2016 年，..." / "77.5 百万元" / "14838.6" 等误命中
    #   2. 标题必须以**连续 3+ 个中文字**或**连续 3+ 英文字母**开头 —— 过滤 "6 个月"
    #      (首字"个"非连续中文块) / "7 个，所涉及..." (首段含标点) 这类正文段落
    #   3. 标题整体 ≤ 58 字 —— 过滤被识别成单行的长段落
    - '^\s*([1-9]\.[1-9])\s+((?:[一-龥]{3,}|[A-Za-z]{3,}).{0,55})\s*$'
    - '^\s*([1-9])\s+((?:[一-龥]{3,}|[A-Za-z]{3,}).{0,55})\s*$'
    # (C) 中文顿号章节（"一、公司概况"）
    - '^\s*[一二三四五六七八九十]\s*[、.]\s*((?:[一-龥]{3,}|[A-Za-z]{3,}).{0,55})\s*$'
    # (D) Markdown H1/H2/H3（PDF → md 转换产物偶见）
    - '^#{1,3}\s+((?:[一-龥]{3,}|[A-Za-z]{3,}).{0,55})\s*$'

# 标准 section 名归一化
section_normalize:
  # 投资观点
  "投资要点":           investment_thesis
  "核心观点":           investment_thesis
  "投资逻辑":           investment_thesis
  "关键假设":           investment_thesis
  "Investment Thesis":  investment_thesis
  "Investment Summary": investment_thesis
  "Key Points":         investment_thesis

  # 盈利预测
  "盈利预测":            forecasts
  "业绩预测":            forecasts
  "财务预测":            forecasts
  "Forecasts":           forecasts
  "Financial Forecasts": forecasts
  "Earnings Model":      forecasts

  # 估值
  "估值":            valuation
  "估值分析":        valuation
  "目标价":          valuation
  "投资建议":        valuation       # A 股研报常把评级 + 目标价 + 投资结论放在这一节
  "投资结论":        valuation
  "Valuation":       valuation
  "Price Target":    valuation
  "Recommendation":  valuation

  # 风险
  "风险提示":    risk_section
  "主要风险":    risk_section
  "Key Risks":   risk_section
  "Risk Factors": risk_section

  # 模版类（会被 skip_rules 跳过）
  "免责声明":        disclaimer
  "Disclaimer":      disclaimer
  "评级说明":        rating_definition
  "评级定义":        rating_definition
  "分析师介绍":      analyst_bio

# 模版剔除规则
skip_rules:
  sections:
    - disclaimer
    - analyst_bio
    - rating_definition

  paragraphs:
    - name: 常见免责样板
      pattern: '(?i)本报告.*?仅供.*?投资者.*?参考'
    - name: 分析师资质声明样板
      pattern: '(?i)本人具有.*?证券分析师.*?职业资格'
    - name: 评级定义样板
      pattern: '(?i)买入.*?预期.*?上涨.*?%.*?增持.*?预期'

# form_detection：靠"评级 / 目标价 / analyst / target price"等 sell-side 专属标记
form_detection:
  positive:
    - '评级[:：]?\s*(?:买入|增持|中性|减持|卖出|强烈推荐|推荐|谨慎推荐|Buy|Hold|Sell|Overweight|Underweight|Neutral)'
    - '目标价[:：]?\s*[\d\.\$¥]'
    - '(?i)target\s+price[:：]?\s*[\d\.\$¥]'
    - '分析师[:：]'
    - '(?i)analyst[:：]'
    - '证券研究报告'
  negative:
    - '(?i)FORM\s*10[-‐‑–\s]*K\b'
    - '(?i)FORM\s*10[-‐‑–\s]*Q\b'
    - '年度报告\s+\d{4}'
    - '季度报告'

# institution 抽取（封面机构名）
# 先中资（A 股场景多），后外资；没命中返回 null → workflow AskUserQuestion
institution_extraction:
  patterns:
    - '(中信证券|中信建投|华泰证券|国泰君安|中金公司|招商证券|海通证券|申万宏源|东方证券|东吴证券|光大证券|国信证券|兴业证券|长江证券|广发证券|方正证券|安信证券|天风证券|中泰证券|国盛证券|浙商证券|华创证券|民生证券|银河证券|平安证券|西南证券|国金证券|国元证券|东北证券|华西证券|华安证券|第一创业|红塔证券|华福证券|开源证券)'
    - '(?i)(Morgan\s+Stanley|Goldman\s+Sachs|JPMorgan|J\.?P\.?\s+Morgan|Bank\s+of\s+America|BofA|Credit\s+Suisse|UBS|Citi(?:group)?|Barclays|Deutsche\s+Bank|Jefferies|Wells\s+Fargo|Nomura|Macquarie|HSBC|BNP\s+Paribas)'
  format: "{raw}"

# publish_date 抽取
# 正则命中后 workflow 层换算成 YYYY-MM-DD
publish_date_extraction:
  patterns:
    - '(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日'
    - '(\d{4})[-/](\d{1,2})[-/](\d{1,2})'
    - '(?i)(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),?\s+(\d{4})'
  format: "{raw}"

# fiscal_year（研报"当前出刊所在年"）—— 不是严格意义的"报告期"
fiscal_year_extraction:
  patterns:
    - '(\d{4})\s*年\s*\d{1,2}\s*月'
    - '(\d{4})[-/]\d{1,2}[-/]\d{1,2}'
  format: "{year}"

# reporting_period 原样透传，workflow 层决定是否解析
reporting_period_extraction:
  patterns:
    - '(\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日)'
    - '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
  format: "{raw}"
