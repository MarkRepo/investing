form: industry-research-a-share

# 行业研报特点：封面含"行业深度报告"/"行业研究"/"行业点评"等关键词；
# 不含"Form 10-K"等公司年报术语。
form_detection:
  positive:
    - 行业深度
    - 行业研究
    - 行业点评
    - 行业专题
    - 产业链深度
    - Sector\s+Report
    - Industry\s+Report
  negative:
    - Form\s+10-K
    - 年度报告全文
    - 10-Q

# 章节检测：行业研报章节极自由（"市场空间"/"竞争格局"/"技术演进"等），
# 没有 A 股年报那种"第一节/第二节"固定骨架。用中文冒号/括号/加粗前缀作弱匹配。
section_detection:
  patterns:
    - '^[一二三四五六七八九十][、.．]\s*(.+)$'          # 一、市场空间
    - '^\d+[、.．]\s*(.+)$'                              # 1、市场空间
    - '^\d+\.\d+\s+(.+)$'                                # 1.1 市场空间
    - '^##\s+(.+)$'                                      # markdown H2

# 未在此表里的标题归 UNKNOWN_N（preprocess 保留原文，留给 digest subagent 作上下文）
section_normalize:
  市场空间: market_size
  市场规模: market_size
  行业空间: market_size
  TAM: market_size
  行业格局: competition
  竞争格局: competition
  产业链: value_chain
  产业链分析: value_chain
  技术演进: technology
  技术路线: technology
  技术路线对比: technology
  技术趋势: technology
  政策环境: regulation
  政策梳理: regulation
  风险提示: risks
  投资建议: valuation
  估值: valuation
  生命周期: lifecycle
  驱动因素: drivers
  增长驱动: drivers

# 行业研报无"正文标题自由"问题 —— UNKNOWN 章节不降级到某通道，保持 UNKNOWN
_section_fallback: null

skip_rules:
  sections:
    - HEADER          # 封面
    - disclaimer      # 免责声明
    - analyst_bio     # 分析师介绍
    - rating_definition

institution_extraction:
  patterns:
    - '(国金证券|中信证券|中信建投|中金公司|华泰证券|国泰君安|招商证券|广发证券|海通证券|光大证券|东吴证券|申万宏源|东方证券|国信证券|兴业证券|天风证券|平安证券|中泰证券|浙商证券)'

publish_date_extraction:
  patterns:
    - '(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日'
    - '(\d{4})-(\d{1,2})-(\d{1,2})'
    - '(\d{4})/(\d{1,2})/(\d{1,2})'
