# US 10-Q 预处理规则（SEC EDGAR 下载的 HTM）
#
# 10-Q 结构 (SEC Form 10-Q general instructions):
#   PART I — FINANCIAL INFORMATION
#     Item 1. Financial Statements
#     Item 2. Management's Discussion and Analysis (MD&A)
#     Item 3. Quantitative and Qualitative Disclosures About Market Risk
#     Item 4. Controls and Procedures
#   PART II — OTHER INFORMATION
#     Item 1. Legal Proceedings
#     Item 1A. Risk Factors (material changes only)
#     Item 2. Unregistered Sales of Equity Securities
#     Item 3. Defaults Upon Senior Securities
#     Item 4. Mine Safety Disclosures (N/A)
#     Item 5. Other Information
#     Item 6. Exhibits
#
# 已知限制：当前 section 切分不跟踪 PART 上下文，所以 Part I 和 Part II 的
# 同名 Item 可能会归并（例如 Part I Item 1 = Financial Statements 和
# Part II Item 1 = Legal Proceedings 都映射到 "Item_1"）。
# _dedupe_toc 会保留文本较长的那个——Part I Item 1 几乎必然更长（全套三表 + 注释），
# 所以 Legal Proceedings 这类 Part II 薄内容有可能丢失。
# 对 10-Q 场景这个妥协可接受：Part II 内容通常稀少且多为 "None"。

market: us
form: 10-Q

# section 切分正则（与 10-K 类似，保留 Item N. 格式）
section_detection:
  patterns:
    - '^\s*ITEM\s+(\d+[A-Z]?)\.?\s+(.+?)\s*$'
    - '^\s*Item\s+(\d+[A-Z]?)\.?\s+(.+?)\s*$'
    - '^\s*PART\s+(I{1,2}|II)\s*(?:[\-—–]|\.)?\s*(.*?)\s*$'

# 标准 section 名归一化
# 预处理会跟踪 PART I / II 上下文，所以 key 用 "PartI_Item_N" / "PartII_Item_N"。
# 这样 Part I Item 1 (Financial Statements) 和 Part II Item 1 (Legal Proceedings)
# 互不冲突，各归各位。
section_normalize:
  # Part I — Financial Information
  "PartI_Item_1":    Part_I_Item_1_Financial_Statements
  "PartI_Item_2":    Part_I_Item_2_MDA
  "PartI_Item_3":    Part_I_Item_3_Market_Risk
  "PartI_Item_4":    Part_I_Item_4_Controls
  # Part II — Other Information
  "PartII_Item_1":   Part_II_Item_1_Legal_Proceedings
  "PartII_Item_1A":  Part_II_Item_1A_Risk_Factors
  "PartII_Item_2":   Part_II_Item_2_Unregistered_Sales
  "PartII_Item_3":   Part_II_Item_3_Defaults
  "PartII_Item_4":   Part_II_Item_4_Mine_Safety
  "PartII_Item_5":   Part_II_Item_5_Other_Information
  "PartII_Item_6":   Part_II_Item_6_Exhibits

# 模版剔除规则
skip_rules:
  sections:
    - Part_I_Item_3_Market_Risk           # 对个人分析价值低
    - Part_I_Item_4_Controls              # 标准披露
    - Part_II_Item_3_Defaults             # 通常 "None"
    - Part_II_Item_4_Mine_Safety          # N/A 非矿业公司
    - Part_II_Item_5_Other_Information    # 通常空或样板
    - Part_II_Item_6_Exhibits             # 附件清单
    - Part_I_Item_1_Financial_Statements   # 数字已由 API 入库

  paragraphs:
    - name: Forward-Looking Statements 样板
      pattern: '(?i)forward[- ]looking\s+statements.*?safe\s+harbor'
    - name: Table of Contents
      pattern: '(?i)^\s*TABLE\s+OF\s+CONTENTS\s*$'
    - name: Signatures block
      pattern: '(?i)^\s*SIGNATURES?\s*$'
    - name: Page footer (10-Q)
      pattern: '(?i)^\s*(?:Form\s+10-Q|Quarterly\s+Report)\s*\|?\s*\d+\s*$'

# form detection
form_detection:
  positive:
    - '(?i)FORM\s*10[-‐‑–\s]*Q\b'
    - '(?i)Quarterly\s+Report\s+Pursuant\s+to\s+Section\s+13'
  negative:
    - '(?i)FORM\s*10[-‐‑–\s]*K\b'
    - '(?i)FORM\s*20[-‐‑–\s]*F\b'
    - '(?i)10[-\s]*Q/A\b'

# fiscal_year 提取（10-Q 覆盖期所在的财年）
# 10-Q 封面："For the quarterly period ended September 30, 2025"
fiscal_year_extraction:
  patterns:
    - '(?i)for\s+the\s+quarterly\s+period\s+ended\s+\w+\s+\d{1,2}\s*,?\s*(\d{4})'
    - '(?i)quarterly\s+period\s+ended\s+\w+\s+\d{1,2}\s*,?\s*(\d{4})'
    - '(?i)fiscal\s+quarter\s+ended\s+\w+\s+\d{1,2}\s*,?\s*(\d{4})'
  format: "FY{year}"

# reporting_period：输出原始日期字符串，workflow 层自行换算成 YYYYQN
# 例："September 30, 2025" → workflow 识别 9 月为 Q3 → period_code="2025Q3"
reporting_period_extraction:
  patterns:
    - '(?i)for\s+the\s+quarterly\s+period\s+ended\s+(\w+\s+\d{1,2}\s*,?\s*\d{4})'
    - '(?i)quarterly\s+period\s+ended\s+(\w+\s+\d{1,2}\s*,?\s*\d{4})'
  format: "{raw}"
