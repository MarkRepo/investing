# 主 agent 救回的非 hardcoded WHITELIST 域名沉淀（跨 topic 复用）
#
# 用法：编辑请通过 prism.scripts.web_prescan.promote_to_whitelist(host, reason,
# evidence_mat_ids) API，不要手改 yaml。下方 schema：
#
#   promoted:
#     - host: example.com
#       promoted_at: 2026-05-26T12:00:00Z
#       reason: 行业垂直媒体，多 topic 验证有效
#       evidence_mat_ids: [mat-xxx, mat-yyy]
#
# classify_domain 会自动接入：runtime whitelist 命中后返回 'whitelist' tier。
#
# 撤销用 demote_from_whitelist(host) API。
promoted: []
