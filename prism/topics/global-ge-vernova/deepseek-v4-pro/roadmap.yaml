key_risks_to_monitor:
  - "燃气轮机订单从 29.8GW 回落至 15GW 以下 → 超级周期叙事崩塌"
  - "Siemens/Mitsubishi 大幅扩产 → 三家产能过剩 → 价格战"
  - "天然气价格 >$6/MMBtu 持续 → 燃气轮机 vs 可再生能源竞争力恶化"
  - "AI CAPEX 2027 年见顶 → 新增需求断崖"
  - "GEV 分拆后运营效率改善的'低垂果实'摘完 → 利润率改善停滞"

analogies_to_study:
  - name: "ASML 2018-2025 — 垄断定价权重估"
    analogy: "ASML EUV 100% 垄断 → 市场逐步认识到'垄断不是暂时的而是结构性的' → PE 从 20x→40x。GEV 的 HA-Turbine 重型燃机份额 ~50-60%，虽非完全垄断但寡头格局稳固。如果市场认识到'燃气轮机寡头的定价权是结构性的'，PE 30x 有向 35-40x 迁移的空间。"
    limitation: "ASML GM 50%+ vs GEV GM 20%——利润率天花板不在一个量级。重估的上限更低。"

  - name: "DRAM 2017-2019 — 紧缺→过剩的警示"
    analogy: "三星/SK Hynix/美光三家寡头，2017 年'数据中心需求无限'→三家同时扩产→2018 Q4 价格暴跌。GEV/Siemens/Mitsubishi 三家寡头格局类似——'AI 电力需求无限'的叙事与 2017 年'存储需求无限'高度相似。"
    limitation: "燃气轮机产能扩张周期更长（3-5 年 vs DRAM 1-2 年），服务收入（~45% 营收）提供韧性——但方向性的风险相同。"