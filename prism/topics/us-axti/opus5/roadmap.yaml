key_risks_to_monitor:
  - 出口许可再次收紧导致季度指引下调（2026-01 已发生过一次；2026-08-21 再现延迟报道）
  - 第三次公开增发（前两次自 2025-12 已发行约 1800 万股）
  - CEO(81岁) 继续减持或健康/继任事件
  - 2027Q3 一致预期腰斩兑现（街上模型已嵌入，但市值未反映）
  - 云南锗业 450k 4寸当量产能投放节奏快于预期
  - 2X 单股 ETF(Tradr AXTX/AXTQ) 放大波动，52周区间 $2.68-$143.16

analogies_to_study:
  - name: GT Advanced Technologies 蓝宝石（美国，2013-2014）
    similar: 单一材料、短缺叙事、大客户绑定(Apple)、巨额融资扩产、股价暴涨后崩塌破产
    different: GTAT 有 Apple 排他合同陷阱且设备+材料双业务；AXT 多客户多产品线且已盈利、账上 $749M 现金
    extract: 从"客户绑定公告"到破产仅约 12 个月——绑定不等于安全边际
  - name: 多晶硅（全球，2008 与 2011 两轮）
    similar: 上游材料短缺→价格暴涨→全行业扩产→价格崩塌 90%+→高成本产能出清
    different: 多晶硅无出口管制这一行政变量；技术门槛低于 InP 单晶
    extract: 从价格见顶到毛利率归零的时滞（这是 Bear 情景的兑现节奏）
  - name: MLCC（2017-2019）
    similar: 被动元件短缺→涨价数倍→毛利率翻倍→需求回落+产能投放→利润率腰斩
    different: 纯消费电子周期，无 AI 这类多年结构性需求托底
    extract: 涨价幅度与随后毛利率回撤幅度的对应关系
  - name: DRAM（2017-2019）
    similar: 寡头格局 + 短缺 + 毛利率峰值 → 崩塌
    different: DRAM 资本壁垒极高(数十亿美元/厂)，而 InP 扩产 capex 低 — 这个"不像"恰恰对 AXT 不利
    extract: 反证：资本壁垒高低决定短缺持续期，InP 属低壁垒侧
