thesis_version: 0

# L1/L2 已坍缩进 primer（S2）——背景理解层由 00_primer 全权承担
primer_scope: >
  primer 该覆盖：化合物半导体衬底是什么(InP/GaAs/Ge 三线与各自下游)；VGF 长晶原理与 2"→6" 转换经济学；
  AI 光模块中 InP 的物理位置与单端口用量强度(EML/DFB/CW/超高功率CW 四类激光器之别，CPO 改变的是"用哪类")；
  完整产业链(铟矿→高纯铟→InP多晶→单晶→切磨抛→外延MOCVD→激光芯片→光模块)与各段玩家；
  中国出口管制体系运作(管制清单 vs 许可制 vs 定向禁令，一单一申请流程)；
  AXT/北京通美/十余家原材料JV 的股权结构与少数股东权益如何影响归母利润；
  "短缺租金 vs 结构性成本优势"在财报上的区分法；客户预付款锁产能的会计与商业含义；
  科创板注册停滞四年 vs 港股18C 的制度差别。

learning_track:
  l3_debates:
    - question: InP 短缺是"需求6x vs 供给3-4x 的多年结构性缺口"，还是"2027年中即转向的窗口期"？
      source_hint: >
        三方口径直接冲突：Jason's Chips 需求 CAGR 56%(2026-2030 约6x)；麦肯锡称800G短缺40-60%持续到2027、
        1.6T 30-40%持续到2029；LightCounting 却认为短缺2026年底缓解。而卖方一致预期(ChartMill)自身
        已把 2027Q3 营收从 Q2 的 103.89M 砍到 47.67M(-54%)——街上模型里短缺2027年中结束。
    - question: 44.9% 毛利率是许可造出的"行政租金"，还是真实产能不足的"产业租金"？
      source_hint: >
        决定它消散方式(政策放开=瞬间 vs 产能爬坡=渐进)。唯一硬证据是出口 vs 境内毛利率差，
        而 AXT 从不披露分地区毛利率 → 必须从 transcript 问答 + 10-Q + 中国同行毛利率反推三角测量。
    - question: 中国内销占比>50%且免许可，是对冲了地缘命门的护城河，还是无壁垒红海的低毛利稀释器？
      source_hint: >
        多头(反方2)视其为许可风险的自然对冲、指引到60%；空方视其为直面云南锗业/先导、
        无许可壁垒的普通竞争位。境内毛利率是判据。
    - question: AXT"低于计划的 capex 把产能翻三倍"，究竟是 know-how 护城河的证据，还是"人人可扩"的证据？
      source_hint: >
        同一句话两种读法指向相反结论(命门2)。需单位产能capex($ capex ÷ $季度产能增量)
        与良率/单炉产出，AXT vs 云南锗业 vs 住友 同口径对比。
    - question: 通美转港股是"估值解锁"，还是把同一批治理问题(关联交易定价、无实控人、商业秘密刑案)换个市场再问一遍？
      source_hint: >
        科创板卡四年的两大障碍(通美售AXT 483元/片 vs AXT转售1275元/片的2.6倍价差；山东国晶商业秘密刑案)
        不因换市场消失；且通美另背少数股东回售(put)义务。

  l4_hunting:
    - question: 2026Q3/Q4 与 2027H1 的 InP ASP 与毛利率轨迹会走哪条路径？跌破38%的时点市场隐含在何时？
      addresses: [K1]
      search_keywords: [AXT 毛利率 指引, InP 衬底 价格 2027, InP substrate ASP trend]
      source_hint: 季度财报+transcript；对照 ChartMill 季度一致预期(Q3/27 EPS 0.14)反推市场隐含路径
    - question: AXT 产能兑现($60M/季@2026年底、$130M/季@2027年底)与实际营收的背离，最早在哪个季度可观测？
      addresses: [K2]
      search_keywords: [AXT InP 产能 扩产, AXT capacity expansion 2027, 磷化铟 产能 投放]
      source_hint: 产能达标但营收未同步=产能空转/降价保量，即供给过剩已发生
    - question: 中国境内 InP 衬底售价与毛利率 vs 出口口径差多少？mix 转向60%境内会稀释多少整体毛利率？
      addresses: [K3]
      search_keywords: [磷化铟 衬底 国内 价格, 云南锗业 磷化铟 毛利率, InP 衬底 内销 报价]
      source_hint: 命门1与命门3的交汇点；用中国同行(云南锗业/先导)公开毛利率反推境内价格带
    - question: 出口许可发放节奏有无可观测的领先指标？2026Q3/Q4 是否再现2026-01 式的指引下调？
      addresses: [K4]
      search_keywords: [磷化铟 出口许可 商务部, AXT export permit delay, 锗 磷化铟 出口 延迟]
      source_hint: 2026-08-21 已现延迟报道(Wedbush 警告)；连续两季受限即证实"许可即命门"
    - question: 云南锗业/住友/Coherent/先导 中哪一家会最先公开披露 InP 降价或产能利用率不足？
      addresses: [K5]
      search_keywords: [云南锗业 磷化铟 扩产 产能, 住友电工 InP 衬底 产能, Coherent InP 6 inch ramp]
      source_hint: 任一出现即供给周期见顶信号；云南锗业已承诺450k 4寸当量、2030占全球近半
    - question: 通美港股递表时点？招股书是否修正关联交易定价？AXT持股对应市值 vs 当前 AXTI 市值孰高？
      addresses: [K6]
      search_keywords: [北京通美 港股 递表, 通美 H股 招股书, 通美 关联交易 定价]
      source_hint: 若港股挂牌且持股对应市值>AXTI市值，多头"估值解锁"成立、目标价须上修
    - question: 内部人是否继续减持？是否出现第三次增发？81岁CEO的继任安排何时公布？
      addresses: [K7]
      search_keywords: [AXT Form 4 insider selling, AXTI 增发 offering 2026, Morris Young succession]
      source_hint: 第三次增发=资本周期顶部确认；继任公布=治理折价收敛

