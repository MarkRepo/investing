key_risks_to_monitor:
  - ESMO 2026（约 10 月）P3 完整数据披露 —— 最大单点事件
  - INTerpath-002（NSCLC）与首个冷肿瘤（RCC/NMIBC）读出
  - 暴涨后增发 / shelf 登记 / 内部人减持
  - HHS/ACIP 对 mRNA 的进一步限制（呼吸道分部）
  - Merck 对 Moderna 或 INT 权益的收购/买断
  - 诺如 mRNA-1403 与丙酸血症 pivotal 读出（2026 内）
  - 8/19 单日 +177% 后的高波动本身（期权伽马、被动资金再平衡）

analogies_to_study:
  - name: Dendreon / Provenge（美国·治疗性前列腺癌疫苗·2010-2014）
    logic: 拿到 OS 阳性并获 FDA 批准的"癌症疫苗"，仍因个体化制造成本、产能投入过重与给药复杂度走向破产
    limits: Provenge 未与 PD-1 联用、疗效幅度远弱于 INT P2b；INT 有 Merck 分摊成本与 Keytruda 渠道
  - name: CAR-T 首批获批后的平台重估（Kite/Juno·2016-2018）
    logic: 平台型疗法首胜后估值飙升并引发大药企并购（Gilead 收 Kite、Celgene 收 Juno）——与"Merck 可能买断"路径同形
    limits: CAR-T 疗效是完全缓解级别（血液瘤），远强于辅助治疗的 RFS 改善
  - name: Moderna 自身 2021 泡沫（$497 → $22）
    logic: 把单一产品的成功外推为整个平台的可复制性，估值先行于兑现
    limits: 2021 时 COVID 收入是真实的 $180 亿级现金流；今天 INT 收入为零
