# L1/L2 已坍缩（S2）：背景理解层全权交给 00_primer
primer_scope: >
  primer 该覆盖：mRNA 平台机理与 LNP 递送、个体化新抗原疗法全工作流、预防性 vs 治疗性疫苗的商业模式差异、
  肿瘤"热/冷"谱系与新抗原可及性、RFS/DMFS/OS 终点与 HR 读法、pre-profit 生物科技的 rNPV 估值方法、
  Moderna 收入构成与 COVID 断崖形态、Merck 合作经济结构、COVID/RSV/流感三市场格局、
  美国疫苗"获批→ACIP→CDC→支付方"变现链条及其 2025-26 断点。

learning_track:
  l3_debates:
    - question: P3 达标究竟是"平台跨瘤种验证"的结构性重估，还是单一适应症事件被外推过度？多空分歧的落点在"新抗原数量是否为疗效限速步骤"。
      source_hint: merck 官方稿 + fiercebiotech 卖方评论 + 免疫学综述（新抗原负荷 vs 疗效相关性）
    - question: 共识目标 $42.13（17 家 Reduce）是 P3 前的滞后存量，还是已包含对 2040 远期现金流的合理折现？两类目标价必须分开取，否则拿错锚。
      source_hint: marketbeat/marketscreener 共识 + William Blair/Guggenheim post-P3 notes
    - question: 个体化生产（每患者一批、约 4 周周转）在商业规模下是护城河（难复制）还是成本陷阱（毛利被制造吞掉）？
      source_hint: Dendreon/Provenge 复盘 + BioProcess Insider 产能报道 + 10-K COGS 结构
    - question: 股价暴涨后的增发窗口，是解除了现金跑道风险，还是只把稀释成本前置？（这是本 thesis 最大反方）
      source_hint: 10-Q financing activities + shelf registration + 历史增发记录
    - question: HHS/ACIP 的 mRNA 敌意对"肿瘤业务"是否根本不适用？（INT 作为肿瘤治疗药走 CMS/Part B 与商保，不经 ACIP 疫苗推荐机制）——若成立，我的政策折价论据只适用于呼吸道分部。
      source_hint: CMS 报销路径资料 + hhs.gov 公告边界（"Other uses of mRNA technology not impacted"）

  l4_hunting:
    - question: INTerpath-001 的 P3 完整数据（RFS/DMFS 的 HR、CI、亚组、安全性）何时何处披露？当前价隐含的 HR 是多少？
      addresses: [K1]
      search_keywords: [INTerpath-001 HR, ESMO 2026 intismeran, melanoma RFS hazard ratio]
      source_hint: ESMO 2026 (10月) abstracts、NEJM/Lancet、Merck 投资者电话会
    - question: INTerpath-002（NSCLC 辅助）主要终点读出时点，以及市场当前隐含的成功概率是多少？
      addresses: [K2]
      search_keywords: [INTerpath-002 NSCLC, mRNA-4157 lung readout, adjuvant NSCLC timeline]
      source_hint: clinicaltrials.gov、Moderna Oncology deck、卖方 onco 模型
    - question: 首个"冷/中间"肿瘤（RCC / NMIBC / HNSCC）读出的节奏与生物学先验如何？低 TMB 瘤种为何仍可能有效？
      addresses: [K3]
      search_keywords: [INTerpath-004 RCC, INTerpath-011 NMIBC, neoantigen cold tumor]
      source_hint: urotoday/ESMO TiP 摘要、clinicaltrials.gov、免疫学综述
    - question: 暴涨后是否已出现增发/shelf/大股东减持/并购接触信号？稀释幅度与时点如何？
      addresses: [K4]
      search_keywords: [Moderna equity offering 2026, Merck acquire Moderna, MRNA shelf registration]
      source_hint: SEC 8-K/S-3、Form 144、10-Q financing activities
    - question: 2027 年末现金路径与 2028 breakeven 的具体构成（营收增速/COGS/R&D/SG&A 各降到多少）是否自洽？
      addresses: [K5]
      search_keywords: [Moderna 2027 cash guidance, breakeven 2028 cost structure]
      source_hint: 10-Q MD&A、Analyst Day deck、seekingalpha 指引摘要
    - question: Merck 合作的会计口径究竟是"Moderna 记 50% 销售"还是"仅在合作损益行记 50% 净利"？卖方 $54 亿口径对得上哪一种？
      addresses: [K6]
      search_keywords: [Moderna Merck collaboration revenue recognition, profit share accounting]
      source_hint: 10-K item_1_business + item_8_financial 附注（已入库 mat-df9859/mat-de0507）

