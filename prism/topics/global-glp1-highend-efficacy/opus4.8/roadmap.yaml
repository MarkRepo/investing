# roadmap.yaml — 研究路线图 (workflow 01, arena)
slug: global-glp1-highend-efficacy
variant: opus4.8
created: 2026-07-24

# L1/L2 坍缩为 primer scope（背景交 00_primer）
primer_scope: >
  primer 该覆盖：GLP-1→双靶(GIP)→三靶(GCGR)→amylin combo 的机理演进与疗效阶梯；
  各机理"多减的那部分从哪来"；减重 Phase 3 读出该看哪些数（安慰剂调整%/达标率/停药率/AE谱）；
  高端疗效池在整个减重利润池的相对位置；玩家×候选药×读出阶段地图；疗效领先≠商业领先的三断点；
  疗效生理上限（对照减重手术25-35%）；高端定价逻辑与净价压制来源(IRA/TrumpRx/PBM)。

learning_track:
  l3_debates:   # 争议层：展开 thesis 反方
    - question: retatrutide 疗效独占是"临床成立"还是"商业成立"？GCG 安全窗迫使商业剂量下移的概率有多大？
      source_hint: TRIUMPH 完整安全性谱 + FDA label 草案 + KOL 处方倾向
    - question: 疗效竞争是否已近生理上限、战场正从"减重%"转向给药频率/口服/减重质量？若是，LLY 疗效护城河边际价值几何？
      source_hint: amylin body composition 数据 + MariTide 月频定位 + 口服疗效对照
    - question: 高端疗效 → 利润溢价的转化在净价压制下是否成立？疗效赢家会不会不是利润赢家？
      source_hint: IRA第二批/TrumpRx/Medicare Bridge 净价路径 + PBM formulary
    - question: 挑战者被并购整合进大药厂后，是加速对 LLY 的挑战还是被雪藏？VKTX 的并购期权价值如何定价？
      source_hint: VKTX 现金跑道 + 潜在买家 + 历史 biotech 并购整合案例
    - question: 市场是否已把 retatrutide 兑现 price-in 进 LLY 估值？共识 vs 我的分歧点在哪？
      source_hint: LLY forward PE + 卖方 obesity 板块估值表 + 一致预期

  l4_hunting:   # 狩猎层：逐 K# 对齐
    - question: retatrutide 完整 TRIUMPH 项目群最高剂量的停药率/心率/dysesthesia 是否可控到不迫使商业剂量下移？
      addresses: [K1]
      search_keywords: [retatrutide TRIUMPH safety, 最高剂量 停药率, dysesthesia 心率]
      source_hint: LLY IR + NEJM/Lancet TRIUMPH 论文 + FDA label
    - question: VANQUISH-2 顶线 / amycretin Phase 3 / MariTide III / 罗氏 CT-388 任一能否在疗效+耐受双轴逼平 retatrutide？
      addresses: [K2]
      search_keywords: [VANQUISH-2 topline, amycretin Phase 3, MariTide 双轴]
      source_hint: 各公司 IR + ClinicalTrials.gov + ADA/EASD 会议
    - question: 高端疗效药能否在 IRA/TrumpRx 净价压制下守住溢价、把疗效领先转化为利润领先？
      addresses: [K3]
      search_keywords: [obesity net price 2026, Medicare GLP-1 Bridge, tirzepatide 净价]
      source_hint: STAT/Endpoints + CMS + PBM formulary
    - question: retatrutide 兑现是否已 price-in 进 LLY 估值？VKTX 并购期权的介入时点/binary 风险如何定？
      addresses: [K4]
      search_keywords: [Lilly forward PE 2026, VKTX 估值 并购, obesity 板块 一致预期]
      source_hint: Yahoo Finance + 卖方估值表 + financial_data peer 横比

