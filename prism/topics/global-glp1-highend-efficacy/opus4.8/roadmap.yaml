key_risks_to_monitor:
  - retatrutide 真实世界耐受性劣于试验→商业剂量下移→疗效独占在处方端缩水
  - VANQUISH-2/amycretin 顶线意外强→arena 从独占变多雄→shortlist 洗牌
  - IRA/TrumpRx 净价压制超预期→高端溢价压平→疗效赢家非利润赢家
  - LLY 估值高位→疗效兑现已 price-in→上行有限而下行 binary

analogies_to_study:
  - name: PCSK9 抑制剂疗效竞赛（美国/降脂/2015-2020）
    logic: 疗效数据强(LDL大幅下降)但高定价+支付方限制→放量远低于预期，疗效领先未转化为商业成功
    limit: PCSK9 无口服/减重的消费属性拉动；GLP-1 需求端远更强
  - name: 丙肝直接抗病毒(DAA)疗效竞赛（美国/2013-2018）
    logic: Gilead 疗效领先(治愈率>95%)但后发者(AbbVie)价格战+治愈即缩池→利润塌陷
    limit: 减重是慢病长期用药，非一次性治愈，池不自我消灭
  - name: 胰岛素/糖尿病用药迭代（长期）
    logic: 疗效领先者被平价 biosimilar 逐步侵蚀，净价长期承压
    limit: 高端减重仍在专利保护期早段，biosimilar 侵蚀是远期
