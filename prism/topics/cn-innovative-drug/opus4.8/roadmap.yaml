key_risks_to_monitor:
  - "头部资产全球III期失败（出海逻辑证伪）"
  - "2026 BD总额同比大幅回落（持续现金流叙事弱化）"
  - "国内支付端改善不及预期（丙类体量有限）"
  - "板块估值透支后回调（TOP10集中、尾部拖累）"

analogies_to_study:
  - case: "中国PD-1价格战与me-too泡沫（2018-2022）"
    logic: "同样'热门靶点扎堆→国谈降价→商业化天花板'剧本，验证me-too如何利润不兑现"
    limit: "当下出海+best-in-class比例高于当年纯国内me-too"
  - case: "2021上一轮港股18A泡沫破裂（2021-06高点→2024-08低点恒生医疗暴跌）"
    logic: "同板块上一轮'估值透支→戴维斯双杀'，验证当前牛市是否重演"
    limit: "本轮有真实BD现金流与扭亏支撑，基本面强于上一轮"
  - case: "仿制药集采（VBP）对传统药企的利润挤压（2018起）"
    logic: "政策定价权对行业利润池的重塑，理解为何被迫转创新"
    limit: "针对仿制非创新；但解释创新药估值溢价来源"
