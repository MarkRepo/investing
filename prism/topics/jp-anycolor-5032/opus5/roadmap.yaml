primer_scope: >-
  primer 该覆盖：VTuber 事务所商业模式的工业化机理与固有脆弱点；ANYCOLOR 四分部（コマース65%/プロモーション16%/
  ライブストリーミング12%/イベント7%）驱动因子与毛利分层；轻资产抽成 vs COVER 重资产自制两种范式；限定周边的
  "生鲜食品"特性与棚卸評価損 会计机理；liver 生命周期（1万人audition→半年~1.5年培养→出道→头部→卒業）；
  4月期财年 + 强季节性（Q3峰/Q4谷）与跨 COVER（3月期）比较的口径陷阱；营业杠杆反向作用；YouTube 单平台依赖与
  SuperChat 见顶；高利润率轻资产 IP 公司的估值锚（EV/EBIT为主、PBR近乎无意义）；日本市场对"减配"的信号解读传统。

