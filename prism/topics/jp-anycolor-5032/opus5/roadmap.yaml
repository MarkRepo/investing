key_risks_to_monitor:
  - 营益率跌破 31%（会予 32.8% 已在临界点）→ 成熟度税坐实，熊市情景 ¥1,929
  - commerce 同比转负 或 ANYCOLOR ID 增速 <+10% → 需求饱和
  - FY2027/4 继续计提棚卸資産評価損 → 需求预测失灵常态化
  - 公司以业绩为由不达 ¥300亿股东回报承诺 → 下行托底失效 + 治理折价扩大
  - 头部 liver 集中卒業 → commerce 需求端直接失血（COVER 已示范此路径）
  - 分析师预想（净利 ¥15,049百万）继续向会予（¥13,011百万）收敛 → 估值锚下移
  - 上行风险（做空/减仓侧）：¥50亿+ 新回购决议落地；Q1 营益降幅显著好于 -18%

analogies_to_study:
  - name: COVER株式会社 / hololive（日本 · VTuber · 2025-2026）
    logic: >-
      同赛道、同期、更早一个身位：营益率 18.4%→14.3%、营业利益上市来首次转负（-11.8%）、
      物販 Q4 -13.5%、股价创上場来安値。失败模式=IP 龙头在全赛道退潮中被"增长降档+费用刚性"双杀。
    limits: >-
      COVER 是重资产（自建 studio/演唱会/自研制作 → 折旧刚性），ANYCOLOR 投资 CF 仅 -¥2.8亿；
      且 COVER 有人气 talent 卒業（Gawr Gura 等）作为直接诱因，ANYCOLOR liver 数仍净增 +9。
      → 类比的是"利润率下行的路径形态"，不是"成因"。
    mirror_ring: historical-mirror
    material_status: fetched（复用亲属 topic 全套 + set_parent_materials 已登记）
  - name: 日本高利润率内容/手游公司的旗舰 IP 见顶（如 コロプラ/ミクシィ·モンスト/gumi 模式，2015-2020）
    logic: >-
      单一旗舰 IP 撑起 30-40% 营益率 → 增长见顶后，为寻找第二曲线而扩张组织与投入，
      费用刚性上升遇收入平台期 → 营益率与估值倍数双杀，PER 从 20x+ 压到 8-12x。
      与 ANYCOLOR 当前形态高度同构（にじさんじ 单 IP 占绝对多数 + 组织从 506→621 人）。
    limits: >-
      手游 IP 是单一产品、生命周期由玩家流失曲线决定；VTuber 的"IP"是人+品牌的组合，
      可持续出道新血（179人 +9）、ID 基数仍 +20.6% → 折旧速度理论上慢于手游。
    mirror_ring: historical-mirror
    material_status: pending（tier2 新增 todo，Step 5.6 当场抓）
  - name: 角色周边/景品公司的限定品库存周期（Good Smile / バンダイ 周边业务）
    logic: >-
      限定周边"生鲜食品"特性 → 大型施策备货过度 → 评价损 + 毛利率下滑。
      ANYCOLOR Q3 ¥9.7亿 + Q4 ¥18亿 评价损 + 粗利率 -2.2pt 正是这个剧本。
    limits: >-
      ANYCOLOR 预订制比例高、库存绝对额小（棚卸資産 ¥52.2亿 / 营收 ¥557亿 = 9.4%），
      且已主动改严评价基准 → 暗雷密度低于典型周边制造商。
    mirror_ring: historical-mirror
    material_status: partial（tier3 可比公司料 1 家）
