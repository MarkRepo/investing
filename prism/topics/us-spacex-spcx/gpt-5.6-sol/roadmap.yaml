# roadmap.yaml — 研究路线图
slug: us-spacex-spcx
created: 2026-07-15

# L1/L2 坍缩为 primer_scope；背景理解交给 00_primer。
primer_scope: >
  primer 该覆盖：SpaceX 2026 年后 Connectivity/Space/AI 三分部边界及同一控制并表口径；Falcon 9
  重复使用的成本、周转与可靠性飞轮；内部 Starlink 发射为何不能等同外部发射收入；Starlink 的卫星寿命、
  波束容量、网关、频谱、终端补贴和用户密度经济学；消费者/企业/航空/海事/政府/Direct-to-Cell 场景差异；
  Starship 与 Falcon/下一代 Starlink 的关系；NASA/Space Force/NRO 合同与商业发射差异；营业利润、segment
  EBITDA、经营现金流和扣除维持性/增长性 capex 后 FCF 的区别；卫星网络资本密集陷阱；双层股权、controlled
  company、同一控制合并与关联交易；SpaceX 的 reverse-DCF/SOTP/概率加权技术期权估值方法。

learning_track:
  l3_debates:
    - question: Starlink 是可持续高回报现金牛，还是把卫星更替和终端补贴藏在 capex/折旧后的“高利润、低股东 FCF”网络？
      source_hint: 424(b)(4) 分部利润、合并现金流、Connectivity capex 与卫星寿命/补星节奏
    - question: xAI/X 与 SpaceX 的集团化是可审计的技术协同，还是利用绝对控制权把 Starlink 现金流转移给高风险 AI 资本开支？
      source_hint: S-1 同一控制交易、关联交易、AI 分部亏损/capex、董事会治理与资本承诺
    - question: Starship 是被市场低估的成本革命，还是成功时间远于市场模型、持续吞噬资本的长久期陷阱？
      source_hint: FAA 事故/许可、Flight 任务记录、复用证据、R&D/capex 与商业任务计划
    - question: 约 136 美元究竟隐含了 Starlink、Starship 与 AI 三线同时成功，还是单靠 Connectivity 基准情景已能支撑当前 EV？
      source_hint: SEC 完全稀释股本/净现金、卖方 2030/2040 预测、分部 reverse-DCF 与 SOTP
    - question: 82.4% 投票控制、controlled-company 豁免和提前解禁是合理创始人治理，还是应永久计入少数股东折价？
      source_hint: 424(b)(4) beneficial ownership/related parties/shares eligible、Form 4、双层股权历史案例

  l4_hunting:
    - question: Connectivity 在未来四个季度扣除补星、地面网络和终端相关 capex 后，是否能连续形成正的分部近似自由现金流？
      addresses: [K1]
      search_keywords: [Starlink FCF capex, Connectivity cash flow, satellite replacement cost]
      source_hint: SpaceX 10-Q/10-K 分部注释与现金流，Starlink 用户/ARPU/卫星更新资料
    - question: Space 与 AI/X 的现金消耗是否在 24 个月内收敛到 Starlink 可覆盖范围，IPO 资金实际流向哪里？
      addresses: [K2]
      search_keywords: [SpaceX AI capex, xAI operating loss, IPO use proceeds]
      source_hint: 424(b)(4) MD&A/notes/related parties，后续 10-Q 和资本开支披露
    - question: 到 2027 年中 Starship 能否连续完成至少三次关键任务成功，并出现硬件复用与商业载荷节奏？
      addresses: [K3]
      search_keywords: [Starship flight record, FAA mishap license, Starship commercial payload]
      source_hint: FAA、SpaceX、NASA HLS、任务清单与硬件编号
    - question: 以 SEC 完全稀释股本和 IPO 后净现金反推，现价需要哪些 2030 收入/利润率、终值与 Starship/AI 成功概率？
      addresses: [K4]
      search_keywords: [SPCX diluted shares, SpaceX analyst model, SpaceX reverse DCF]
      source_hint: 424(b)(4) capitalization/dilution + 至少五家卖方 initiation + 自建 SOTP
    - question: Musk 控制、关联交易、未来增发和提前解禁是否已发生可量化的少数股东价值转移或持续供给冲击？
      addresses: [K5]
      search_keywords: [SpaceX related party, SPCX insider sale, SPCX lockup dilution]
      source_hint: SEC related-party/proxy/Form 4/8-K、锁定协议与治理批评文件

