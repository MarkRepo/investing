key_risks_to_monitor:
  - 首份上市后 10-Q：Connectivity/Space/AI 分部收入、利润、经营现金流与 capex
  - Starlink ARPU、净增用户、终端补贴和卫星更替 capex 是否出现利润/现金流背离
  - AI/X 月度现金消耗、关联交易和 IPO 募资用途是否超出招股书基准
  - Starship 连续任务成功、硬件复用、FAA 调查/许可和商业载荷节奏
  - 完全稀释股本、未来重大增发、提前解禁与 Form 4 内部人出售
  - 政府合同取消/延迟、客户集中度和国家安全监管变化

analogies_to_study:
  - case: Iridium 与 Globalstar 第一轮信用周期（美国/移动卫星通信/1990s–2000s）
    analogy: 巨额前置星座 capex、过高需求/ARPU 假设、技术成功但资本结构和商业需求不匹配
    limitation: Starlink 已有更大用户规模、低成本自有发射和更广终端场景
  - case: OneWeb 破产与重组（全球/LEO 宽带/2012–2020）
    analogy: 星座部署必须持续融资，发射与商业化错配会在网络完成前触发流动性危机
    limitation: SpaceX 自有发射、IPO 现金和 Starlink 现有收入显著降低融资依赖
  - case: Meta Reality Labs 与 Alphabet Other Bets（美国/受控科技平台/2015–至今）
    analogy: 高利润核心业务长期补贴创始人主导的高风险期权，治理结构让外部股东难以约束资本配置
    limitation: SpaceX 的 Starship/AI 与核心网络可能存在更强技术协同，且政府任务具战略属性
