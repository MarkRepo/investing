# 关键监控风险（K# 证伪锚）
key_risks_to_monitor:
  - "K1: FY26/27 Connectivity 分部 FCF 披露；集团 FCF 转正时点 vs 2029 偏移 ≥12 个月"
  - "K2: 季度 AI 分部营业亏损环比（–$6.4B 年化基准）；xAI 去并表或新增数十亿美元资本承诺"
  - "K3: FAA 复飞后连续成功入轨节奏 + 2027 前首个商业载荷；再现事故/停飞则时钟右移"
  - "K4: SOTP 隐含合理值 vs 现价差；$240 目标兑现度；锁定期/供给驱动 de-rating"
  - "K5: 关联交易规模披露；被引去 xAI 的资本量；少数股东保护条款实际强度"

# 历史类比（→ 环⑤ historical-mirror）
analogies_to_study:
  - name: Iridium（美国·LEO 卫星电话·1998-1999 破产）
    logic: 重资本 LEO 星座、技术领先但单位经济与需求错配，营业利润未穿透为现金即破产
    limits: SpaceX 有 Falcon 自建发射降本 + 宽带需求真实且高增，非语音利基
  - name: OneWeb（英国·LEO 宽带·2020 破产后重组）
    logic: 补网 capex 黑洞 + 融资中断，直接对照 Starlink 5 年卫星寿命的现金消耗
    limits: OneWeb 无自有发射、无 D2C、规模远小于 Starlink
  - name: Globalstar（美国·LEO·Iridium 破产后长期困顿）
    logic: 重资本卫星网络长期难产生自由现金流的镜鉴
    limits: 频谱/商业模式与 Starlink 差异大，Starlink 已实质盈利于分部层
