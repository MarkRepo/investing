# L1/L2 已坍缩为 primer_scope（S2）：背景理解交 00_primer 承担
primer_scope: >
  primer 应覆盖：激光+自动化装备在锂电制造中段(模切/制片/装配/焊接/化成分容)的工序位置与"设备价值量随工艺迭代跃升"机理；
  海目星四业务(锂电/消费电子/光伏/钣金)周期对冲结构；"新签/在手/营收"三口径时滞与验收确认制；
  "发出商品/合同负债/应收账龄"三科目如何反映验收兑现节奏与回款质量(现金流为何与净利背离)；
  固态"路线无关卖铲人"叙事(干法电极/等静压/超薄涂布增量)+ 双技术路线(氧化物+锂金属 vs 硫化物+硅碳)差异；
  全固态产业化阶段(中试/小批量放量前夜)与"订单→收入"时滞(2027-2028)；出海高毛利(境外49% vs 境内18.74%)成因；
  欣界能源"投资+整线供货"协同；重投入重资产设备商在景气上/下行的双面性。

