key_risks_to_monitor:
  - 半年报账龄再恶化 / 存货集中计提爆雷（父层K5硬过滤复活 → 降仓/退出）
  - 固态概念退潮动能未止，52周低继续破位（PB破40止损位）
  - 实控人一致行动人后续再减持（泰安海合仍持2.82%+盛世海康15.78%可流通；本轮减2.83亿已核实）
  - Q1薄利润靠合同负债/预收款，新签放缓则现金流反噬
  - Xteg/Leister并购商誉减值

analogies_to_study:
  - 案例: 先导智能/利元亨 锂电设备(CN, 2018-2021)
    类比逻辑: 设备商在电池扩产周期后期同样堆积应收/存货，扩产放缓时验收延后、集中计提减值——海目星2025首亏8.8亿是否在重演设备商"扩产尾部利润坑"
    类比局限: 海目星多曲线(固态/AI液冷/出海)对冲更多，且当前在拐点验证期而非景气顶部
  - 案例: 光伏设备"卖铲人"技术迭代(CN, 晶盛/迈为 PERC→TOPCon→HJT)
    类比逻辑: 设备价值量随工艺跃升的"卖铲人"叙事，与固态"路线无关卖铲人"同构；押错路线/客户扩产不及预期的设备商如何被证伪
    类比局限: 固态放量节奏(2027-2028)比光伏迭代更慢更不确定，海目星双路线布局分散押注
  - 案例: 消费电子自动化设备出海高毛利(CN, 3C设备商)
    类比逻辑: 境外毛利显著高于境内的可持续性——订单结构(高端封装 vs 国内低价整线)驱动 vs 竞争加剧回落
    类比局限: 海目星出海规模仍小(+213%但基数低)，Xteg并购整合尚早
