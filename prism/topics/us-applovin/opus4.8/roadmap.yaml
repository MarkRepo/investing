key_risks_to_monitor:
  - "SEC 调查升级为实质执法 / 收入重述（触发熊市 $220-260）"
  - "Apple/Google 应用商店政策行动 → SDK 下架"
  - "Q2 2026(8/5) 增速掉档或指引下修 → 杀估值"
  - "电商 self-serve 公开发布后广告主留存/ROAS 不及预期"
  - "beta 2.48 + AI 板块 risk-off 无差别抛售"

analogies_to_study:
  - name: "Criteo（法国 adtech，2018-2021）"
    logic: "同为效果广告/归因驱动，iOS/隐私新政前享归因红利、后增长失速估值坍塌"
    limit: "Criteo 依赖第三方 cookie/retargeting，AXON 是自有 SDK+AI 引擎，护城河机理不同"
  - name: "iOS ATT 冲击（2021-2023，全移动广告）"
    logic: "隐私政策一夜改变移动广告归因，重创依赖信号的玩家"
    limit: "AXON 的建模能力被认为部分对冲了信号损失，反而受益于对手受损"
  - name: "高飞叙事成长股 de-rate（如 2021-2022 SaaS/2000 dotcom）"
    logic: "PEG 便宜的高增速股一旦增速掉档，杀估值幅度远超杀盈利"
    limit: "APP 有真实巨额 FCF 与盈利，非烧钱叙事股，安全边际更高"
