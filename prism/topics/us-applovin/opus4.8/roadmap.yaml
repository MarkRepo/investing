thesis_driven: v0

# L1/L2 已坍缩为 primer_scope（背景理解交给 00_primer）
primer_scope: >
  primer 该覆盖：AppLovin 现在是什么生意（纯 AI 广告平台，剥离手游后）；AXON 引擎的自学习机理与数据飞轮；
  广告技术栈分层（推荐/DSP=AXON+AppDiscovery、聚合中介=MAX、归因=Adjust）；效果广告"归因"是什么、
  "过度归因"争议为何存在、如何用增量测试/MMM 验证；iOS ATT 对移动广告的冲击与建模对冲；
  电商 performance 广告 TAM vs 手游广告 TAM 的差异与跨界难点；高毛利广告平台的估值方法论
  （为何用 forward P/E vs 增速 / PEG / EV/FCF，P/B 为何失效）；创始人主导型高波动成长股的特有风险。

learning_track:
  l3_debates:         # 争议层：分歧在哪，各方逻辑（展开 thesis 反方）
    - question: "AXON 电商效果是'真增量 ROAS'还是空头指控的'过度归因/抄 Meta 作业窃取归因功劳'？这是多空最核心分歧。"
      source_hint: "空头报告(Fuzzy Panda/Culper) vs 公司反驳 + 广告主增量测试案例(workmagic True Classic)"
    - question: "$6B+ 收入体量上 50-59% 的增速能否持续，还是大数定律下即将掉档？共识(卖方均价$668)是否过度外推？"
      source_hint: "Q2 2026 指引(+52-55%) vs 卖方模型 + 历史 adtech 增速衰减曲线"
    - question: "SEC 调查 + 应用商店合规风险，结局是可控的披露/实践整改，还是实质执法/收入重述/SDK 下架？"
      source_hint: "证券集体诉讼 5:25-cv-03438 进展 + SEC/隐私调查报道 + 历史 adtech 处罚镜鉴"
    - question: "forward P/E 22.6x / PEG 0.61 到底是'错杀的便宜'还是'高增速股杀估值(先于杀盈利)的陷阱前夜'？"
      source_hint: "卖方估值桥 + 高飞成长股 de-rate 案例 + beta 2.48 情绪属性"

  l4_hunting:         # 狩猎层：逐条对齐 thesis K#
    - question: "AXON 6 月全球公开自助发布后，consumer(电商)垂直的广告主数/支出能否持续环比放量，还是见顶？下季度环比增速多少？"
      addresses: [K1]
      search_keywords: [AppLovin consumer vertical, AXON self-serve advertiser, e-commerce ad spend]
      source_hint: "Q2 2026 财报(8/5) + IR + 卖方电商拆解"
    - question: "SEC 调查/数据隐私调查是否出现正式指控、和解金或 Apple/Google 应用商店政策行动？隐含的监管概率与影响量级？"
      addresses: [K2]
      search_keywords: [AppLovin SEC investigation, AppLovin app store policy, AppLovin lawsuit ruling]
      source_hint: "Reuters/Bloomberg + 集体诉讼 docket + SEC filings"
    - question: "有无第三方增量测试/MMM 证据显示 AXON 是真增量而非过度归因？大广告主是公开背书还是流失？CTR 30-40% 异常性是否被证实/证伪？"
      addresses: [K3]
      search_keywords: [AppLovin incrementality test, AXON attribution MMM, AppLovin advertiser churn]
      source_hint: "广告主案例/adtech 媒体/行业访谈 + 公司归因差异解释"
    - question: "广告平台营收同比增速能否稳在 30-40%+？Q2 2026(8/5) 是否验证 +52-55% 指引？后续减速斜率？"
      addresses: [K4]
      search_keywords: [AppLovin Q2 2026 revenue growth, AppLovin advertising revenue, AppLovin guidance]
      source_hint: "Q2 2026 财报 + 卖方增速模型"
    - question: "电商规模化(更依赖销售、可能更低毛利)后，85% adj EBITDA margin / 77% 营业利润率 / FCF 转化能否维持？"
      addresses: [K5]
      search_keywords: [AppLovin EBITDA margin, AppLovin operating leverage, AppLovin FCF conversion]
      source_hint: "10-Q/10-K MD&A + 电话会 margin 指引"
    - question: "Meta/Google/The Trade Desk/Unity 是否侵蚀 AXON 在中小/电商广告主的效果优势？迁移/eCPM 相对下滑证据？"
      addresses: [K6]
      search_keywords: [AppLovin vs Trade Desk, AppLovin competition Meta Google, AXON competitive moat]
      source_hint: "竞品财报/adtech 媒体/广告主渠道对比"

