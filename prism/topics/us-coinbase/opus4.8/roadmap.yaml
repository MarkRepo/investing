key_risks_to_monitor:
  - Q2'26 财报(2026-07-30)：S&S 占比是否续升、交易量是否触底、是否续亏
  - CLARITY Act 参议院最终文本对稳定币收益的裁决
  - BTC 跌破关键支撑引发交易量二次探底
  - take rate 连续 2 季下滑（结构性侵蚀信号）
  - 降息路径压缩稳定币利息收入

analogies_to_study:
  - 案例: Coinbase 自身 2022 加密熊市（美国/加密交易所/2022-2023）
    类比逻辑: 上一轮周期崩塌中收入/股价跌幅与后续恢复路径，检验"周期底部买入"均值回归假设
    类比局限: 2022 时收入多元化程度更低、无 ETF 托管/Deribit/S&P500，franchise 更弱
  - 案例: 传统券商/交易所周期底部（如 2008-09 嘉信/ICE、2020 疫情低点）
    类比逻辑: 顺周期金融平台在成交低谷期的估值与恢复弹性
    类比局限: 加密波动率与监管不确定性远高，beta 3.35 非传统金融可比
  - 案例: 顺周期平台的价值陷阱（如部分 fintech/交易平台高估值后长期不兑现）
    类比逻辑: 警惕"周期底部"实为结构性衰退（take rate 侵蚀/去中介化）
    类比局限: Coinbase 合规龙头地位与机构基础设施护城河可能使其区别于纯价值陷阱
