key_risks_to_monitor:
  - Q2'26 财报（预期 2026-08）美国商业增速 vs 30% 破位线、beat 幅度 vs Q1
  - Pentagon FY26/27 国防预算决议与 DOGE 削减范围
  - 新 ELA 落地数量（Army 模式复制验证 K3）
  - forward P/S 是否跌破 30x（≈ $100 on FY26）触发 base 情景
  - Thiel/Karp 减持节奏是否超 10b5-1 计划节奏
  - SBC/净稀释是否重新加速（反方3 证伪）

analogies_to_study:   # → 落成 historical-mirror 收料 todo（喂环⑤/终局环④）
