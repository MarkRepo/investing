key_risks_to_monitor:
  - "CAPEX 见顶信号：任一云厂商下调 AI CAPEX 指引"
  - "Scaling Law 证伪：主流模型发布不再追求更大参数规模"
  - "出口管制升级：BIS 进一步收紧 GPU 算力密度阈值"
  - "ASIC 替代加速：云厂商宣布大规模自研 ASIC 替代 GPU 采购"
  - "能源审批否决：美国主要 GW 级数据中心项目被监管否决"

analogies_to_study:
  - name: "1920s 美国铁路建设"
    logic: "大规模基础设施投资提前于实际需求 — 过度建设→回报率坍塌，但留下的铁路成为 50 年骨架"
    limitation: "铁路边际成本远高于算力，算力需求增长的不确定性比当时铁路运量预测小"
  - name: "1998-2000 光纤泡沫"
    logic: "电信公司声称「流量每 3 个月翻倍」→疯狂建网→带宽过剩→价格暴跌 90%→大批破产"
    limitation: "光纤是同质化管道，GPU/AI 芯片有技术壁垒，不容易出现极端价格战"
  - name: "2007-2010 太阳能多晶硅周期"
    logic: "光伏需求爆发→上游多晶硅供给严重不足→价格暴涨→全行业疯狂扩产→2010 产能过剩崩盘"
    limitation: "HBM/CoWoS 技术壁垒远高于多晶硅，扩产难度大得多"