# roadmap.yaml — 研究路线图 (由 workflow 01 生成)
slug: global-ai-compute-infrastructure
created: 2026-05-16
variant: deepseek-v4-pro

learning_track:
  l1_orientation:
    - question: "全球 AI 算力基础设施的产业链怎么划分？上中下游各自做什么、谁主导、毛利率水平如何？"
      source_hint: "训练知识 + 卖方行业深度"
    - question: "当前全球市场规模多大？增速多少？训练 vs 推理各占多少？"
      source_hint: "LightCounting + SIA/WSTS 数据"
    - question: "核心参与者在各环节的份额：GPU 芯片（NVDA vs AMD vs ASIC）、AI 服务器（ODM vs 品牌）、光模块、HBM、数据中心"
      source_hint: "各公司季报 + TrendForce"
    - question: "核心驱动力是什么 — Scaling Law 到底靠什么推动（模型参数量↑、数据量↑、还是推理需求↑）？"
      source_hint: "NVIDIA GTC + 学术界 scaling law 论文"

  l2_history:
    - question: "2015-2025 年 AI 算力经历了哪几个阶段（CPU 时代 → GPU 加速 → 大模型爆发 → 推理范式转变），每个阶段的驱动事件是什么？"
      source_hint: "训练知识 + NVIDIA 历年 GTC"
    - question: "半导体/算力行业的历史周期规律？这轮 AI 算力周期跟历史上哪轮最像？"
      source_hint: "训练知识 + SIA 历史数据"
    - question: "关键拐点：2017 Transformer、2022 ChatGPT、2024 Blackwell — 拐点前后的行业增速和格局发生了怎样的突变？"
      source_hint: "训练知识 + 各公司历年财报趋势"

  l3_debates:
    - question: "Scaling Law 还能撑多久？预训练 scaling 的边际递减到了吗？推理需求的爆发能否接力训练？"
      source_hint: "NVIDIA GTC 2026 + Anthropic/OpenAI 技术博客 + 学术界讨论"
    - question: "NVIDIA 的护城河（CUDA + NVLink + 全栈集成）能维持多久？ASIC 和 AMD MI400 会在什么场景下撕开缺口？"
      source_hint: "AMD/AVGO 季报 + 云厂商自研芯片进展"
    - question: "资本开支有没有 FOMO 泡沫？四大云厂商 2000 亿+ CAPEX 的可持续性判断？"
      source_hint: "MSFT/GOOGL/AMZN/META 季报 CAPEX 指引"
    - question: "美国出口管制会不会反噬 NVDA？中国国产替代（昇腾）有没有可能反杀回全球市场？"
      source_hint: "BIS 规则文件 + 寒武纪/海光信息年报 + 华为昇腾生态报告"
    - question: "能源约束是不是被低估了？GW 级数据中心面临电网审批壁垒，算力增长的天花板在哪？"
      source_hint: "IEA 数据中心能耗报告"

  l4_hunting:
    - question: "如果市场高估了训练需求的持续性却低估了推理 ASIC 的替代速度，NVDA 估值腰斩概率多大？"
      source_hint: "04-implied-expectations 产出反推"
    - question: "光模块/互联环节是否被低估了？互联带宽增速 > 单芯片算力增速，互联是不是最确定的增长？"
      source_hint: "LightCounting + Coherent/旭创年报"
    - question: "哪些环节在当前估值中隐含的预期最脆弱 — 一旦「CAPEX 见顶」叙事蔓延，谁的跌幅最大？"
      source_hint: "04-implied-expectations + 05-mirrors 产出"
    - question: "是否存在被忽视的受益方 — 电网设备、电力基础设施、液冷零部件？"
      source_hint: "训练知识 + 电力设备行业报告"

material_priority:
  tier1:
