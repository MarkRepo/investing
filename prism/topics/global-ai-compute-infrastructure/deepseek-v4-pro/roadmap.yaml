      type: "annual-report"
      ticker: "NVDA"
      source: "NVIDIA IR 官网 / SEC EDGAR"
      why: "AI 算力产业链的锚，DC 收入结构、毛利率趋势、Rubin 路线图是判断行业方向的核心依据"
    - title: "AMD FY2026 Q1 季报 + MI400 路线图更新"
      type: "annual-report"
      ticker: "AMD"
      source: "AMD IR 官网 / SEC EDGAR"
