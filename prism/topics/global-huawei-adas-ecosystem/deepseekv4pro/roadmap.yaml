slug: global-huawei-adas-ecosystem
variant: deepseekv4pro
created: 2026-07-31
primer_scope: 华为ADS技术架构演进(ADS1→5)、智驾平权驱动力、三种合作模式(鸿蒙智行/HI/零部件)、五界品牌矩阵、中国智驾三层竞争格局(软硬一体/纯软/自研)

learning_track:
  l3_debates:
    - question: "华为智驾高端统治力53.2%能否下沉到15-25万？ADS SE/Pro价格带面临比亚迪天神之眼同价竞争——'SE抢规模'策略是否导致品牌贬值、高端溢价被稀释？"
      addresses: [K1, K3]
      source_hint: 盖世汽车四档方案分析 + 比亚迪天神之眼B定价策略 + 深蓝S07/华境S销量数据

    - question: "FSD入华后消费者在'安全'vs'好用'之间的真实选择——纯视觉端到端体验优势能否压倒华为的多传感器安全冗余？'安全但不够好用' vs '更好用但安全不如华为'的博弈何方胜出？"
      addresses: [K3]
      source_hint: FSD中国车主论坛/横评实测 + 问界M9智驾NPS数据 + 小米/小鹏/理想车主智驾满意度对比

    - question: "引望不上市的话，这个arena的终局输出被迫退化为'间接暴露质量排名'——赛力斯/北汽蓝谷/江淮谁的华为智驾纯度最高？研究价值是否因缺乏直接标的而大打折扣？"
      addresses: [K2]
      source_hint: 引望最新IPO进展追踪 + 赛力斯/北汽/江淮的华为智驾收入占比分析

    - question: "Momenta 65%第三方NOA份额 vs 华为53.2%高端份额——两套生态是否永远共存而非一家赢？纯软方案商的客户广度（24家车企210+定点）能否弥补软硬一体的深度锁定？"
      addresses: [K2, K5]
      source_hint: Momenta招股书客户结构 + 华为第三方客户扩展速度对比

    - question: "鸿蒙智行'五界'扩张（问界/智界/享界/尊界/尚界）是否导致华为资源稀释、品牌内耗？11-18款新车密集投放，五界之间是否存在直接竞争？"
      addresses: [K6]
      source_hint: 五界2026各月交付数据 + 五界车型价格带重叠分析

  l4_hunting:
    - question: "华为搭载量2026年能否突破250万（当前170万）？35万+市占率能否守住50%+？市场对'比亚迪天神之眼285万辆数据+Momenta 65%第三方份额'的两端夹击是否过度定价？"
      addresses: [K1]
      search_keywords: ["华为乾崑搭载量", "2026 智驾份额", "比亚迪天神之眼"]
      source_hint: 华为乾崑技术大会官方数据 + 盖世汽车/汽车之家月度份额追踪 + 比亚迪天神之眼搭载量公告

    - question: "引望IPO时间表不确定性是否被过度折价？赛力斯115亿买入10%股权（引望估值1150亿）、上半年营收破百亿扭亏——如果2027年前IPO，当前间接暴露标的（赛力斯/北汽蓝谷）是否被低估？"
      addresses: [K2]
      search_keywords: ["引望IPO", "车BU独立", "赛力斯入股引望"]
      source_hint: 引望官方公告 + 财联社/证券时报IPO追踪 + 平安证券引望估值模型

    - question: "FSD入华后问界M9等高端车型的'智驾溢价'能否维持？特斯拉FSD 6.4万定价 vs 华为ADS Pro 1.2-1.5万——消费者是否愿意为'华为智驾'标签多付1-2万？"
      addresses: [K3]
      search_keywords: ["FSD 华为对比", "问界M9 智驾溢价", "智驾选装率"]
      source_hint: 问界M9/M8车主智驾选装率 + FSD中国定价策略 + 车主论坛横评

    - question: "赛力斯2026H1预亏15-18亿，市场是否已price in？全年净利一致预期71亿（东吴下修后）vs 国信证券乐观预期94亿——卖方分歧是否创造了定价错误？"
      addresses: [K4]
      search_keywords: ["赛力斯 盈利预测", "问界 毛利率", "601127 一致预期"]
      source_hint: 同花顺/东方财富一致预期汇总 + 东吴/国信/中信建投卖方模型对比

    - question: "华为第三方OEM扩展（深蓝S07标配ADS SE、华境S全系标配ADS Pro、阿维塔HI PLUS、广汽传祺/启境）是否被市场低估？'被集成'模式能否开辟第二增长曲线？"
      addresses: [K5]
      search_keywords: ["华为ADS 第三方", "深蓝 阿维塔 岚图", "华为HI模式"]
      source_hint: 长安/东风/广汽公告 + 盖世汽车定点追踪 + 东吴证券客户矩阵

    - question: "鸿蒙智行2026年130-220万辆目标——实际H1交付能否达60万辆（下限的一半）？问界M6新车型能否弥补M9/M8增速放缓？五界中谁在拖后腿？"
      addresses: [K6]
      search_keywords: ["鸿蒙智行 交付", "问界M6 订单", "五界 月销量"]
      source_hint: 鸿蒙智行月度交付快报 + 汽车之家/懂车帝销量榜 + 问界M6小订数据

