key_risks_to_monitor:
  - "引望IPO无限期推迟 → arena可投性降级，终局输出退化为'间接暴露排名'"
  - "FSD V14端到端体验全面超越ADS5 → 高端市占率53.2%松动，华为'安全'护城河被'好用'压倒"
  - "赛力斯2026全年净利低于50亿（一致预期下限61亿）→ '赛力斯=华为受益者'论据崩塌"
  - "比亚迪天神之眼从285万→500万辆数据飞轮加速 → 华为在15-25万价格带被挤出"
  - "鸿蒙智行五界2026实际交付<100万辆 → 飞轮增速放缓，130万下限失守"
  - "Momenta千亿IPO后估值继续跑赢 → 纯软模式被资本市场验证，华为软硬一体'重资产'被折价"

analogies_to_study:
  - case: "Mobileye (2016-2024)：软硬一体EyeQ芯片+算法封闭生态 → 被高通/英伟达/地平线开放平台替代"
    logic: "与华为同样走软硬一体全栈路线，Mobileye从垄断ADAS到被车企'去Mobileye化'的历程——核心教训是封闭生态在行业成熟期被开放平台替代"
    limitation: "华为比Mobileye多了鸿蒙生态+手机用户基盘+销售渠道，不只是'车载芯片+算法'的封闭盒子"
    todo: "收 historical-mirror 实证：Mobileye市场份额从70%→30%的复盘文章或行业研报"

  - case: "博世/大陆 (2015-2025)：Tier-1巨头在智能电动时代的份额流失"
    logic: "传统Tier-1在'软件定义汽车'时代被OEM自研+科技公司双重挤压，与华为'赋能者'定位形成对照——华为能否避免博世的命运？"
    limitation: "华为的软硬一体化深度远超博世（芯+OS+云+终端），不只是'供应商'而是'生态构建者'"
    todo: "收 industry-mirror 实证：博世/大陆在智能驾驶时代的市场份额变化数据"

  - case: "NVIDIA CUDA生态锁定 (2006-至今)：软硬一体生态的终极成功案例"
    logic: "CUDA生态锁定效应——开发者/应用/硬件三者正反馈循环，是华为鸿蒙智行生态的理想参照。如果华为能做到'智驾界的CUDA'，护城河将远超Mobileye"
    limitation: "汽车行业是B2B2C（OEM→经销商→消费者），不像CUDA的B2D（开发者）自增强循环——华为必须同时搞定OEM和消费者两端"
    todo: "对比分析：CUDA生态锁定机制 vs 鸿蒙智行生态锁定机制的异同"