      why: "期权价值(K6)；喂环③"
      addresses: [K6]
    - title: "historical-mirror：平台迁移在位者防御/被颠覆案例"
      type: industry-research
      source: "Bain/McKinsey"
      why: "镜鉴；喂环⑤"
      addresses: [K1]

key_risks_to_monitor:
  - "2026-2027 capex续上调→FCF转负(最真实空头逻辑)"
  - "AI Mode/AI答案页货币化<传统蓝链→搜索长期ARPU结构性下行"
  - "ad-tech案终判强制剥离广告交易所"
  - "搜索案默认协议(Apple $20B)被禁→Safari流量/搜索经济受损"
  - "Gemini用户增长不转化为收入(免费用户堆砌)"

analogies_to_study:
  - name: "US v. Microsoft 反垄断案(美国科技/1998-2001)"
    similar: "科技霸主被判垄断+捆绑/默认争议+remedy拆分威胁，最终未拆分、股价长期消化"
    different: "Microsoft错过移动/搜索转型；Google在AI主动出击(自有Gemini/DeepMind)"
  - name: "Meta capex恐慌→反转(美国广告/2022-2023)"
    similar: "市场先因capex/烧钱质疑腰斩股价，后AI效率+广告复苏股价大涨——capex ROI情绪周期镜鉴"
    different: "Meta Reality Labs纯亏无收入支撑；Google capex有Cloud backlog订单支撑"
  - name: "诺基亚/雅虎 平台迁移被颠覆(2007-2013)"
    similar: "技术范式切换(功能机→智能机/门户→搜索)时在位者防御失败——搜索→AI助手同类风险"
    different: "Google自身是AI前沿玩家、非被动挨打；全栈分发渠道未被绕过"
