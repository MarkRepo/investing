# roadmap.yaml — 研究路线图 (workflow 01)
slug: us-google
variant: opus4.8
created: 2026-07-23
thesis_version: 0

primer_scope: "primer 该覆盖：Alphabet 三业务板块(Services/Cloud/Other Bets)边界与盈利结构、搜索广告商业模式(竞价/CPC/TAC)、云竞争格局、自研TPU意义、AI capex会计传导、两起DOJ反垄断案、Gemini全栈分发、Waymo商业化阶段、双class控制结构、财报阅读要点"

learning_track:
  l3_debates:   # 争议层：多空分歧展开（反映 thesis 最大反方）
    - question: "capex 翻倍($195-205B)是'需求逼出的投资'(Cloud backlog $460B产能受限)还是'AI军备竞赛烧钱黑洞'？增量ROIC能否>资本成本？"
      source_hint: "财报电话会capex表态 + Cloud backlog转化 + 折旧曲线建模"
    - question: "市场对'生成式AI侵蚀搜索'是否过度定价？还是相反——市场对AI Mode货币化过度乐观、忽视长期ARPU下行？"
      source_hint: "AI Mode广告加载/CPC研究 + 搜索广告增速趋势"
    - question: "Q2 2026净利$112.1B含$99B股权重估(Anthropic/SpaceX)一次性——市场是否被GAAP净利误导、高估经营质量？"
      source_hint: "剔除other income看经营利润 + 股权投资波动性"
    - question: "反垄断尾部是否真的出清？搜索案保住Chrome是利好，但ad-tech案剥离广告交易所+默认协议限制的实际切口有多深？"
      source_hint: "ad-tech remedy终裁 + 搜索案default agreement条款"
    - question: "Gemini用户追赶(662M+)是否真能转化为可货币化收入、而非仅免费用户数堆砌？"
      source_hint: "Gemini订阅/API/云AI收入拆分"

  l4_hunting:   # 狩猎层：逐条对齐 K#
    - question: "未来2-3个季度Google搜索广告收入增速是否跌至个位数或负增长(AI Mode全面铺开后)？市场隐含预期是多少？"
      addresses: [K1]
      search_keywords: [Google 搜索广告 增速, AI Mode 货币化, search ad revenue growth 2026]
      source_hint: "季度财报Search分部 + 卖方渠道调查"
    - question: "Google Cloud能否在产能解绑后维持>40%营收增速且经营利润率逐季扩张(backlog转收入)？"
      addresses: [K2]
      search_keywords: [Google Cloud growth 2026, cloud operating margin, backlog RPO 转化]
      source_hint: "Cloud分部数据 + AWS/Azure对比"
    - question: "2026-2027 capex是否继续超预期上调致FCF同比转负？AI变现(云增量+自用效率)能否覆盖资本消耗？"
      addresses: [K3]
      search_keywords: [Alphabet capex 2027 guidance, free cash flow 2026, AI capex ROI]
      source_hint: "capex指引轨迹 + FCF建模 + 折旧对EPS拖累"
    - question: "ad-tech案(Brinkema)是否终判强制剥离广告交易所？搜索案数据共享/默认协议限制是否实质削弱搜索经济(Apple默认协议是否被禁)？"
      addresses: [K4]
      search_keywords: [Google ad exchange divestiture 2026, DOJ ad-tech remedy ruling, Apple default deal ban]
      source_hint: "法院remedy终裁文本 + DOJ press"
    - question: "Gemini用户/份额是否继续逼近ChatGPT并转化为可货币化收入(订阅/API/云AI)，而非仅免费用户数？"
      addresses: [K5]
      search_keywords: [Gemini paid subscribers, Gemini API revenue, ChatGPT market share 2026]
      source_hint: "Sensor Tower/Statista + Google One AI订阅"
    - question: "Waymo是否达到100万单/周并接近单位经济转正，成为可量化期权价值(而非拖累Other Bets)？"
      addresses: [K6]
      search_keywords: [Waymo 1 million rides week, robotaxi unit economics, Waymo profitability 2026]
      source_hint: "周单量轨迹 + 单位经济(安全员/车队折旧)"

