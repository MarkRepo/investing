key_risks_to_monitor:
  - 复用火箭商业化使整箭型(发动机本体/箭体锻件)价值量反噬耗材型
  - 独家壁垒被3D打印工艺替代
  - 估值 PS 持续透支、介入纪律被忽视
analogies_to_study:
  - 案例:美国 SpaceX 复用火箭对上游供应链价值量重塑(2015-2020)
    逻辑:复用率提升→单箭耗材价值量随发射频次放量、整箭型被反噬
    局限:美中发射频次与卫星组网节奏差异
