key_risks_to_monitor:
  - 半固态车型销量 2026 全年 <5 万辆 → 设备订单断层（K4 触发空方）
  - 丰田/松下/三星公告日韩独家供应 → 国产替代窗口关闭（K3 触发空方）
  - 应收账款/收入比 ≥2.0 或回款率 <60% → 订单质量问题（K5 触发空方）
  - 2026 Q3-Q4 头部电芯厂招标全部为日韩中标 → K1 直接证伪

analogies_to_study:
  - case: 2014-2018 中国锂电设备扩张期（先导市值 30→800 亿）
    why_similar: 同样是新工艺平台（液态扩张）+ 国产替代窗口 + 单 GWh 价值量跃升
    why_different: 当时下游是消费电子+电动车双驱动，现在固态主要是动力电池单驱动
  - case: 2017-2020 半导体设备国产替代（中微/北方华创估值底→龙头）
    why_similar: 同样是被外资 Tier 1 主导的行业，国产替代窗口期分阶段开启
    why_different: 半导体设备替代周期 7-10 年，固态电池设备可能 3-5 年（更短）
  - case: 2007-2010 光伏设备扩张（迈为科技前身阶段）
    why_similar: 新能源行业从政策驱动到经济驱动的共同节奏
    why_different: 光伏设备价值量未跃升（迭代式），固态是跃升式
