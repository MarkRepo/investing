key_risks_to_monitor:
  - "高精磨床被日本/欧洲纳入出口管制清单"
  - "行星滚柱丝杠被新技术路线替代（直驱/滚珠丝杠方案突破）"
  - "Rollvis/GSA 大幅扩产降价扼杀国产替代空间"
  - "国产丝杠精度/寿命始终达不到整机厂要求"
  - "恒力液压/秦川机床等重型玩家入场，竞争格局恶化"

analogies_to_study:
  - case: "中国半导体设备国产替代（北方华创/中微公司 2015-2025）"
    similarity: "高精设备被卡脖子（光刻机/刻蚀机 vs 高精磨床），技术壁垒极高，国产替代从'不可能'到'逐步突破'"
    difference: "半导体设备受地缘政治强力驱动（国家意志），行星滚柱丝杠是纯市场驱动"

  - case: "绿的谐波谐波减速器国产替代（2015-2025）"
    similarity: "同一公司的历史——绿的谐波用10年从0到国内谐波减速器龙头（市占率60%+），技术壁垒和替代路径高度可类比"
    difference: "谐波减速器的竞争对手是日本 Harmonic Drive（上市公司的业务之一），行星滚柱丝杠的竞争对手是瑞士家族企业"

  - case: "中国光伏金刚线切割（美畅股份 2015-2020）"
    similarity: "一个被忽视的'小零件'（金刚线 vs 丝杠）成为行业瓶颈，国产替代成功后爆发式增长"
    difference: "金刚线是消耗品（重复购买），丝杠是耐用件（替换周期长）"