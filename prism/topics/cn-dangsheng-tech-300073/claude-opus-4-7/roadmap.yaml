learning_track:
  l1_orientation:
    - question: 中国三元正极行业的边界在哪里？产业链上下游（前驱体/三元/磷酸铁锂/卤化物-硫化物固态电解质）的玩家结构和市场份额分布如何？
      source_hint: SMM 正极行业月报 / 高工锂电年度统计 / 当升 2024-2025 年报业务分部
    - question: 卤化物（氯/碘）vs 硫化物（LPSC）固态电解质的技术路线差异是什么？各自在能量密度/离子电导率/界面稳定性/成本上的 trade-off？
      source_hint: 卤化物综述论文（Nature Energy 2023+）/ SES SLDP 10-K 对照
    - question: 半固态电池（固液混合）与全固态在材料体系/工艺/客户上的差异？正极厂在两条路径上的角色定位有何不同？
      source_hint: 卫蓝/清陶/辉能技术白皮书 / 中汽中心半固态电池白皮书
    - question: 当升的业务版图——三元正极 / 磷酸铁锂 / 钴酸锂 / 固液正极 / 卤化物电解质各占营收/产能/资本开支多少？海外（韩国 LG/SK + 美国）vs 国内分部利润结构？
      source_hint: 当升 2024 / 2025 年报业务分部表 + mat-cc4b89

  l2_history:
    - question: 2019-2025 年正极三厂（当升/容百/振华新材）的市占率/毛利率/客户结构如何分化？高镍 NCM811 时代谁卡位成功，谁掉队？
      source_hint: SMM 正极厂商月度出货排名 / 三厂同期年报横向对照
    - question: 卤化物电解质学术演化史——2018 Li3YCl6 → 2021 Li3InCl6 → 2024 碘化物路线，关键专利/论文里程碑和工业化窗口期？
      source_hint: Web of Science 卤化物电解质综述 / 高华专利图谱
    - question: 2022-2025 IRA 政策对韩国 LG/SK 正极采购的实际冲击——韩系电池厂供应链转移轨迹（中国正极 → 韩国本土 / 北美）的时间线？
      source_hint: IRA FEOC 规则文本 / LG/SK 投资者日 / 韩国电池协会数据
    - question: 当升海外业务（韩国 LG/SK 主供 + 北美布局）2019-2025 营收占比/毛利率轨迹？哪几个年份是分水岭？
      source_hint: 当升历年年报 + 海外子公司财报附注

  l3_debates:
    - question: 多空分歧 1（正极 commoditization 反方）——三元正极毛利率 12.7% 还能稳住吗？是周期底部还是结构性下行？多方（防御性反弹）vs 空方（持续 derate）逻辑各是什么？
      source_hint: 卖方正极行业深度（华泰/中信/国泰君安）
    - question: 多空分歧 2（卤化物 OEM 验证反方）——20 吨级是否只是公司侧 PR？OEM/电池厂端 2026 内能否拿出具名装车数据？空方"另一个容百式期权"逻辑能否成立？
      source_hint: 清陶/卫蓝/辉能/赣锋/中汽新能官网 + 公告 + 卖方调研纪要
    - question: 多空分歧 3（PE 不便宜反方）——20-30x PE 在父 K2 强证伪背景下，"财务质量溢价"能否抵消正极板块 beta 下行 30-40%？历史上正极板块 derate 周期 PE 触底位置在哪？
      source_hint: 当升 / 容百 / 振华历史 PE band + 2018-2019 / 2022-2023 板块 derate 案例
    - question: 多空分歧 4（双路线对冲 vs 摊大饼）——卤化物 + 固液正极 + 三元主业 + 海外业务，资本开支被分散是否反而拖低 ROIC？还是真能形成路线对冲价值？
      source_hint: 当升 2024-2025 capex 拆分 + 卖方深度
    - question: 最容易被忽视的风险——氯碘卤化物路线如果学术界突然集体倒向硫化物路线（专利图谱反转），当升的"差异化"会不会变成"押错路线"？
      source_hint: 卤化物 vs 硫化物 2024-2025 顶刊论文数量对比 + 高华/Sila 等专利演化

  l4_hunting:
    - question: 当升氯碘卤化物从 20 吨级 → 100 吨级量产时点是否在 2026 内完成？2026Q4 仍 <50 吨级则 K2 反方实证锚松动。
      source_hint: 当升 2026 中报 + 季报披露的电解质产能数据；卖方调研纪要追踪
      addresses: [K1]
    - question: 千吨级固液正极在卫蓝/清陶半固态电池 2026H2 是否装车放量 + 单一客户出货 ≥500 吨？任一客户暂停则具名披露差异化优势消失。
      source_hint: 清陶/卫蓝/辉能 2025-2026 产能爬坡公告 + 整车厂半固态车型上市公告 + 当升关联交易披露
      addresses: [K2]
    - question: 当升电解质 capex 是否在 2026 中报首次单列且金额 >5 亿元？仍未单列则 single-shot rerating 不会发生。
      source_hint: 当升 2026 半年报"重大非股权投资项目"附注 + 电话会议纪要
      addresses: [K3]
    - question: 海外业务（韩国/北美）2026H2 是否出现单季同比 -20% 以上下滑？海外利润占比若快速下行将打破"防御性期权"narrative。
      source_hint: 当升海外子公司分部数据 + LG/SK 采购侧公告 + IRA FEOC 细则更新
      addresses: [K4]
    - question: 当升 vs 容百同期硫化物电解质 R&D 投入差距是否拉大至 5 倍以上（当升 >5000 万元 vs 容百 385 万元/年）？验证则双路线 narrative 完整证实。
      source_hint: 当升 / 容百 2026Q3 季报 R&D 拆分 + 研发项目附注
      addresses: [K5]

