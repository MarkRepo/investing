key_risks_to_monitor:
  - 卤化物路线学术端突然倒向硫化物（顶刊论文/专利图谱反转） — 触发当升"差异化"变"押错路线"
  - 韩国 LG/SK 正极采购转移加速（IRA FEOC 升级 + 韩系本土化） — K4 海外业务系统性下滑
  - 清陶/卫蓝任一半固态量产推迟到 2027 — K2 具名客户披露差异化优势瓦解
  - A 股正极板块整体 derate 30-40%（PE 触底 12-15x）— 财务质量溢价不足以抵消板块 beta
  - 当升资本配置纪律破裂（突发大规模 capex / 并购） — 防御性 narrative 证伪

analogies_to_study:
  - case: 2017-2020 当升 vs 容百正极三元路线分化（高镍 NCM811）
    rationale: 同一阶段同一行业的路线分化 → 当时容百赌 NCM811 卡位成功，当升以 NCM523/622 + 海外稳健客户基础挺过去；2026 卤化物 vs 硫化物的路线对冲与当年 NCM811 vs NCM523 的路线分化在 narrative 结构上类似——"激进押注 vs 防御性双路线"
    limitation: 高镍三元是渐进式技术迭代，卤化物/硫化物是平台级路线分叉，证伪节奏可能更剧烈
  - case: 2019-2022 高华锂业（POSCO 系）卤化物专利图谱演化
    rationale: 卤化物路线学术-工业化转化窗口期参照系——高华从专利布局 → 工业化用了约 3 年，可外推当升 20 吨级 → 100 吨级 → 千吨级时间窗
    limitation: 韩国电池产业链垂直整合度高，A 股正极独立厂商节奏更受 OEM 牵引，转化窗口可能更长
  - case: 2018-2020 比亚迪刀片电池量产前 2 年磷酸铁锂正极 narrative
    rationale: 量产前 2 年的 narrative 重建过程——刀片量产前磷酸铁锂正极 narrative 从"过气路线"逆转为"主流路线"用了约 18 个月；当升固液正极/卤化物若 2026H2 出量产数据，narrative 重估窗口可类比
    limitation: 刀片电池是 BYD 自有体系封闭迭代，当升处于多客户开放体系，narrative 传导更碎片化
