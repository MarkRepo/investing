analogies_to_study:
  - case: "手机AP 自研 vs 外采终局（2010-2025，全球）"
    logic: >
      苹果A系列全自研→体验领先+成本最优；三星Exynos双轨（自研+外采高通）；华为麒麟被迫自研→短期阵痛但长期可控；其余Android厂商全买高通。AD芯片类似：头部OEM（比亚迪/蔚来）有能力自研→长期可能全自研；中小OEM（多数国内车企）买公版是理性选择。但关键差异：手机AP一年一迭代，车规芯片迭代慢（2-3年），自研的过时风险更高。
    limitation: >
      手机AP的规模效应远超车规芯片（手机年出货10亿+ vs 汽车1亿-）；车规芯片对安全/可靠性要求更高，自研认证周期更长；AD芯片的AI算法迭代速度可能快于芯片硬件迭代，工具链生态的重要性超过硬件本身。

  - case: "Mobileye 从霸主到边缘化（2015-2025，全球→中国）"
    logic: >
      Mobileye 2015年全球ADAS芯片市占率70%+，EyeQ系列垄断L1/L2前视市场。但因①封闭生态（Black-box算法不开放，OEM无法自调）②迭代慢（EyeQ5拖到2020，EyeQ6 2024才量产）③中国OEM转向开放平台（地平线/华为/英伟达），2025年在中国份额被蚕食至个位数。地平线当前的开放生态（TogetheROS+BPU授权）正是Mobileye封闭策略的反面——但若地平线未来走向封闭（如征程6P绑定HSD方案），重蹈Mobileye覆辙的风险存在。
    limitation: >
      Mobileye的衰落也有地缘政治因素（以色列公司在中国市场天然受限）；地平线作为中国公司无此问题。Mobileye的EyeQ是ASIC（功能固定），地平线征程是GPU-like（可编程），架构灵活性不同。

  - case: "图森未来 三年市值蒸发99%（2021-2024，美国→全球）"
    logic: >
      图森2021年上市市值$85亿，2024年退市市值<1亿。失败原因：①L4商业化远慢于预期（技术可行≠商业可行）②中美双重监管压力③管理层内斗④烧钱速度远超收入增长。对AD芯片的启示：①高估值需要兑现路径，不能只靠终局叙事②地平线PS19x隐含的2028年扭亏假设若被推迟，估值可能重蹈图森。
    limitation: >
      图森是L4运营公司（重资产+长变现周期），地平线是芯片卖铲人（轻资产+当期收入），商业模式不同。但估值逻辑相似：高PS倍数需要高增长+盈利路径兑现，一旦miss则戴维斯双杀。