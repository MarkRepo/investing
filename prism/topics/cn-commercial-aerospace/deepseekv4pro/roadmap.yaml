# 研究路线图 — 中国商业航天
# topic: cn-commercial-aerospace / variant: deepseekv4pro

meta:
  created: 2026-06-17
  thesis_version: 0
  decomposition_version: 0

primer_scope: >-
  产业链全景（星/箭/场/测/用）、主要玩家图谱（蓝箭/天兵/星河动力/中科宇航/东方空间）、
  GW vs 千帆星座规划、液氧甲烷 vs 液氧煤油技术路线对比、SpaceX 参照系、政策演进时间线（2014-2026）、
  市场规模量级与增速

learning_track:

  # ── L3 争议层（喂决策链环④） ──
  l3_debates:
  - question: >
      可回收火箭"2026 年元年"预期是否过于乐观？朱雀三号 Q2 回收再试 + 长征十号甲低空验证成功 =
      成本曲线即将陡降？还是 SpaceX 用了 8 年（2015→2023 盈利）的规律也适用于中国？
    debate_stakes: 若回收再失败→时间表推至 2028+，发射成本居高不下→星座组网进度滞后→频轨 deadline 违约风险

  - question: >
      蓝箭航天的"烧钱换规模"模式能否持续？年亏损 8-12 亿 vs 2026 年目标营收 5 亿、
      年固定成本 6-10 亿——资本市场给不给这个"5-7 年才能盈利"的窗口？SpaceX IPO $2 万亿
      是提估值还是吸流动性？
    debate_stakes: 若蓝箭 IPO 受阻/估值大幅低于预期→整个赛道融资环境恶化→火箭制造 arena 投资价值打折

  - question: >
      卫星制造 7360 颗/年产能 vs 2025 年仅发射 377 颗——产能利用率 <10% 是"火箭运力瓶颈"还是"需求根本没形成"？
      如果星座组网进度持续不及预期，卫星制造环节是不是先发优势变沉没成本？
    debate_stakes: 若卫星制造出现价格战/产能过剩→制造环节利润率崩塌→价值向火箭+应用迁移

  - question: >
      国家队（长征十号甲/中国商星）介入对民营格局的挤压效应有多大？民营火箭企业
      靠"成本优势+灵活迭代"的逻辑，在国家队同样发力可回收的背景下是否成立？
    debate_stakes: 若国家队通过行政订单锁定星座发射份额→民营火箭"市场化竞争"叙事打折

  - question: >
      中国商业航天对标 SpaceX 的估值溢价是否合理？SpaceX $2 万亿估值有 Starlink $113 亿营收+
      $44 亿营业利润支撑，中国商业火箭企业累计营收不足 1 亿却冲刺 200 亿估值——
      泡沫还是"国家战略溢价"？
    debate_stakes: 若 SpaceX 上市后估值回调→中国商业航天估值锚下移→A股映射承压

  # ── L4 狩猎层（找错误定价，逐 K# 对齐） ──
  l4_hunting:
  - question: >
      朱雀三号 2026Q2 回收试验的时间窗口和成功概率——当前市场是否高估了"回收元年"叙事？
      长征十号甲的低空验证成功是否被误读为"可回收已解决"？
    addresses: [K1]
    search_keywords: [朱雀三号 回收试验, 长征十号甲 回收, 中国可回收火箭进展]
    source_hint: CCTV/科技日报/蓝箭官方渠道 + 航天爱好者社区技术分析

  - question: >
      蓝箭航天招股书关键财务假设的合理性——2026 年营收 5 亿/2027 年 10 亿的达成路径？
      在手订单（星网+垣信）能否支撑？年固定成本 6-10 亿的降本空间？
    addresses: [K2]
    search_keywords: [蓝箭航天 营收预测, 朱雀三号 订单, 商业火箭 盈利模型]
    source_hint: 招股书（已收）+ 卖方财务模型 + 行业可比公司分析

  - question: >
      SpaceX 上市后 P/S 估值倍数对蓝箭/天兵的映射——Starlink 部分 vs 发射部分的拆分估值逻辑？
      中国商业火箭企业该用 P/S（尚无收入）、P/B（重资产）还是 DCF（远期现金流）估值？
    addresses: [K3]
    search_keywords: [SpaceX 估值, 商业航天 估值方法, 蓝箭航天 可比估值]
    source_hint: SpaceX S-1 招股书 + 华尔街分析师估值报告

  - question: >
      2026 年全年可回收火箭验证时间表汇总——朱雀三号 Q2/Q4、长征十号甲后续、
      天龙三号归零后复飞、双曲线三号首飞、元行者一号首飞——哪个节点最可能超预期/低于预期？
    addresses: [K4]
    search_keywords: [2026 可回收火箭时间表, 商业火箭首飞计划, 发射场排期]
    source_hint: 各企业官方公告 + 航天爱好者社区发射日历

  - question: >
      卫星制造环节当前实际毛利率和价格趋势——200-300kg 级 1200-1500 万/颗是否在持续下降？
      55 个工厂的开工率变化——已有工厂是否在减产/转产？
    addresses: [K5]
    search_keywords: [卫星制造 毛利率, 卫星价格 下降, 卫星工厂 开工率]
    source_hint: 中国卫星/长光卫星/银河航天年报 + 行业调研数据

