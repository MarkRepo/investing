# ── 历史类比 ──

historical_analogies:
  - case: SpaceX Falcon 9 可回收发展史（美国，2011-2023）
    analogy_logic: >
      从首次宣布可回收计划（2011）→首次成功回收（2015-12）→首次复用（2017-03）→
      首次盈利（2023-Q1），历时 12 年。中国可回收火箭从朱雀二号甲烷入轨（2023-07）
      起算，当前处于 SpaceX 2014-2015 阶段（回收试验中，尚未成功）。
      关键参考：SpaceX 盈利拐点何时到来？Starlink 自身造血后发射业务才摆脱亏损。
    analogy_limits: >
      中国有国家队运力兜底（长征系列）、政策驱动更强、资本市场更"耐心"；
      但缺乏 NASA/DoD 的"锚定客户"模式——中国星座运营商（星网/垣信）采购机制尚不成熟。
    todo: 收 SpaceX 可回收发展史实证材料（已收 Wikipedia + Milestone Tracker）

  - case: 中国光伏产业产能过剩与价格战（中国，2010-2012）
    analogy_logic: >
      光伏 2010 年产能大扩张→2012 年产能过剩→价格暴跌→龙头企业亏损→行业洗牌。
      卫星制造当前 7360 颗产能 vs 377 颗实际发射，产能利用率 <10%，
      若星座组网持续不及预期，可能出现类似的"产能竞赛→价格战→亏损"轨迹。
    analogy_limits: >
      卫星制造的下游需求（星座组网）确定性高于当年光伏（依赖海外补贴）；
      但"产能超前于需求"的结构性风险相似。
    todo: 收集光伏产能过剩复盘实证材料
