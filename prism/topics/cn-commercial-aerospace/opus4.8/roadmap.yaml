key_risks_to_monitor:
  - "2026-2027 头部民营火箭复飞结果（朱雀三号/天龙三号）——命门1翻多/翻空触发器"
  - "国网/千帆对民营火箭采购订单/招标份额披露——命门2低置信开关"
  - "A 股龙头 2025 年报商业航天分部收入占比披露——命门3证伪/证实"
  - "蓝箭 IPO 定价与上市首日表现（破发 vs 爆炒）——一级退出健康度信号"
  - "SpaceX IPO 落地及其对 A 股估值锚的传导"
  - "政策三年行动计划可量化承诺的兑现进度（工位扩容/补贴落地）"

analogies_to_study:
  - name: "光伏/锂电产业链（中国制造 0→1→产能过剩，2020-2023）"
    likeness: "国家意志驱动 + 资本蜂拥 + 政策补贴 → 早期估值狂热"
    limits: "光伏需求已验证可规模化盈利；商业航天复用前提尚未兑现、需求侧国资主导更刚性但份额不透明"
  - name: "卫星互联网/铱星（1990s 美国，技术领先但商业坍塌）"
    likeness: "星座组网资本开支巨大、单位经济性依赖规模、盈利地平线遥远"
    limits: "今日 LEO 成本/复用经济性远优于铱星时代；中国国资需求托底"
  - name: "5G/特高压等政策主题映射炒作（A 股历史）"
    likeness: "政策催化 → 主题映射标的暴涨 → 业绩不兑现回撤；纯度陷阱"
    limits: "商业航天部分头部确有真实订单/收入，非纯概念，需逐标的辨别纯度"
