# roadmap.yaml — 研究路线图 (workflow 01 · opus4.8 · 全新重跑 2026-06-17)
slug: cn-commercial-aerospace
variant: opus4.8
created: 2026-06-17

# S2: L1/L2 坍缩为 primer_scope（背景理解层交 00_primer）
primer_scope: >
  primer 该覆盖：①产业链四段边界（上游精密零部件/火箭整箭/卫星制造/卫星互联网应用）各自怎么赚钱；
  ②参与者格局（国家队航天科技/科工 + 民营头部蓝箭/天兵/星河动力/中科宇航/东方空间 + 卫星侧银河航天/格思/长光）；
  ③市场规模口径（核心产业>万亿 vs 宽口径2.8万亿，勿混用）；④发展阶段（双星座组网期+可复用降本兑现前夜）；
  ⑤周期位（政策三年行动计划+资本催化期，SpaceX IPO 情绪共振）。

learning_track:
  # L3 争议层（thesis 反方展开 4-5）
  l3_debates:
    - question: 上游"按发射次数"受益逻辑是否被可复用反噬？复用兑现=少造多飞，单箭价值量被压缩，上游需求究竟净增还是净减？
      source_hint: 卖方降本单位经济深度（爱建第一性原理/国信）+ 斯瑞单箭价值量跃升数据交叉验证
    - question: 上游标的商业航天纯度太低（数千万~10%量级），能否支撑 PS 10-15x 概念估值？"确定受益"≠"可投资标的"？
      source_hint: 斯瑞/航宇/派克 2025 年报分部数据 + A股概念股估值快照
    - question: 万颗星座运力订单是否仍被国家队主导？民营中标≠民营兑现（2026 长征系仍承担 80%），火箭 arena 利润池是真还是叙事？
      source_hint: 千帆/国网招标记录 + 蓝箭招股书发射服务合同 + 2026 实际发射执行方统计
    - question: 整箭量产降本是市场共识主线，但 2026 密集首飞失败率高（朱雀回收失利/天龙首飞失利），共识是否高估兑现速度？
      source_hint: 2026 火箭首飞清单 + 历次首飞/回收成败复盘
    - question: 主题炒作（SpaceX IPO 情绪+政策催化）vs 真实兑现的背离有多大？历史镜鉴（光伏/5G）会否重演"叙事先行利润不兑现"？
      source_hint: 历史镜鉴复盘 + SpaceX 估值/IPO 进展 + 概念股资金面

  # L4 狩猎层（逐条对齐 thesis K#）
  l4_hunting:
    - question: 朱雀三号 2026 Q2 遥二箭回收试验是否成功、Q4 是否实现首次复用飞行？天龙三号归零后能否复飞？市场隐含成功概率多少？
      addresses: [K1]
      search_keywords: [朱雀三号 回收试验, 天龙三号 复飞, 可复用 复用飞行]
      source_hint: 蓝箭/天兵官方 + 航天年度会议 + ITHome/证券时报跟踪
    - question: 国网GW/千帆已发订单中民营火箭占比是否>0且上升？2026 下半年蓝箭朱雀三号能否落地组网首单（已中标一箭18星，交付节点）？
      addresses: [K2]
      search_keywords: [民营火箭 组网 中标, 蓝箭 千帆 一箭18星, 民营 发射份额]
      source_hint: 垣信/国网招标公告 + 蓝箭招股书供应商名单 + 卖方策略点评
    - question: 可复用降本单位经济曲线（每公斤入轨成本下降幅度）？复用后单箭零部件价值量塌缩 vs 发射次数增长，上游需求净影响？
      addresses: [K3]
      search_keywords: [每公斤入轨成本, 复用 降本曲线, 单箭价值量]
      source_hint: 爱建/国信/中信降本深度 + 斯瑞单箭价值量数据
    - question: 上游标的（斯瑞/航宇/派克/国机/星图测控）商业航天分部收入占比与 PS 水位？纯度倒挂程度，哪家>30% 可深挖？
      addresses: [K4]
      search_keywords: [斯瑞新材 商业航天 占比, 航天锻件 分部, 上游 PS 估值]
      source_hint: 各标的 2025 年报分部 + 投资者互动 + 概念股业绩
    - question: 主题催化（SpaceX IPO 落地/三年行动计划兑现）可持续性 vs 历史镜鉴回撤风险？哪个事件触发主题退潮？
      addresses: [K5]
      search_keywords: [SpaceX IPO 落地, 商业航天 炒作 回撤, 光伏 产能过剩 复盘]
      source_hint: SpaceX IPO 进展 + 历史镜鉴复盘 + 政策落地兑现跟踪

  l4_self_check: "K1-K5 五个 K# 各有 ≥1 条 L4 question 覆盖 ✓"

material_priority:
  # tier1 = P0（复用 5.3 todos，已全部 fetched）
  tier1:
    - title: 可复用火箭首飞与回收试验复盘（朱雀Q2回收+Q4复用、天龙归零、2026首飞清单）
      type: industry-research
      addresses: [K1]
      rings: [migration-path-evidence]
      why: 命门1·决定可复用整箭 arena 升降级与降本时点
    - title: 民营火箭星座组网量化份额硬证据（中标/采购协议/2026执行方占比）
      type: industry-research
      addresses: [K2]
      rings: [migration-path-evidence, arena-scoring-inputs]
      why: 命门2·决定火箭/发射服务 arena 利润池真实性
    - title: 可复用降本单位经济曲线（每公斤入轨成本+对单箭价值量净影响·卖方深度）
      type: sell-side-note
      addresses: [K3]
      rings: [value-chain-profit-pool, migration-path-evidence]
      why: 命门3·决定上游vs整箭兑现次序+自反验证
    - title: A股上游标的逐一商业航天分部收入占比+PS（斯瑞/航宇/派克/星图测控2025年报）
      type: data
      addresses: [K4]
      rings: [leader-valuation-anchor]
      why: 命门3·纯度倒挂量化·决定可介入标的
    - title: 行业价值链利润池+市场规模口径拆解（核心产业>万亿 vs 宽口径2.8万亿·四段谁赚走）
      type: industry-research
      addresses: [K3, K4]
      rings: [value-chain-profit-pool]
      why: 环①基础·利润池定位
  # tier2 = P1
  tier2:
    - title: 蓝箭航天一级估值锚（科创板IPO受理/募75亿/估值200亿·招股书）
      type: industry-research
      addresses: [K4]
      rings: [leader-valuation-anchor]
      why: 一级估值锚·对照A股二级
    - title: 卫星制造+应用 arena 评分料（卫星工厂产能55个·卫星直连应用·组网162→324颗）
      type: industry-research
      addresses: [K2]
      rings: [arena-scoring-inputs]
      why: 环④·卫星制造/应用 arena 比较输入
    - title: 历史行业镜鉴（光伏2010-12过剩价格战、5G/卫星概念叙事先行）
      type: industry-research
      addresses: [K5]
      rings: [industry-mirror]
      why: 环⑤·历史镜鉴(hard)
    - title: SpaceX估值锚+行业一致预期（2万亿IPO·情绪驱动·RocketLab对比）
      type: data
      addresses: [K5]
      rings: [leader-valuation-anchor]
      why: 全球估值锚+consensus
    - title: 政策行动计划全文+地方量化承诺（三年行动计划+发射场扩容）
      type: policy
      addresses: [K5]
      rings: [migration-path-evidence]
      why: 政策驱动·真订单vs画饼

key_risks_to_monitor:
  - 朱雀三号Q2回收试验再度失利 → 可复用迁移路径证伪、整箭arena降级
  - 民营组网首单交付再延期 → 火箭arena利润池叙事化
  - SpaceX IPO落地兑现利空 + 概念股主题退潮（历史镜鉴重演）
  - 上游标的纯度持续<15% + PS不降 → 无可介入标的

analogies_to_study:
  - 光伏 2010-2012 产能过剩价格战（CN·光伏·叙事先行/三头在外/350家破产）— 喂 industry-mirror
  - 5G/卫星通信概念 2019-2020 炒作（CN·通信·主题先行利润后兑现）— 喂 industry-mirror
  - 新能源车补贴退坡周期（CN·EV·政策驱动主题的兑现与回撤）— 类比局限：航天兑现周期更长
