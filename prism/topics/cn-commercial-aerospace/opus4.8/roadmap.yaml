# roadmap.yaml — 研究路线图 (workflow 01 · thesis-driven)
slug: cn-commercial-aerospace
variant: opus4.8
created: 2026-06-13
thesis_version: 0          # 路线图对齐 thesis_v0（K1-K5）
decomposition_version: 0   # 命门1可复用闭环 / 命门2民营份额(低置信) / 命门3标的纯度vs估值

# ── primer scope（S2：L1/L2 坍缩成一行，背景深度交给 00_primer）──────────────
primer_scope: >
  00_primer 须覆盖：产业链四段（发射服务/卫星制造/星座运营/卫星应用）及各段玩家位次；
  可复用火箭为何是胜负手（降本曲线机理）；液体(液氧甲烷)vs固体路线之争；民营火箭第一梯队
  （蓝箭/天兵/星河动力/星际荣耀/深蓝）型号与进度；国网+千帆两大万颗级星座规模/归属/运力拉动；
  2.8万亿市场规模口径与水分；2025 发射节奏（92次/商业50次）；当前处"政策+主题驱动"阶段及距正现金流距离。

learning_track:
  # L1/L2 不再列问题树（见 primer_scope）

  # ── L3 争议层：分歧在哪、共识可能错在哪（喂决策链环④）────────────────────
  l3_debates:
    - question: "可复用闭环是'时间问题'还是'代差问题'？多方认为朱雀三号已入轨、复用是工程迭代时间问题；空方认为一级回收是另一个数量级的工程难度，中国民营距 SpaceX 成熟复用仍以年计、2025 两次旗舰首飞均未兑现已是证据。"
      source_hint: 朱雀三号回收失败复盘 + 天龙三号归零整改 + SpaceX 复用成熟度对标
    - question: "万颗级星座的运力需求，民营到底能吃到多少？多方把国网+千帆 TAM 整体记给民营；空方认为运力订单大概率优先给国家队长征系列，民营份额是'画饼'而非'在手'（命门2，低置信）。"
      source_hint: 国网/千帆采购招标披露 + 长征系列 vs 民营发射占比
    - question: "A 股'商业航天'板块是 alpha 兑现年还是主题映射高位？多方（国金'阿尔法元年'）认为 2026 从题材转向供应链业绩兑现；空方认为多数标的纯度低、真实收入暴露小、估值已 price-in 多年成功（中科星图 PE 168 历史98分位）。"
      source_hint: A 股标的分部收入暴露 + 历史 PE 分位 + 板块回调幅度
    - question: "SpaceX IPO（传 $1.5-1.75 万亿）+ 蓝箭 IPO 对 A 股是'价值锚重估'还是'情绪顶部信号'？多方视为估值锚上修利好；空方视为一级退出兑现期的顶部共振，蓝箭定价/首日表现是关键试金石。"
      source_hint: SpaceX 估值传闻 + 蓝箭 IPO 进度/定价 + 历史主题泡沫镜鉴
    - question: "行业'盈利在地平线'，资本为何抢先买单？是政策输血/补贴依赖的脆弱繁荣，还是真实需求拉动的早周期布局？距正现金流距离决定了估值容忍度。"
      source_hint: 头部公司现金流/订单结构 + 政策补贴量化 + 一级融资节奏

  # ── L4 狩猎层：找错误定价，逐条对齐 thesis Killer Question ─────────────────
  l4_hunting:
    - question: "朱雀三号/天龙三号/智神星等头部民营火箭能否在 2026-2027 实现一级回收+复飞成功并进入低成本高频发射？市场目前隐含的成功概率是多少？"
      addresses: [K1]
      search_keywords: [朱雀三号 复飞, 天龙三号 归零, 火箭 一级回收]
      source_hint: 蓝箭官方/CNSA 复飞预告 + 2026-2027 火箭首飞清单 + 天兵归零整改进展
    - question: "国网+千帆万颗级组网 2026-2028 年发射需求 vs 现有运力缺口多大？民营火箭实际拿到的采购订单/招标份额是多少？"
      addresses: [K2]
      search_keywords: [千帆 采购, 国网 招标, 民营火箭 订单]
      source_hint: 垣信/中国星网采购公告 + 民营 vs 长征系列发射占比 + 运力缺口测算
    - question: "全行业（火箭/卫星/应用）距正现金流多远？每公斤入轨成本下降曲线斜率多大？复用后边际成本测算是否成立、是市场化收入还是补贴/订单驱动？"
      addresses: [K3]
      search_keywords: [入轨成本 下降, 火箭 复用 边际成本, 单位经济性]
      source_hint: 卖方降本曲线深度（已收 mat-e3c065）+ 头部公司单次发射报价 + SpaceX 单位成本对标
    - question: "哪些 A 股上市标的有真实商业航天收入暴露、占比多少？当前 PE/PS 相对历史分位与全球 peer 是否已 price-in？纯度排序如何？"
      addresses: [K4]
      search_keywords: [商业航天 分部收入, A股 标的 纯度, 航天 估值 分位]
      source_hint: A 股龙头 2025 年报商业航天分部收入 + 理杏仁估值分位（已收 mat-adaa19）
    - question: "三年行动计划有无可量化承诺（工位/补贴/政府采购订单）？蓝箭 IPO 定价是健康融资还是顶部信号？SpaceX IPO 如何传导 A 股估值？"
      addresses: [K5]
      search_keywords: [商业航天 三年行动, 蓝箭 IPO 定价, SpaceX 上市 估值]
      source_hint: 政策22条/地方政策量化条款（已收 mat-d45cc4）+ 蓝箭科创板进度 + SpaceX IPO 传闻

# ── 资料优先级（A 合同地板 + B 命门靶点；多数家底已收，标 covered_by）────────
material_priority:
  tier1:
    - title: "卖方降本曲线与单位经济性深度（每公斤入轨成本、复用后边际成本测算）"
      type: sell-side-note
      source: 中信/中金/国金/爱建 行业深度
      addresses: [K3]
      rings: [migration-path-evidence, value-chain-profit-pool]
      why: "命门1经济性落点；降本曲线斜率决定整条复用逻辑是否成立。已收 mat-e3c065。"
    - title: "A 股商业航天标的估值与分部收入暴露快照（PE/PS/历史分位/纯度排序）"
      type: data
      source: 理杏仁/卖方可比表
      addresses: [K4]
      rings: [leader-valuation-anchor]
      why: "命门3落地——区分真实暴露 vs 主题映射；含航天宏图/中科星图/超图/中国卫星估值水位。已收 mat-adaa19。"
    - title: "可复用火箭首飞与回收试验复盘（朱雀三号回收失败/天龙三号首飞失利+归零整改）"
      type: industry-research
      source: 蓝箭官方/CNSA/财新/经观深度
      addresses: [K1]
      rings: [value-chain-profit-pool]
      why: "命门1咽喉证据——技术前提是否兑现。已收 mat-b3eba3/mat-ecd17e/mat-e37446。"
    - title: "政策三年行动计划全文 + 地方政策量化承诺（工位/补贴/采购）"
      type: policy
      source: CNSA/广东/上海/深圳/青岛政府
      addresses: [K5]
      rings: [migration-path-evidence]
      why: "环②区分'表态'vs'真金白银'；命门2政策量化部分。已收 mat-d45cc4。"

  tier2:
    - title: "国网+千帆双星座组网进度与运力缺口（在轨数/年发射节奏/民营份额）"
      type: industry-research
      source: 垣信/中国星网 + 组网跟踪
      addresses: [K2]
      rings: [arena-scoring-inputs]
      why: "命门2（低置信优先）——星座需求节奏与民营可获份额。已收 mat-e0ce38。"
    - title: "行业一致预期与市场规模口径拆解（2.8万亿结构/2026-2030 CAGR/TAM）"
      type: industry-research
      source: 卖方/赛迪/泰伯智库
      addresses: [K3, K4]
      rings: [value-chain-profit-pool, leader-valuation-anchor]
      why: "环①③口径可信度 + consensus 一致预期基准。已收 mat-5ba38e。"
    - title: "SpaceX 对标基准（复用成熟度/单位成本/Starlink经济性/IPO估值锚）"
      type: industry-research
      source: 公开资料
      addresses: [K1, K3]
      rings: [value-chain-profit-pool]
      why: "代差标尺 + 估值锚传导（命门1+K5）。已收 mat-e954a8。"
    - title: "历史主题泡沫镜鉴（同类政策/技术主题炒作的兑现与回撤史）"
      type: industry-research
      source: 历史复盘
      addresses: [K4, K5]
      rings: [industry-mirror]
      why: "决策链环⑤【行业镜鉴】输入——相似剧本如何崩/利润为何没兑现。已收 mat-6f89f3。"

  tier3:
    - title: "蓝箭航天科创板 IPO 招股材料与定价进度"
      type: industry-research
      source: 上交所/东方财富/财联社
      addresses: [K5]
      rings: [leader-valuation-anchor]
      why: "一级退出信号 + 商业火箭第一股估值锚；定价/首日表现待 IPO 落地（监控项）。已收 landspace_ipo_prospectus。"

