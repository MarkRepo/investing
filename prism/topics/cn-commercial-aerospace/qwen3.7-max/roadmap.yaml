key_risks_to_monitor:
  - 朱雀三号遥二回收试验（2026Q2）：成功=行业里程碑，失败=短期信心打击
  - 天龙三号/星云一号首飞（2026-03）：首飞即回收策略成败
  - 千帆星座发射频率（2026H2）：月均2次→4次是否可行
  - 蓝箭航天IPO定价+首日表现（2026-06/07）
  - SpaceX星舰V3首次商业载荷（2026H2）：代际差距是否拉大
  - 尾部火箭公司融资断裂风险（深蓝/箭元/星际荣耀）

analogies_to_study:
  - case: 中国长征火箭1990s国际商业发射挫折
    similarity: 首飞/早期发射连续失利→国际信誉崩塌→市场退出
    difference: 当前是国内市场、政策强力支撑、非国际竞争场景
    lesson: 一次重大失败可摧毁整条赛道的市场信心（1996"708"事故后休斯终止合作、保险费率飙升）

  - case: SpaceX猎鹰9号2010-2015年从首飞到回收
    similarity: 多次试错→最终成功→成本断崖下降→赢家通吃
    difference: SpaceX有NASA巨额合同兜底+美国资本市场深度；中国公司融资环境更脆弱
    lesson: 可复用火箭的成功需要"持续资金+容忍失败+工程迭代"三条件同时满足

  - case: 中国光伏产业2010-2015年产能过剩→洗牌
    similarity: 政策补贴驱动→大量企业涌入→产能过剩→价格战→尾部出清
    difference: 航天技术壁垒远高于光伏、进入门槛高、不太可能出现"全民造火箭"
    lesson: 即使赛道确定性好，尾部公司仍可能在行业整合中归零
