# roadmap.yaml — 中国商业航天研究路线图
slug: cn-commercial-aerospace
created: '2026-06-13'

primer_scope: >
  商业航天四子赛道区分（火箭制造/卫星制造/发射服务/卫星应用）；
  国家队vs民营分工（航天科技/科工 vs 蓝箭/天兵/星河动力等）；
  可复用火箭原理与成本模型（SpaceX猎鹰9 vs 朱雀三号）；
  GW/千帆/G60三大星座对比；发射工位瓶颈；
  液氧甲烷 vs 液氧煤油 vs 固体推进剂路线

learning_track:

  l3_debates:
    - question: >
        2026年8+款民营液体火箭密集首飞，是"技术验证大年"还是"集体试错大年"？
        多头认为产能释放+星座需求驱动拐点；空头认为首飞失利概率高（朱雀三号回收已失败、
        谷神星二号首飞失利），一次重大失败可能重创整个板块信心。
      source_hint: 各公司首飞进展跟踪 + 1996年长三乙"708"事故镜鉴

    - question: >
        "万星星座"叙事是战略卡位还是真实商业需求？
        多头认为ITU频轨资源"先到先得"必须加速部署（2028年7600颗目标）；
        空头指出千帆2025年底仅108颗（目标648颗，完成率17%），且垣信持续亏损（2024年亏8.1亿），
        实际部署远落后于规划，"星多箭少"瓶颈未解。
      source_hint: 千帆/GW发射频率数据 + 垣信财务报表 + 运力缺口分析

    - question: >
        中国商业航天估值锚在哪里？SpaceX $1.75T IPO 能否映射到A股？
        多头认为SpaceX上市重置全球comp set（ASTS/RKLB市值>$300亿），
        中国标的严重低估；空头指出SpaceX年收入$187亿+EBITDA 63%，
        而中国头部公司（蓝箭亏损、航天宏图亏13.9亿）基本面完全不在一个量级，
        中科星图PE 168x（历史98分位）已透支。
      source_hint: SpaceX S-1 + A股可比估值表 + 卖方目标价

    - question: >
        政策红利是"真金白银"还是"文件驱动"？
        多头：22条行动计划设立国家基金+扩大政府采购+航天法立法；
        空头：此前多份文件未落地（2014年《关于国家重大科技专项》等），
        商业航天司刚设立、实际执行力待验证，地方补贴可能退坡。
      source_hint: 22条全文 + 各地政策对比 + 商业航天司编制/预算

    - question: >
        民营火箭赛道"10进3"淘汰赛何时开始？谁会被淘汰？
        多头认为2026-2027是分化年（有入轨能力的5家 vs 仍在PPT的）；
        空头认为多数公司仍依赖VC输血，若IPO窗口收窄+首飞连续失利，
        尾部公司可能在12-18个月内面临资金断裂。
      source_hint: 各公司融资/IPO进度 + 发射记录 + 产能数据

  l4_hunting:
    - question: >
        朱雀三号遥二 2026Q2 回收试验能否成功？若成功，蓝箭航天是否立刻建立
        国内独家可复用成本优势（<2万元/kg），形成赢家通吃格局？
      addresses: [K1, K2]
      search_keywords: [朱雀三号遥二, 蓝箭回收试验, 可复用火箭成本]
      source_hint: 蓝箭航天官方公告 + 东风试验区动态

    - question: >
        千帆星座2026年能否达到324颗在轨目标？当前162颗（50%），
        剩余162颗需6个月内完成——发射频率需从月均2次提升至月均4次以上。
        如果达标，证明需求侧刚性，火箭订单确定性大幅上升。
      addresses: [K3]
      search_keywords: [千帆星座 在轨数量, 垣信卫星 发射频率, 一箭18星]
      source_hint: 垣信卫星官网 + 海南/太原发射场排期

    - question: >
        蓝箭航天科创板IPO定价区间多少？若以200亿胡润估值为锚、
        对标SpaceX PS ~10x，合理定价应是多少？当前科创板商业火箭
        第五套标准下，市场对"未盈利+硬科技"的定价逻辑是什么？
      addresses: [K4]
      search_keywords: [蓝箭航天 IPO定价, 科创板第五套标准, 商业火箭估值]
      source_hint: 招股书 + 中金保荐书 + 科创板同类IPO定价

    - question: >
        SpaceX星舰V3 2026年首次商业载荷发射成功概率多大？若成功，
        $50-200/kg的成本目标将使中国所有在研火箭（即使可复用后~$2800/kg）
        面临代际差距。中国是否需要直接跳过猎鹰级、对标星舰级？
      addresses: [K5]
      search_keywords: [SpaceX 星舰V3 商业发射, Starship cost per kg, 星舰对中国影响]
      source_hint: SpaceX S-1 + NASASpaceflight + 国内航天智库

    - question: >
        2026年是否有民营火箭公司因连续首飞失利而面临融资困难或裁员？
        尾部公司（如深蓝航天、箭元科技）的首飞即回收策略风险极高——
        若失败，是否触发行业"去泡沫"？
      addresses: [K1, K4]
      search_keywords: [民营火箭 融资 裁员, 星云一号 首飞, 商业航天 洗牌]
      source_hint: 投资界/36氪融资动态 + 公司裁员/诉讼信息

