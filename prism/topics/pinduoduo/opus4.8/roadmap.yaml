key_risks_to_monitor:
  - "净利润同比降幅持续扩大(>20%) → 确认价值陷阱"
  - "Temu 监管升级：新国别市场禁入或 >€200M 新罚单"
  - "国内份额连续流失 + 用户活跃走低"
  - "中概 PCAOB/HFCAA 退市风险再起"
  - "管理层持续治理黑箱、零股东回报"

analogies_to_study:
  - "Wish (ContextLogic) 美国低价跨境崩盘 (2020-2023)：类比 Temu 监管+单位经济崩坏；局限——Wish 无国内现金牛输血"
  - "早期阿里/京东 增长见顶后估值重置：类比 PDD 利润见顶 derating；局限——PDD 仍握 Temu 增长期权"
  - "eBay 从成长到成熟价值股 re-rating + 资本返还：类比深度价值修复路径；局限——eBay 无中概折价"
