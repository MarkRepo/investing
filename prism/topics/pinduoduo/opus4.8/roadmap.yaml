learning_track:
  l3_debates:         # 争议层：分歧在哪（喂决策链环④）
    - question: "利润下行是管理层主动投入(利润有弹性)还是增长见顶+竞争挤压(持续下台阶)？财报上如何区分？"
      source_hint: "20-F 成本结构 + 历次电话会管理层口径 + 销售费用/履约成本拆解"
    - question: "Temu 期权价值：de minimis 终止 + 半托管重构后，是减值的增长期权还是持续亏损黑洞？"
      source_hint: "Tech Buzz China/Marketplace Pulse 第三方数据 + 监管时间线"
    - question: "深度价值 vs 价值陷阱：低 PE 是市场错杀，还是治理黑箱/VIE/中概折价的制度性应得？"
      source_hint: "卖方多空研报 + 估值锚区间($110-118)分歧点"
    - question: "国内价格战终局：拼多多低价护城河被阿里/抖音全行业对标后还剩多少 take-rate 空间？"
      source_hint: "国内份额数据 + take-rate 走势 + 竞品补贴策略"
    - question: "催化真空：管理层明示不追短期利润、不给指引，估值何时/凭什么 re-rate？"
      source_hint: "资本配置史 + 回购/分红信号 + 利润见底时点"

  l4_hunting:         # 狩猎层：找错误定价（逐条对齐 K#）
    - question: "FY2026 净利润(归属普通股东)同比降幅能否收窄至个位数或转正？市场当前隐含什么利润假设？"
      addresses: [K1]
      search_keywords: [PDD 净利润 趋势, PDD take rate, 销售费用率 2026]
      source_hint: "季度财报 + 电话会 + 卖方盈利预测模型"
    - question: "Temu 区域(尤其欧洲/非美)能否出现减亏或单均盈利信号？全球 GMV 在 de minimis 冲击后是否企稳？"
      addresses: [K2]
      search_keywords: [Temu 半托管 单位经济, Temu GMV 2026, Temu 欧洲 扩张]
      source_hint: "Tech Buzz China Temu Watch + Marketplace Pulse + Sensor Tower"
    - question: "未来12个月监管冲击是见顶还是继续恶化(新国别禁入/新>€200M罚单/美国进一步收紧)？"
      addresses: [K3]
      search_keywords: [Temu 监管 2026, de minimis 后续, EU DSA Temu 罚]
      source_hint: "欧盟委员会公告 + 美国海关政策 + Reuters 监管线"
    - question: "PDD 是否在 FY2026 首次宣布系统性回购或分红？现金余额与资本配置表态如何？"
      addresses: [K4]
      search_keywords: [PDD 回购 分红, PDD buyback 2026, PDD 资本配置]
      source_hint: "20-F 现金/治理 + IR 公告 + 历次电话会资本配置问答"
    - question: "拼多多国内 GMV 份额在阿里回归价格力+抖音掠夺下是守住还是系统性流失？"
      addresses: [K5]
      search_keywords: [拼多多 GMV 份额, 拼多多 vs 抖音, 中国电商 份额 2025]
      source_hint: "Statista/QuestMobile 份额 + 卖方国内电商追踪"

