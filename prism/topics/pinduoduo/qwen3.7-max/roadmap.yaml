key_risks_to_monitor:
  - "EU DSA 对 Temu 的后续处罚力度和时间表"
  - "美国贸易政策进一步收紧（关税/数据安全/平台责任法）"
  - "中国消费复苏力度——若消费降级结束，拼多多低价心智优势减弱"
  - "抖音电商货架化加速——对拼多多份额的替代效应"
  - "PDD 管理层大规模减持或关联交易"
  - "Temu 在新兴市场（拉美/东南亚/中东）的扩张节奏"
analogies_to_study:
  - name: "Amazon 国际扩张（2000-2015）"
    analogy: "同为电商巨头的全球化扩张，Amazon 通过收购本地玩家（如 Zappos/Quidsi）+ 自建物流进入新市场"
    limitation: "Amazon 进入时市场空白多、竞争少；Temu 面对的是已有 Amazon/Shein/AliExpress 的饱和市场"
  - name: "Wish 的崛起与崩塌（2015-2023）"
    analogy: "同为跨境低价电商平台，靠烧钱获客+中国供应链，一度上市估值 $17B 后暴跌 99%"
    limitation: "Wish 缺乏拼多多的供应链深度和运营能力，Temu 的全托管模式比 Wish 的纯 marketplace 更可控"
  - name: "Shein 的全球化路径（2020-2025）"
    analogy: "同期、同供应链、同目标客群（Z 世代价格敏感消费者），Shein 先于 Temu 验证了跨境低价模式的可行性"
    limitation: "Shein 以快时尚起家，品类集中、供应链更深；Temu 是全品类平台模式，获客成本和合规复杂度更高"
