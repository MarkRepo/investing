analogies_to_study:
  - name: 荣昌生物RC48(维迪西妥单抗)授权Seagen — 首付款/临床进展不及预期后估值回落
    logic: 同为中国ADC/biotech授权海外MNC模式，授权后临床或商业化节奏不及预期引发估值重估
    limitation: RC48靶点(HER2)与商业化阶段与iza-bren(EGFR×HER3，刚获批)不完全对应，需甄别节奏差异
  - name: Vor Bio泰它西普授权镜鉴（已收，mat-73c26d）
    logic: 首付款相对偏低+交易对手自身陷入困境，导致授权方股价单日暴跌15-25%
    limitation: 非ADC资产、交易对手非BMS级别大药厂，风险传导路径与本案不完全类比，仅作"BD兑现不确定性"的风险幅度参照
  - name: 科伦博泰与默沙东多款ADC授权 — 商业化里程碑兑现节奏对照（已收，mat-863746）
    logic: 同为中国ADC平台型公司+海外MNC多资产打包授权（2022年起4笔交易最高118亿美元），可对照里程碑触发/项目中止的实际分布
    limitation: 2023-10默沙东终止其中2款临床前项目（无需退还/无终止费），当日科伦系股价跌6.9-7.2%——提示"总额百亿美元"里个别子项目中止是常见现象但仍冲击股价，需跟踪BMS的具体项目层面进展而非只看总额数字

key_risks_to_monitor:
