# L1/L2 已坍缩为 primer_scope（背景理解层交给 00_primer，primer-first）
primer_scope: >
  00_primer 须覆盖：双特异性抗体偶联药物(bispecific ADC)技术原理及与传统单抗ADC的核心区别(1+1>2/耐药规避)；
  EGFR×HER3双靶机理及为何广谱覆盖上皮源肿瘤(阻断同源+异源二聚体)；iza-bren关键技术参数含义(8:1 DAR/可裂解四肽linker/topo I payload Ed-04)；
  平台型biotech(SEBA+payload+HIRE-ADC三平台协同)vs单资产biotech的商业模式差异；
  BD授权"首付款+里程碑款+销售分成"三类现金流确认机制及其对营收的大幅扰动(2024营收+936%、2025-56.72%的会计成因)；
  中国创新药License-out"高总额低首付"模式+里程碑达成率(~22%)/退货率(~40%)现实；
  "药物获批"与"商业化放量"两阶段本质差异及各自观测指标；各适应症(NPC/NSCLC/ESCC/TNBC/尿路上皮)临床意义与市场量级差异；
  创新药"烧钱-融资-商业化"周期及研发费用占营收99.75%、经营现金流为负的机理；鼻咽癌后线治疗临床背景与未满足需求；
  PS/PB对未盈利biotech的估值局限+为何用rNPV/管线期权而非PE；突破性疗法/优先审评/NDA受理→获批的监管路径含义；
  可比中国biotech(信达/荣昌/百济)BD后估值消化的历史模式(作理解锚)；港股IPO各阶段含义(递表→失效→重递→聆讯→发售/延迟)。

