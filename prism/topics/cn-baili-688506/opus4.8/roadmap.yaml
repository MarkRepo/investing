key_risks_to_monitor:
  - "利好出尽:最大催化(获批)已兑现且股价贴52周高，后续需更高台阶续估值"
  - "小适应症天花板:末线鼻咽癌市场量级有限，大适应症放量是2027+的事"
  - "里程碑或有性:历史达成率仅22%，$71亿里程碑高度不确定"
  - "融资/摊薄:H股延迟+年burn30亿+，下一轮定增稀释风险"
  - "平台同质化:下一代双抗/双载荷ADC超100款内卷，代差可能收窄"

analogies_to_study:
  - case: "荣昌生物RC48/维迪西妥单抗 BD后估值消化(2020 Seagen授权→估值回落)"
    logic: "同为中国ADC出海BD标杆，BD兴奋后进入商业化兑现检验期，估值从期权定价回归基本面"
    limit: "RC48为单抗ADC、适应症/临床数据不同；百利双抗代差更硬、BMS总额更大"
  - case: "PD-1从蓝海到红海(2018-2023四小龙国谈降价70-85%)"
    logic: "创新靶点从'全球首个/差异化'到'拥挤内卷/以价换量'的路径，映射双抗ADC未来"
    limit: "PD-1同质化程度极高；双抗ADC技术壁垒更高、玩家更少(短期)"
  - case: "信达/百济BD后估值路径 + 中国医药50强定价逻辑(市值前十)"
    logic: "可比创新药企在'商业化元年'前后的PS分位与市值消化节奏，作估值锚"
    limit: "百济已盈利、信达管线更宽；百利仍单资产依赖、剔BD深亏"
