learning_track:
  l1_orientation:
    - question: "HAE / AATD / HSD / TTR-CM 的全球患者基数、严重度分层、平均年治疗成本是多少？"
      source_hint: "训练知识 + Orphanet/NORD 罕见病数据库；BioCryst/Takeda/CSL/Vertex 年报"
    - question: "in vivo CRISPR/base editing 当前在罕见病的临床进展全景（NTLA/BEAM/VERVE/Editas/Caribou 等）？"
      source_hint: "复用父 mat-8d4e6d (NTLA 10-K) + mat-797ff7 (BEAM 10-K)；外补 ASGCT 2026 conference report"
    - question: "罕见病 in vivo 编辑产品的 BLA / NDA 监管路径（FDA RMAT / accelerated approval / breakthrough designation）和典型周期？"
      source_hint: "FDA OTAT 罕见病基因疗法批准记录；Casgevy 2023-12 批准案例对照"
    - question: "罕见病现有标准疗法的市场格局、价格、保险覆盖（HAE: BioCryst Orladeyo / Takeda Takhzyro / CSL Berinert; AATD: CSL Behring Prolastin/Aralast/Glassia / Grifols Liquid; TTR: BridgeBio Acoramidis / Pfizer Vyndaqel / AZ Onpattro）？"
      source_hint: "BioCryst 10-K (BCRX) + Takeda 年报 + CSL 年报 + BridgeBio 10-K (BBIO)"

  l2_history:
    - question: "首个 HAE 预防性疗法（2008 Berinert / 2009 Cinryze / 2014 Takhzyro / 2020 Orladeyo）的市场扩张节奏、首年-第三年渗透率？"
      source_hint: "BioCryst Orladeyo 上市后季度财报；Takeda Takhzyro 历史 sales 数据"
    - question: "Vertex CF 商业模式（2012 Kalydeco → 2025 $11B sales）的渐进式渗透曲线，作为 NTLA HAE 长期 peak sales 的参考？"
      source_hint: "Vertex 历史年报；Vrtx 投资者日 CF 系列产品销售拆分"
    - question: "RNAi 药物 Onpattro（Alnylam 2018 ATTR）+ siRNA Leqvio（Novartis 2020 PCSK9）首年-第三年商业化爬坡历史，作为 in vivo 编辑首年渗透率的参考？"
      source_hint: "Alnylam 历史年报；Novartis Leqvio 季度披露"
    - question: "2010-2025 罕见病基因疗法 first-in-class 商业化失败案例（Glybera 2012 EMA 批准 → 2017 撤市；Strimvelis 2016 → 2023 撤市；Skysona 商业化挑战）"
      source_hint: "训练知识 + 业内综述 (Nature Reviews Drug Discovery)"

  l3_debates:
    - question: "in vivo CRISPR 一次性给药 vs 现有终身订阅式产品（Orladeyo $700K/年）的实际价格 / 报销定位是什么？保险方愿意支付一次 $1.5-3M 还是分摊定价？"
      source_hint: "ICER 2025-2026 cost-effectiveness 报告；CMS gene therapy reimbursement 框架"
    - question: "首年商业化渗透率市场 bull case（Goldman Sachs 估 15-30%）vs bear case（订阅锁定推测 5-10%）的关键变量是什么？"
      source_hint: "Goldman/Morgan Stanley/Citi 2026 NTLA 投行覆盖；BioCryst/Takeda 历史首年数据反推"
    - question: "BEAM-302 双剂 60mg Grade 4 ALT 是 LNP 平台共性问题还是个案？是否会扩散到 NTLA HAE 单剂场景？"
      source_hint: "复用父 mat-2b431a；外补 BEAM ASGCT 2026 prelim safety update"
    - question: "KalVista 口服 plasma kallikrein 抑制剂（NDA 阶段）vs NTLA 一次性 in vivo 编辑的真实临床偏好（医生 + 患者双视角）？KalVista 价格 + 便利性 vs NTLA 永久性 + 高 upfront 成本"
      source_hint: "KalVista 10-K (KALV) + KalVista NDA filings + AAAAI 2026 学会会议反馈；外补 HAEA 患者协会调研"
    - question: "中国 in vivo 编辑公司（YolTech/博雅辑因 在 HAE / AATD 路线）的速度和成本结构能否在 ex-US 市场（特别是亚洲 + 中东）提前抢占？"
