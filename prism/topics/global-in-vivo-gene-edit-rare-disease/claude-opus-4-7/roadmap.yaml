analogies_to_study:
  - case: "Vertex CF 商业模式 (2012 Kalydeco → 2025 $11.2B sales)"
    why_similar: "罕见病单基因 / first-in-class / 13 年渐进式渗透 / 多品种线生命周期"
    why_different: "CF 患者基数（~80,000 全球）大于 HAE（~6,000-8,000）+ AATD severe（~100,000）；VRTX CF 是慢性给药，NTLA HAE 是一次性给药"
  - case: "Onpattro/Patisiran (Alnylam 2018 ATTR-CM)"
    why_similar: "RNA 干预/编辑技术 first-in-class + 一次性给药模型 + 罕见病爬坡曲线"
    why_different: "ATTR 患者基数远小（~50,000 全球）；2022-2024 被 Vyndaqel/Acoramidis 替代；Onpattro 商业化挑战"
  - case: "BioCryst Orladeyo (2020-12 HAE 口服批准)"
    why_similar: "HAE 适应症 + 渐进市场进入（2022 sales $250M / 2024 $400M / Bull case 2027 $700M）"
    why_different: "Orladeyo 是订阅式 $700K/年 + 现有 BioCryst 销售队伍；NTLA HAE 一次性 + 缺乏既有商业化能力"

