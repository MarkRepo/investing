slug: global-in-vivo-gene-edit-rare-disease
variant: claude-opus-4-7
version: 1
last_updated: 2026-05-23
data_freshness: 2026-Q1

thesis:
  one_liner: NTLA / BEAM 在 2026-2028 兑现首个 in vivo CRISPR / base editing 罕见病 BLA 与商业化爬坡，但首年漏斗效应是核心风险
  confidence: 7/10
  delta_from_v0: +2 (HAELO Phase 3 阳性 + BEAM-302 60mg locked 双重确认)

buy_box:
  primary_targets:
    - ticker: NTLA
      weight_in_basket: 50%
      rationale: HAELO Phase 3 -87%/62% AF/0 SAE + rolling BLA 2026-04 启动；first-in-class HAE in vivo CRISPR
      fair_value_low: 40
      fair_value_high: 50
      bull_case: 70+
      bear_case: 12
    - ticker: BEAM
      weight_in_basket: 30%
      rationale: BEAM-302 60mg pivotal locked + AAT 16.1µM + Pfizer/Apellis opt-in
      fair_value_low: 50
      fair_value_high: 65
      bull_case: 100+
      bear_case: 18
  secondary_targets:
    - ticker: EDIT
      weight_in_basket: 10%
      rationale: 篮子分散，低估值 deep value option；reni-cel 平台仍有重启价值
    - ticker: VERV
      weight_in_basket: 10%
      rationale: 已私有化（LLY 收购），通过 LLY 间接持仓；PCSK9 in vivo 编辑 platform read-across
  basket_logic: 等权 4 标的篮子；单事件死亡 / CRL 单标的最大敞口 -2%（总组合 4-7%×单仓 30% = -1.2-2.1%）

position_framework:
  total_portfolio_pct: 4-7%
  single_name_max: 2%
  vehicle: 单一现货持仓优先；可叠加 NTLA / BEAM 长 call 期权（catalyst 前 30-45 天）
  rebalance_freq: 季度（catalyst 后立即）
  hedging:
    - 长 SPY put 0.5-1% 总组合（biotech beta 对冲）
    - XBI / IBB short 不推荐（赛道集中持仓时反向暴露过大）

entry_signals:
  - 2026 Q3 NTLA-2002 BLA 受理 + Priority Review 通过 → 加仓至全仓
  - 2026 Q4 BEAM-302 60mg cohort 入组 ≥ 月 5 例 → 维持 BEAM 仓位
  - 2027 Q1 PDUFA 决定前 45 天 → catalyst 加仓 +30%
  - 任何 BP 公开提及 NTLA / BEAM 收购意向 → 期权策略加仓

exit_signals:
  kill_criteria:
    - id: KC1
      condition: NTLA-2002 BLA 收 CRL
      action: 72 小时内降仓 50%
    - id: KC2
      condition: 任何 in vivo CRISPR / base editing 第二例死亡（不限公司）
      action: 立即清仓 in vivo 编辑全部敞口，等待 1-2 季度
    - id: KC3
      condition: BEAM-302 60mg pivotal cohort 两例 Grade 4+ ALT 或 1 例肝衰
      action: BEAM 清仓 + NTLA 降仓 30%
    - id: KC4
      condition: KalVista EKTERLY 上市第 2 年销售 > $400M
      action: K5-RD 反转 → 整体降仓 30%
    - id: KC5
      condition: NTLA / BEAM 上市后第一个完整年销售合计 < $50M
      action: 商业化失败信号 → 整体降仓 60%
    - id: KC6
      condition: IRA 实质修订（罕见病豁免被收紧）
      action: 立即重定价 → 降仓 25%
    - id: KC7
      condition: NTLA 现金 runway < 12 个月且无新融资 channel
      action: 信用风险 → 立即清仓 NTLA

valuation_models:
  - name: NTLA SOTP risk-adjusted DCF
    base_case: $1.5-2.0B EV
    bull_case: $5-7B EV
    bear_case: $0.5-0.8B EV
    key_drivers:
      - HAE BLA approval prob = 75%
      - HAE peak penetration 5 年 = 50%
      - HAE peak revenue = $1.0-1.5B
      - ATTR-CM peak revenue = $1.0B (远期 2030+)
      - WACC = 12% biotech
  - name: BEAM SOTP risk-adjusted DCF
    base_case: $1.5-2.0B EV
    bull_case: $4-6B EV
    bear_case: $0.5-1.0B EV
    key_drivers:
      - AATD BLA approval prob = 50%
      - AATD peak revenue = $0.8-1.2B
      - risto-cel peak (vs Casgevy) = $0.3-0.5B
      - Pfizer / Apellis opt-in = ~$0.3-0.5B 期权
  - name: Mirror-based 期望回报（18-30 月）
    expected_irr: 30%
    sharpe_estimate: 0.7-0.9
    weighted_return:
      ultra_bull_15pct: +200-400%
      bull_25pct: +60-100%
      neutral_30pct: 0-40%
      bear_20pct: -30 to -50%
      ultra_bear_10pct: -60 to -85%

