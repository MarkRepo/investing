  - quarter: 2026 Q3
    event: NTLA-2002 BLA 受理决定 + Priority Review
    impact: confirm/deny K1-RD timeline
    threshold: FDA acceptance + Priority Review designation
  - quarter: 2026 Q4
    event: BEAM-302 60mg pivotal cohort 入组进度
    impact: confirm/deny K2-RD timeline
    threshold: 入组 ≥ 月 5 例 + 无 protocol amendment
  - quarter: 2026 Q4
    event: KalVista EKTERLY 第 2-3 季销售
    impact: confirm/deny K5-RD 强度
    threshold: $30-50M Q4 触发警示
  - quarter: 2026 Q4
    event: VRTX Casgevy 漏斗数据透明度回归
    impact: inform K3-RD base rate
    threshold: 月度 patient infused 数据
  - quarter: 2027 Q1
    event: EU JCA 首例 in vivo gene editing 评估
    impact: inform 报销天花板
    threshold: positive/negative opinion
  - quarter: 2027 Q1
    event: NTLA-2002 PDUFA 决定
    impact: terminal K1-RD
    threshold: FDA 批准 / CRL
  - quarter: 2027 Q2
    event: BEAM-302 60mg pivotal data readout
    impact: terminal K2-RD
    threshold: AAT ≥ 11µM + Z-AAT 减 >70% + 0 SAE
  - quarter: 2027 Q3
    event: NTLA-2002 美国上市第一季销售
    impact: inform K3-RD start
    threshold: $/Q + 治疗例数
  - quarter: 2027 Q4
    event: Verve VERV-101 PCSK9 长期数据
    impact: read-across K4-RD
    threshold: 维持降幅 + 长期 safety
  - quarter: 2028 Q1
    event: NTLA-2002 上市首年销售 readout
    impact: terminal K3-RD year-1
    threshold: > $100M base / > $200M bull / < $50M bear
  - quarter: 2028 Q3
    event: NTLA-2002 12 月 long-term safety data
    impact: confirm K4-RD
    threshold: 任何 SAE 或 ALT 升高

