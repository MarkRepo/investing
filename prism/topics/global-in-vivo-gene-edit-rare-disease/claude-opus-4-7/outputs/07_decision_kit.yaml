assumptions:
  must_be_true:
    - HAELO Phase 3 数据可作为 BLA 单一支撑（precedent: Casgevy）
    - LNP IV 单次给药 1-3 年 follow-up 无新 SAE
    - HAE 治疗中心美国 onboarding 18 月内 ≥ 80 家
    - 一次性 gene therapy 报销路径未在 2027 前实质收紧
  could_be_false:
    - HAE 患者 stated → revealed preference 转换率 ≥ 30%（vs Casgevy 21%）
    - KalVista oral 阵营不超过 70% HAE 池子份额
    - BEAM-302 60mg pivotal 不出现新 Grade 4 ALT
    - BP 18 个月内并购 NTLA / BEAM 概率 30%+
  most_uncertain:
    - 上市第一年实际治疗例数 + 年化销售
    - LNP IV 5-10 年 long-term safety
    - Verve / Editas 平台 read-across catalysts

review_cadence:
  full_refresh: 季度
  signpost_check: 月度（2026 H2 起）
  catalyst_alert: 即时（任何上述 signpost 事件）
