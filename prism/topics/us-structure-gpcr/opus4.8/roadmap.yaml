key_risks_to_monitor:
  - "aleniglipron Phase 3 顶线（预计 2027-28）——最大二元事件"
  - "Roche 授权关系变动 / 优先谈判权行使"
  - "ATM 持续增发节奏（摊薄监控）"
  - "LLY orforglipron / Novo oral 上市放量斜率（挤压窗口）"
  - "口服 GLP-1 专利诉讼进展（第三方或反诉）"

analogies_to_study:
  - name: "他汀 vs PCSK9 抑制剂（US pharma, 2015-）"
    logic: "疗效更强的新类（PCSK9）被更便宜、已装机的老类（他汀）成本/可及性护城河压制，利润池远不及预期"
    limitation: "GLP-1 减重是全新利润池，非替代存量；口服 vs 口服而非口服 vs 注射"
    ring: historical-mirror
    reuse: mat-a6e783
  - name: "Gilead 丙肝 DAA 专利战（Gilead vs Merck, 2016）"
    logic: "即便拥有最强分子与 IP，仍可能反被诉赔付，且利润池随治愈型用药+仿制快速崩塌"
    limitation: "丙肝是治愈型（一次性），GLP-1 是慢病长期用药，利润池节奏不同"
    ring: historical-mirror
    reuse: mat-56ee94, mat-da05cc
  - name: "DPP-4/SGLT2 口服糖尿病小分子（2010s）"
    logic: "口服小分子专利到期后仿制侵蚀，利润池寿命受专利悬崖硬约束"
    limitation: "GPCR 专利到 2041-45，悬崖较远；但示范仿制侵蚀终局"
    ring: historical-mirror
    reuse: mat-daac55
