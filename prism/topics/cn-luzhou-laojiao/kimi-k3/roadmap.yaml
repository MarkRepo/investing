key_risks_to_monitor:
  - "飞天茅台批价跌破 1600/1500 元（K1 证伪 → 千元带整体下移，触发卖出纪律）"
  - "2026 中报（8 月底）：营收/净利降幅是否收窄、合同负债环比方向、税金及附加率变化（K3+K5 验证节点）"
  - "2026 年度分红方案是否足额兑现 85 亿、口径是否从保底额转为分红率（K4 证伪点）"
  - "国窖1573 批价月度序列：是否连续 2 个月不创新低、对普五反超是否维持（K1 右侧确认）"
  - "消费税征收环节后移是否进入立法/征求意见程序（K5 升级为命门的触发器）"
  - "茅台公司量价政策（控量/提价/拆箱）变动——行业天花板的直接传导源"

analogies_to_study:
  - case: "中国白酒 2013-2015 深度调整（限三公+塑化剂）"
    logic: "政策冲击→需求坍塌→库存出清→批价下行→控量挺价→龙头先反转；本轮同样政策+库存双杀"
    limit: "本轮需求结构已大众化（政务占比远低于 2013）、无塑化剂式安全事故、新增消费税改革变量、茅台金融属性更强"
  - case: "洋河股份 2019-2021 渠道库存危机"
    logic: "渠道压货模式失效→库存高企+价格倒挂→主动控货去库存→营收连续两年下滑→去库存成功后修复；单公司层面与老窖当前处境最像"
    limit: "洋河是次高端区域龙头（品牌高度不及国窖1573）；洋河调整期行业仍上行（有行业β托底），本轮是全行业下行"
  - case: "法国干邑 2012-2015（中国反腐冲击）"
    logic: "高端烈酒对中国政务/礼品需求依赖→反腐后需求坍塌→人头马/轩尼诗靠大众市场+美国市场重构需求复苏"
    limit: "干邑有全球市场分散（美国 hip-hop 文化接盘），国窖 1573 几乎 100% 依赖国内市场；复苏路径不可照搬"
