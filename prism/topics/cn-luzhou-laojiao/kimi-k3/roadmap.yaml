primer_scope: "primer 覆盖背景层：浓香酿造机理/窖池资产、茅五泸格局史与价格锚传导链、渠道体系与合同负债先行性、价格倒挂机理、2013-2015 周期史、消费税机制、控量挺价策略史、库存观测信号清单、高端需求结构（政务/商务/宴席/收藏）、双品牌攻守逻辑（详见 decomposition_v0 §三 10 条入门目标）"

learning_track:
  l1_orientation: []   # S2 坍缩进 primer_scope
  l2_history: []       # S2 坍缩进 primer_scope

  l3_debates:          # 争议层：分歧在哪（喂决策链环④）
    - question: 茅台批价 1700 元是不是本轮底？多头押官方控量+1639 指导价托底，空方押收藏/投资性社会库存出清才刚开始——全行业定价锚之争
      source_hint: 月度批价高频（酒价内参/今日酒价）、茅台公司控量政策公告、渠道草根
    - question: 「控量挺价」是保品牌的理性选择还是失血陷阱？核心分歧：牺牲报表换价盘在需求回暖前是净收益（2014 茅台模式）还是价值陷阱（E 缩水使 PE 被动抬升）
      source_hint: 2013-2015 复盘料 vs 当前季报降幅、卖方多空报告
    - question: 85 亿保底分红是硬底还是必然被修正的承诺？分歧点：2026 净利 <85 亿时分红率破 100% 的可持续性——股东会决议约束力 vs 财务现实
      source_hint: 分红回报规划公告、经营现金流、账面现金、洋河/格力等高分红承诺修正先例
    - question: 国窖1573 批价反超普五是格局性变化（品牌势能真上移）还是被动现象（五粮液放量跌价更快）？若是后者，国窖守价将丢量、保量将丢价
      source_hint: 茅五泸三家年报量价拆解、批价高频、渠道调研
    - question: 消费税新规是已消化的明牌（程序性征管细化）还是未定价的慢变量（征收环节后移+税负提升）？
      source_hint: 税务总局公告原文、财政部后续细则、2026 中报税金及附加率

  l4_hunting:          # 狩猎层：找错误定价（逐条对齐 thesis K#）
    - question: 国窖1573 批价 2026H2 能否止跌（连续 2 个月不创新低）并维持对普五反超？市场当前价格隐含的企稳概率是多少？
      addresses: [K1]
      search_keywords: [国窖1573 批价, 普五 批价, 飞天茅台 批价]
      source_hint: 酒价内参月度序列、今日酒价、不二酱
    - question: 渠道真实库存（经销商+终端+社会库存）能否在 2026 年底降至 3 个月健康水位？价格倒挂何时消除？
      addresses: [K2]
      search_keywords: [白酒 渠道库存, 泸州老窖 经销商, 白酒 动销]
      source_hint: 草根调研纪要、微酒/酒业家、机构调研记录、合同负债环比
    - question: 2026H2 业绩降幅收窄的领先信号是什么？市场对 2026E 净利一致预期（约 95 亿）是否仍过于乐观（证伪点：Q2 中报/合同负债）？
      addresses: [K3]
      search_keywords: [泸州老窖 中报, 泸州老窖 盈利预测, 泸州老窖 合同负债]
      source_hint: 2026 中报（8 月底）、业绩预告、卖方盈利预测调整轨迹
    - question: 85 亿保底分红的现金流覆盖机理——2026 经营现金流能否覆盖分红+capex？承诺修正的触发条件（净利阈值）是什么？
      addresses: [K4]
      search_keywords: [泸州老窖 经营现金流, 泸州老窖 分红, 泸州老窖 现金]
      source_hint: 2025 年报现金流量表、分红回报规划原文、洋河等高分红修正先例
    - question: 消费税新规落地后白酒企业实际税负率是否上升（>1pct）？征收环节后移是否进入立法/征求意见程序？
      addresses: [K5]
      search_keywords: [白酒消费税 税负, 消费税 征收后移, 白酒 税金及附加]
      source_hint: 2026 中报税金及附加率、财政部/税务总局后续文件、券商政策点评

