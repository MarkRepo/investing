key_risks_to_monitor:
  - H20/B30 等英伟达特供品回归挤压国产替代（CUDA 生态惯性）
  - 全球 AI capex 见顶导致 capex-beta 层戴维斯双杀
  - 智算中心结构性过剩、利用率与 ROI 不达预期
  - 上游产能（中芯 7nm/国产 HBM）卡住导致国产芯片有单无货
  - 推理效率提升（DeepSeek 式）压低单位算力的硬件/网络需求
  - 国产 GPU 创业梯队一二级估值倒挂、巨亏难兑现

analogies_to_study:
  - case: 中国面板产业国产替代（京东方 2010s，从亏损到全球第一）
    logic: 国家意志+巨额资本+逆周期扩产实现从0到全球龙头，类比算力芯片自主可控路径
    limit: 面板是成熟制程+标准品，算力芯片受先进制程禁运卡脖子、生态壁垒(CUDA)更高
  - case: 中国存储（长江存储/长鑫）国产替代周期
    logic: 同样受美国制裁、同样从落后追赶、同样资本密集，且与本研究 HBM 命门直接相关
    limit: 存储是相对标准化品类，AI 芯片软件生态绑定更深
  - case: 2000年光通信泡沫 / 2021 全球半导体超级周期
    logic: capex-beta 板块（光模块/设备）在需求高峰估值见顶后的戴维斯双杀剧本，类比当前光模块位置
    limit: 当前 AI 需求体量与持续性可能强于历史，不能简单照搬泡沫破裂时点
