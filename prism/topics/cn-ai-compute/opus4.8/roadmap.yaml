# roadmap.yaml — 研究路线图 (workflow 01)
slug: cn-ai-compute
variant: opus4.8
created: 2026-06-06
thesis_version: 0

# S2: L1/L2 坍缩为 primer scope，背景理解交给 00_primer
primer_scope: >
  primer 该覆盖：中国算力六层产业链边界（芯片→HBM/制程上游→服务器整机→网络/光模块→IDC/智算中心→云调度）、
  各层参与者与国产化率、市场规模与发展阶段、训练vs推理范式、自主可控vs全球capex-beta两条逻辑分层、
  出口管制演变（H20/B30）、一次半导体国产替代历史周期类比。

learning_track:
  l3_debates:         # 争议层：展开 thesis 的最大反方观点
    - question: H20/B30 回归是否会实质打断国产替代节奏？大厂会因 CUDA 生态惯性回流英伟达，还是国产已过临界点？
      source_hint: 卖方电子/计算机组对国产替代节奏的多空报告 + 信通院自给率数据 + 大厂采购结构调研
    - question: 光模块/服务器 ODM 的高估值（中际旭创9000亿、工业富联万亿）是周期中段还是顶部？这是国产 alpha 还是全球 beta？
      source_hint: 英伟达 capex 指引 + 北美云厂 capex 拐点 + 800G→1.6T 出货曲线 + 卖方光模块深度
    - question: 推理放量到底利好谁？若 DeepSeek 式效率压低单位算力的卡/网络用量，光模块 beta 逻辑是否被削弱？
      source_hint: 卖方推理vs训练算力结构报告 + DeepSeek/Kimi 等高效模型对算力需求的影响分析
    - question: 458+ 智算中心是真实需求还是补贴驱动的结构性过剩？谁能盈利、利用率几何？
      source_hint: 第三方 IDC 上架率/单IT收入 + 智算中心招标价与折旧 + 通信行业 IDC 深度
    - question: 国产 GPU 创业梯队（摩尔线程/沐曦）已上市但巨亏，二级高估值是否一二级倒挂、能否兑现规模收入？
      source_hint: 招股书 + 上市后业绩 + 卖方对国产 GPU 商业化节奏的判断

  l4_hunting:         # 狩猎层：逐 K# 对齐
    - question: H20/B30 回归后，昇腾+寒武纪+昆仑芯等国产卡在国内数据中心新增份额，2026 全年是否延续 12%→25% 上行斜率？
      addresses: [K1]
      search_keywords: [国产AI芯片 份额, 昇腾 出货 2026, 信通院 算力 自给率]
      source_hint: 信通院/各厂出货数据 + 卖方国产算力深度
    - question: 中芯 7nm(N+2) 2026 产能是否真翻倍、国产 HBM3 是否规模量产并进入昇腾/寒武纪 BOM？
      addresses: [K2]
      search_keywords: [中芯国际 7nm 产能 2026, 长鑫 HBM3 量产, 昇腾 国产HBM]
      source_hint: 中芯 IR/业绩会 + 存储行业垂直媒体 + 昇腾产业链拆解
    - question: 推理 vs 训练算力占比演变，及单位推理的网络/光模块用量——推理是否削弱光模块 beta、利好国产推理卡？
      addresses: [K3]
      search_keywords: [推理 训练 算力 占比, 推理芯片 国产, 光模块 推理 需求]
      source_hint: 卖方 AI/通信组算力结构深度
    - question: 中际旭创/新易盛/工业富联 1.6T 光模块、GB200 机柜订单与利润 2026-2027 能否延续高增，还是英伟达周期顶部？
      addresses: [K4]
      search_keywords: [中际旭创 1.6T 订单 2026, 工业富联 GB200, 英伟达 capex 指引]
      source_hint: 公司财报 + 英伟达财报电话会 + 卖方光模块/ODM 深度
    - question: 458+ 智算中心实际利用率与单项目 ROI，第三方IDC vs运营商 vs国资谁能盈利？
      addresses: [K5]
      search_keywords: [智算中心 利用率 ROI, 润泽 数据港 上架率, 智算中心 招标 价格]
      source_hint: IDC 公司年报 + 通信行业深度 + 招标网
    - question: 字节/阿里/腾讯 2026-2027 AI capex 是否延续 25%+ 增长，还是全链通胀后透支回落？
      addresses: [K6]
      search_keywords: [字节 阿里 腾讯 capex 2026, 互联网大厂 资本开支, AI capex 指引]
      source_hint: 各公司财报电话会 + 财经媒体汇总

