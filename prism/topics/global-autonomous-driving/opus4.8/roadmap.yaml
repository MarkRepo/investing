# roadmap.yaml — 研究路线图 (workflow 01)
slug: global-autonomous-driving
variant: opus4.8
created: 2026-07-28
thesis_version: 0

primer_scope: >
  primer 该覆盖：行业边界(SAE L0-L5 + 全栈价值链上中下游) / 参与者(芯片·传感器·域控 / 方案商·OEM自研 / robotaxi·robotruck运营) /
  市场规模(乘用车智驾前装 + robotaxi 运营两条) / 发展阶段(城市NOA 渗透拐点 + robotaxi 商业化前夜) /
  周期(渗透率 S 曲线当前位置) / 技术路线(纯视觉 vs 多传感器融合、模块化 vs 端到端/VLA、有图 vs 无图)。

learning_track:
  l3_debates:
    - question: "Nvidia 反击 vs 去英伟达化：Thor V15/舱驾融合能否 2026-2027 夺回高端定点？OEM 自研芯片(比亚迪4nm/蔚小理)体验能否达到公版水平、普及速度是否快到连地平线份额都被吃？"
      source_hint: "36氪/OFweek 芯片深度 + 地平线IR + 车企发布会"
    - question: "robotaxi 兑现时点：单位经济学 2026-2027 拐点(RT6降本+规模)兑现 vs 烧钱久期>5年——'观察档'会否踏空一个万亿级终局？"
      source_hint: "百度财报电话会 + Waymo 披露 + 券商 robotaxi 专题"
    - question: "纯软方案商护城河：数据飞轮规模效应(Momenta多客户) vs 智驾平权价格战被 OEM自研+华为+大疆卓驭三面挤压——端到端时代软件是不是最高毛利环？"
      source_hint: "Momenta 招股书 + 券商方案商深度"
    - question: "激光雷达：前装放量利好(禾赛全球第一) vs 纯视觉端到端压缩长期 TAM——量增能否转成利增(持续正毛利/净利)？"
      source_hint: "禾赛/速腾 IR 季报 + Yole 报告 + 路线之争分析"

  l4_hunting:
    - question: "地平线征程6(J6P高阶)在 15万+价格带车型的定点/装机份额 2026-2027 是否持续第一，且不被 OEM 自研 + 舱驾融合芯片显著侵蚀？"
      addresses: [K1]
      search_keywords: ["征程6 定点 份额", "舱驾融合 芯片", "地平线 市占率 2026"]
      source_hint: "地平线IR/机构调研 + 卖方芯片份额表"
    - question: "Nvidia Thor(或后继)是否在 2026-2027 兑现舱驾融合量产上车 + 算力达标 + 拿回 ≥2 家头部新定点，还是继续跳票/被去英伟达化？"
      addresses: [K2]
      search_keywords: ["Thor 量产 上车", "英伟达 舱驾融合", "Thor 定点 车企"]
      source_hint: "Nvidia GTC + 造车新势力硬件方案"
    - question: "百度萝卜/Waymo 是否披露单车运营正毛利或盈亏平衡(单公里成本<对标网约车)及兑现时点？"
      addresses: [K3]
      search_keywords: ["萝卜快跑 盈亏平衡", "robotaxi 单车成本", "Waymo 单位经济学"]
      source_hint: "百度电话会 + 36氪/科创板日报"
    - question: "华为乾崑搭载量/合作品牌 2026 破 200 万后是否持续扩张且保住高阶份额，还是被比亚迪自研 + Momenta/大疆平价方案分流？"
      addresses: [K4]
      search_keywords: ["华为乾崑 搭载量", "ADS 份额 2026", "鸿蒙智行 销量"]
      source_hint: "华为引望披露 + 鸿蒙智行销量"
    - question: "禾赛/速腾车载激光雷达是否实现持续正毛利 + 净利转正(而非仅出货增长)？robotaxi 转 ADAS 激光雷达能否稳住 ASP？"
      addresses: [K5]
      search_keywords: ["禾赛 毛利率 净利", "速腾 盈利 2026", "激光雷达 ASP"]
      source_hint: "禾赛/速腾 IR 季报"
    - question: "Momenta 港股 IPO 后是否兑现清晰盈利路径，还是在智驾平权价格战中毛利被三面挤压、千亿估值证伪？"
      addresses: [K6]
      search_keywords: ["Momenta 盈利 路径", "智驾 价格战", "纯软 方案商 毛利"]
      source_hint: "Momenta 招股书财务 + 券商点评"
    - question: "纯视觉端到端(特斯拉 FSD 入华 + 中国车厂去激光雷达)是否在 2026-2027 形成规模化上车，从而决定激光雷达 TAM 长期上限？"
      addresses: [K7]
      search_keywords: ["FSD 入华 规模", "去激光雷达 车型", "纯视觉 端到端 上车"]
      source_hint: "特斯拉中国 + 中国车厂技术发布会"

