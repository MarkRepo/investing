key_risks_to_monitor:
  - "Nvidia Thor V15/舱驾融合兑现节奏(反击成功则错杀 Nvidia arena)"
  - "OEM 自研芯片普及速度(侵蚀地平线份额)"
  - "robotaxi 单位经济学拐点时点(观察档踏空万亿终局)"
  - "智驾平权价格战(纯软方案商毛利崩塌)"
  - "纯视觉端到端逆转激光雷达 TAM"
  - "L3/L4 监管责任落地(中国强制国标 + UN 全球法规)"

analogies_to_study:
  - name: "2016-2019 全球/中国 L4 寒冬"
    logic: "资本狂热后商业化未兑现、玩家出清(图森退市/Argo关停/Cruise停注资)"
    limit: "如今端到端+城市NOA 有真实量产收入与飞轮，非纯 PPT"
    ring: historical-mirror
  - name: "中国光伏/LED 国产替代→产能过剩→价格战"
    logic: "智驾平权可能重演供给过剩、龙头微利(激光雷达/芯片放量薄利)"
    limit: "软件+数据飞轮有差异化壁垒，非纯制造同质化"
    ring: industry-mirror
  - name: "智能手机 SoC(高通/联发科 vs 苹果自研)"
    logic: "卖铲人 vs 客户自研的长期博弈，镜鉴自研侵蚀节奏(Nvidia/地平线 vs OEM)"
    limit: "汽车 OEM 自研门槛/规模低于手机，侵蚀路径未必同速"
    ring: industry-mirror
