    - question: 银漫致命事故史(2018-12)+297 万吨大规模扩产，市场对"量按期兑现"的定价是否过于乐观？
      source_hint: 建设用地批复公告 + 在建工程季度轨迹 + 招股书产能时间表(待)
    - question: 控股股东质押=其所持 100%(占总股本 20.46%)+集团重整刚 2025-10 完成，治理/流动性尾部风险是否被"翻身叙事"掩盖？
      source_hint: 质押/解押公告季度轨迹 + 集团债务重整 + 天津信业受让 6.87%
    - question: H 股 IPO 递表遭港交所发回(保荐中金被"贴堂")，是流程瑕疵还是招股书披露/合规实质问题？摊薄与折价风险多大？
      source_hint: 发回重递公告 + 每经/ZAKER 报道 + 招股书正文(待重递披露)

  # L4 狩猎层：找错误定价（每条对齐 thesis Killer Question）
  l4_hunting:
    - question: 银漫二期(297 万吨)主体工程能否 2026 底完成、2027 全面达产？宇邦一期 330 万吨能否 2026 投产？季报在建工程%与分金属产量能否验证？
