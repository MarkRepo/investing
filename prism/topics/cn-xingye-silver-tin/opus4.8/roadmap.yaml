key_risks_to_monitor:
  - 银/锡价格深跌（银破 $45 或锡破 $45k 并持稳 ≥1 季度）→ 盈利+估值双杀
  - 银漫二期主体工程/达产较 2026 底/2027 延期 >2 季度 → "量"逻辑退化为纯价格投机
  - 控股股东质押重新上升 / 质押爆仓风险
  - H 股折价发行 >30% 或景气高位摊薄 A 股权益
  - 银漫安全/环保事故（2018 致命事故史）→ 停产击穿放量节奏

analogies_to_study:
  - 案例: 资源股价格顶部追高（2011 白银顶 / 2021-22 锂钴顶部矿企）
    类比逻辑: 商品价格历史高位时资源股估值与 EPS 同时见顶，戴维斯双杀
    类比局限: 兴业有独立"量"增量（产能放量），非纯价格 β
  - 案例: 高质押民营矿企爆雷（如部分 A 股高质押资源股股权冻结/易主）
    类比逻辑: 控股股东 100% 质押 + 集团高杠杆，流动性风险传导至上市公司
    类比局限: 集团重整已 2025-10 完成，天津信业(国资背景)受让改善治理
  - 案例: 银漫自身 2018-12 停产期股价复盘
    类比逻辑: 单一核心矿山事故/停产对"量"逻辑的直接冲击实证
    类比局限: 当前安全合规体系与彼时不同，但事故史提示尾部
