# L1/L2 坍缩为 primer_scope（背景深度交 00_primer，见 §1.2 primer↔case 分工）
primer_scope: >
  primer 应覆盖：银锡多金属采选商业模式（利润=量×(价−成本)）、白银工业属性 vs 金融属性、
  锡"小金属大弹性"供需结构、银漫矿业为何是核心资产（2018 事故→复产→二期扩产沿革）、
  资源禀赋量级（白银亚洲第一 24,536.7 吨 / 锡国内第二 24.35 万吨）意味什么、
  周期资源股报表盈利剧烈波动 & PE 拐点期误导、产能(万吨/年)如何折算金属产量(品位×回收率)、
  A+H 双重上市对资源股融资/估值/治理的一般影响、金属价格情景×产量路径的粗略盈利框架。

