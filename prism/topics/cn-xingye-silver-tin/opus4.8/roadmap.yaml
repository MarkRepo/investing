      source_hint: LME 银/锡 + 沪锡 + 金银比 + SHFE/LME 库存 + 卖方银锡价假设
    - question: 分金属(银/锡)单位现金成本 C1 是多少？成本曲线分位如何？Q1 峰值利润在价格回落下能留存多少？
