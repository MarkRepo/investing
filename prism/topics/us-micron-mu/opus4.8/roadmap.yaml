key_risks_to_monitor:
  - 季度毛利率从 74% 见顶下行 + DRAM 合约价环比转负（K2 周期顶确认信号）
  - HBM4 良率/客户认证落后 SK Hynix 一代（K1 护城河证伪）
  - 2027 AI capex 增速放缓 / "AI 泡沫"叙事松动导致 HBM"售罄"逆转（K4）
  - 行业 capex 持续高位 + CXMT/三星产能爬坡使 bit 供给增速反超需求（K3 供给洪水）
  - 卖方目标价集体下修 / 出现首个 Sell 评级（一致预期裂缝）

analogies_to_study:
  # → 每条落成 historical-mirror 收料 todo（环⑤输入），实证已收齐
  - case: 美国/内存/2018 顶 → 2019 崩
    logic: 同样由"超级周期"叙事(当年云/数据中心)推高 ASP 与毛利率至峰值后，供给过剩使价格断崖
    limit: 2018 缺 HBM 这类 wafer 折算双重收紧的结构性内核；当年无 AI 量级需求
    covered_by: [mat-6a8149, mat-b1a3bc]
    status: done
  - case: 美国/内存/2022 顶 → 2023 负毛利
    logic: 最近一轮完整 boom-bust，Micron 经历负毛利、减产、capex 急刹；命门1 下行回撤幅度的最佳锚
    limit: 2022 下行由需求骤冷(PC/手机/疫情退潮)驱动；本轮 AI 需求结构不同
    covered_by: [mat-bc352c, mat-f3679c]
    status: done
  - case: 内存行业/6 轮周期的"低 PE 陷阱"复盘
    logic: 历史上内存股在周期顶部 forward PE 最低(峰值 EPS×低倍数)，恰是最危险买点——直击当前 10.7x"便宜"叙事
    limit: 样本中无 HBM 这类结构性新需求层；本轮是否"这次不同"正是 thesis 焦点
    covered_by: [mat-b1a3bc]
    status: done
