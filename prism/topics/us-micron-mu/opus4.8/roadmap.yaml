primer_scope: >
  primer 该覆盖：内存为何是周期商品（供需边际定价）/ DRAM·NAND·HBM 三类边界与毛利分层 /
  三大寡头格局（Samsung·SK Hynix·Micron）+ CXMT 位置 / Micron 财年特殊性与季报关键指标 /
