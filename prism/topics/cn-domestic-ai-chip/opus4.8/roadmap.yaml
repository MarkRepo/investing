      ticker: SSE_688256
      source: cninfo 自动下载
      why: 环④EV兑现核心——收入/毛利/现金流质量(经营现金流与净利25.6亿缺口)/存货/客户集中度精确值；本arena旗帜标的但仅有web-search料，缺结构化年报
