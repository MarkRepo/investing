# roadmap.yaml — 研究路线图 (workflow 01 生成)
slug: cn-domestic-ai-chip
created: '2026-07-24'

# L1/L2 已坍缩为 primer_scope（背景深度交 00_primer）
primer_scope: >
  primer 该覆盖：国产 AI 芯片三条技术路线（昇腾NPU自研栈 / 寒武纪ASIC / 海光DCU类CUDA）、
  训练vs推理门槛差异、CUDA生态护城河与绕过路径、华为不上市下的产业链利润分配、
  Fabless设计vs上游产能利润池分布、AI芯片PS估值读法、客户集中度双面性、
  超节点"以系统补单芯"逻辑、出口管制博弈机制、"份额≠利润≠估值"京东方镜鉴、换股吸并资本运作机制。
  （详见 decomposition_v0.md §三 11 条入门目标）

learning_track:
  l3_debates:   # 争议层：把 thesis 反方展开为可调研争议点
    - question: 估值到底贵不贵——寒武纪 PS~80x/海光 27E PE 117x 是"透支2030份额质变"还是"成长期合理溢价"？多空定价锚差在哪？
      source_hint: 卖方估值模型（26E/27E/28E 净利一致预期）+ 财经媒体估值透支专题（ifeng/huxiu 已在库）
    - question: 寒武纪 88.66% 客户集中度 + 字节自研 SeedChip（2026目标35万颗）——最大客户自研化到底多快侵蚀订单？多客户放量摊薄跑得赢吗？
      source_hint: 产业链草根/供应链纪要（字节资本开支结构、寒武纪多客户进展、思元690节奏）
    - question: 海光"首选卡位"三支柱塌一根（吸并2025-12终止）后是否还成立？"类CUDA生态迁移易"是真护城河还是营销话术（实测迁移成本）？
      source_hint: 海光 DCU 实测迁移案例/开发者反馈 + 软整合方案细节 + DCU 出货斜率
    - question: H20 哑弹是否会因中美政策反复而逆转？国产份额 56%→90% 的斜率里，政策驱动 vs 市场驱动占比多大？
      source_hint: H20/B30 最新政策动态 + 央国企国产化采购≥75%执行细则 + TrendForce/大摩份额跟踪
    - question: 份额兑现≠利润兑现≠估值兑现——国产AI芯片会不会重演京东方(25%份额但仅2.7%利润率)？谁能真赚到钱？
      source_hint: 京东方/面板/存储国产替代复盘（mat-1d1f97 已继承）+ 三家毛利率/现金流质量对比

  l4_hunting:   # 狩猎层：逐 K# 对齐，找错误定价
    - question: arena 内谁是赔率-确定性最优卡位？海光(生态+体量) vs 寒武纪(纯芯片+推理) vs 华鲲振宇(昇腾整机)——三者同口径可比矩阵下的排序？
      addresses: [K1]
      search_keywords: [国产AI芯片 三门派对比, 寒武纪 海光 华鲲振宇 出货, 昇腾 shortlist 卡位]
      source_hint: 三门派/五强对比研报（mat 已在库）+ IDC 出货数据 + 各标的介入价位测算
    - question: 国产份额 56%→90% 兑现节奏——2026H2/2027 采购斜率能否顶住？H20 哑弹会否因政策反复逆转？
      addresses: [K2]
      search_keywords: [国产AI芯片 份额 2026, 昇腾 采购 斜率, H20 B30 政策 反复]
      source_hint: TrendForce/大摩份额跟踪（mat-af9f18/cec2d8）+ 政策执行细则 + 季度采购数据
    - question: 寒武纪最大客户字节自研 SeedChip 切换速度——2026-27 侵蚀寒武纪订单几成？多客户放量（思元690）摊薄够快吗？
      addresses: [K3]
      search_keywords: [字节 SeedChip 量产, 寒武纪 客户集中度, 思元690 多客户 放量]
      source_hint: 字节资本开支结构（mat-cb6e91）+ 寒武纪客户结构草根 + 思元690发布节奏
    - question: 芯片层合理入场时点——寒武纪/海光 26E/27E PE 回到多少可介入？高位泡沫的 kill signpost 是什么？
      addresses: [K4]
      search_keywords: [寒武纪 海光 估值 PE PS, AI芯片 估值透支, 科技股 减持 套现]
      source_hint: 卖方一致预期（26E/27E净利）+ 估值透支专题 + 减持/解禁时间表
    - question: 海光"首选卡位"存废——吸并终止后 DCU 放量斜率能否兑现？"类CUDA迁移易"是否经得起实测？
      addresses: [K5]
      search_keywords: [海光 DCU 出货 放量, 海光 类CUDA 迁移 成本, 海光 中科曙光 软整合]
      source_hint: 海光年报 DCU 收入拆分（Step5.5下载）+ 开发者迁移反馈 + 软整合方案
    - question: 上游产能天花板——中芯7nm可分配昇腾/寒武纪产能上限、长鑫HBM3进BOM时间表，能否顶住份额需求？
      addresses: [K6]
      search_keywords: [中芯 7nm 产能 昇腾, 长鑫 HBM3 量产 华为, 国产AI芯片 产能 饥饿]
      source_hint: 产能饥饿游戏研报（mat-ffc81b）+ 长鑫HBM3交付（mat 已在库）+ 中芯扩产指引

