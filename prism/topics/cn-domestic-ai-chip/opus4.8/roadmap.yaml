key_risks_to_monitor:
  - 字节 SeedChip 2026 量产进度（35万颗目标）与寒武纪订单切换速度
  - H20/B30 中美政策反复（解禁→再禁的博弈）
  - 中芯7nm/长鑫HBM3 产能爬坡是否卡住份额兑现
  - 海光吸并中科曙光软整合进展与标的形态重构
  - 高位估值下的减持/解禁套现信号（寒武纪/海光）

analogies_to_study:
  - name: 京东方/面板国产替代（中国 · 2010s-2020s）
    logic: 25%全球份额却仅2.7%利润率——"拿下份额≠赚到钱≠估值兑现"，周期+结构决定盈利
    limit: 面板是标准品价格战，AI芯片有生态壁垒+政策保护+高毛利，未必同样惨烈
    mirror_mat: mat-1d1f97  # 父级继承
  - name: 存储国产替代（长江存储/长鑫 · 2018-2024）
    logic: 技术追赶+国产替代逻辑相同，但盈利兑现滞后于份额多年
    limit: 存储更同质化、周期性更强；AI芯片需求刚性更高
