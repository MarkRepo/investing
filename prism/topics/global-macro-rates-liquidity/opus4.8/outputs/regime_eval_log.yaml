  - id: overall
    label: 综合判断
    state: 中美背离·美higher-for-longer×risk-on但脆弱/中宽货币紧信用（强度6/10·脆弱度高）
    causal: 美增长稳健+通胀粘+政策按兵+金融条件偏松+信用利差极窄=risk-on但缓冲薄；中宽货币紧信用、人民币企稳。组合偏防御、压久期、防美利率与carry尾部。
    based_on:
    - input: 联邦基金目标区间
      role: load_bearing
      expected: up_or_flat
    - input: 2Y/10Y/30Y 国债
      role: load_bearing
      expected: up_or_flat
    - input: HY OAS
      role: confirming
    - input: 金融条件指数 FCI(NFCI/GS)
      role: confirming
    - input: 社融 TSF
      role: confirming
    - input: USDCNY
      role: confirming
  - id: rates_us
    label: 美国利率体制
    state: 高位企稳·双向风险(市场押微幅加息vs点阵图仍含降息)·曲线低斜率正向·长端受期限溢价/发债支撑
    causal: 政策3.50-3.75按兵；FedWatch Dec隐含3.86押约一次加息，点阵图中位3.4仍含降息→预期差。10Y4.53、实际利率2.2%高位、2s10s+42bp低斜率正向。主席仍Powell(纠正v1
      Warsh误判)。
    based_on:
    - input: 联邦基金目标区间
      role: load_bearing
      expected: up_or_flat
    - input: CME FedWatch 隐含路径
      role: load_bearing
      expected: up_or_flat
    - input: 2Y/10Y/30Y 国债
      role: load_bearing
      expected: up_or_flat
    - input: 10Y 实际利率 TIPS
      role: load_bearing
      expected: up_or_flat
    - input: 核心 PCE
      role: load_bearing
      expected: up_or_flat
    - input: FOMC 点阵图(SEP)
      role: confirming
    - input: 美联储官员讲话(主席)
      role: confirming
    - input: 2s10s 曲线斜率
      role: confirming
  - id: rates_cn
    label: 中国利率体制
    state: 低位偏松·中性偏下·结构性工具为主
    causal: 10Y CGB~1.75%历史低位、DR007~1.42%资金面松、OMO7天1.40锚、LPR 3.0/3.5；货政报告定调适度宽松、短期更可能用结构性工具而非全面降准降息。
    based_on:
    - input: 中国 10Y CGB + 资产荒需求
      role: load_bearing
      expected: down_or_flat
    - input: DR007/R007
      role: load_bearing
      expected: down_or_flat
    - input: 7天 OMO 逆回购利率(新锚)
      role: confirming
    - input: LPR 5Y(房贷锚)
      role: confirming
    - input: 货币政策执行报告 MPR
      role: confirming
  - id: liquidity_us
    label: 美国流动性体制
    state: 金融条件偏松·信用利差历史极窄·资金面无压但临界(RRP耗尽)·风险偏好亢奋但脆弱
    causal: NFCI-0.51宽松区、SOFR-IORB-5bp无稀缺压、RRP归零、准备金3.01万亿临界；IG75/HY278历史极窄几乎不补偿违约。条件端松、缓冲薄=脆弱顺风后期。净流动性已按§5降权。
    based_on:
    - input: HY OAS
      role: load_bearing
      expected: down_or_flat
    - input: IG OAS
      role: load_bearing
      expected: down_or_flat
    - input: 金融条件指数 FCI(NFCI/GS)
      role: load_bearing
      expected: down_or_flat
    - input: SOFR−IORB / 回购压力
      role: load_bearing
      expected: flat
    - input: 净流动性(=资产−TGA−RRP)
      role: confirming
    - input: RRP 逆回购
      role: confirming
    - input: 美联储资产 WALCL(QT 节奏)
      role: confirming
  - id: liquidity_cn
    label: 中国流动性体制
    state: 宽货币×紧信用(有水鱼不出)·M1-M2边际改善
    causal: 央行→银行水足(DR007低、社融/M2合理)，但社融增速历史低位附近、贷款增速记录低、居民贷款萎缩→银行→实体堵住；M1-M2剪刀差负但收窄是边际改善。推绳子风险。
    based_on:
    - input: 社融 TSF
      role: load_bearing
      expected: up_or_flat
    - input: M1/M2/剪刀差
      role: load_bearing
      expected: up_or_flat
    - input: DR007/R007
      role: confirming
  - id: fx_cny
    label: 人民币汇率体制
    state: 企稳偏强·外资偏回流(硬度下降:北向净流入停发、仅海外主动基金+人民币企稳佐证)·中性偏友好(强广义美元120+深度负利差+日元carry160为悬顶)
    causal: USDCNY~6.77偏升、外资偏回流(海外主动基金转净流入);利差(-278bp)已降为压力表(§5#1)，真驱动是中间价/逆周期+管制+顺差。强广义美元(120)与日元carry(160)是外部张力，一旦广义美元再上台阶或carry平仓即反转。注:北向净买/卖方向自约2026-04-08停发,现仅余成交活跃度(非方向),方向性"脚投票"已失明、该结论硬度下降。
    based_on:
    - input: USDCNY
      role: load_bearing
      expected: down_or_flat
    - input: 北向资金
      role: confirming
      expected: any
      note: 口径已改＝成交额(活跃度,非方向);净流入停发,不再作方向性load_bearing,亦不按up_or_flat计分。
    - input: 广义/EM加权美元(Fed DTWEXBGS)
      role: confirming
    - input: 中美 10Y 利差
      role: confirming
    - input: PBoC 中间价 + 逆周期因子
      role: confirming
    - input: 外汇储备(水平+变动)
      role: background
