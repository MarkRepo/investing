key_risks_to_monitor:
  - Gen3量产延迟(6月静默信号)
  - 国产高端良率不达标(公开无定量)
  - 海外Rollvis/Schaeffler反扑+墨西哥本地化挤压
  - 技术路线替代(线性执行器→全旋转谐波/摆线,PRS单机用量下修)
  - 估值透支(五洲PE340x,业绩未兑现)

analogies_to_study:
  - name: "滚珠丝杠→行星滚柱丝杠技术替代段"
    logic: "同为精密传动件,PRS凭线接触/高承载/小型化正在人形场景替代滚珠丝杠;看替代发生时旧龙头如何应对、新进入者如何卡位"
    limit: "替代边界限于人形高负载关节,工业场景滚珠仍主流;替代节奏取决于量产成本曲线"
  - name: "绿的谐波打破日本Harmonic Drive垄断(国产替代成功镜鉴)"
    logic: "同为精密传动件国产替代,绿的谐波凭成本+规模化打破日企垄断,全球市占35%;看国产替代成功路径(认证周期/产能爬坡/价格战)"
    limit: "谐波减速器认证周期/客户结构不同于PRS;绿的已成熟,PRS尚处起步,可类比路径不可类比阶段"
  - name: "光伏/电动车零件国产替代后利润未兑现案例(利润池陷阱,arena-mirror·empty待补)"
    logic: "国产替代兑现但利润池被价格战/扩产反噬的案例(如光伏玻璃/锂电隔膜);警示PRS量产兑现后利润可能不兑现"
    limit: "需07专项深挖具体案例实证(当前empty)"
