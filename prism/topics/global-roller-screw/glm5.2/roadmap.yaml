# S2 简化：L1/L2 坍缩成 primer_scope 一行（背景深度交给 00_primer）
primer_scope: 行业边界=人形机器人线性执行器行星滚柱丝杠(PRS); 参与者=新剑传动/五洲新春/双林股份/恒而达/秦川机床/贝斯特(国产) + Rollvis/GSA/Schaeffler/Ewellix(海外); 市场规模=2030 PRS 229-450亿元; 发展阶段=量产前夜(Gen3 2026夏投产); 周期=技术S曲线早期→量产拐点

learning_track:
  l3_debates:
    - question: "国产高端PRS良率:突破在即(新剑/五洲/恒而达已审厂/量产) vs 仍停留样品/送样阶段(公开无定量良率)?"
      source_hint: "券商研报良率曲线 + 公司公告/互动易 + 专家访谈"
    - question: "Gen3量产时点:2026夏7-8月投产可信(产线已改造/Model S/X让路) vs 6月静默=有问题再延期?"
      source_hint: "特斯拉IR/财报电话会 + Counterpoint报告 + 产业链调研"
    - question: "估值:五洲新春PE340x/涨幅183%是国产替代确定性溢价 vs 业绩未兑现已透支泡沫?"
      source_hint: "卖方一致预期/目标价 + 历史估值区间 + 业绩兑现节奏"
    - question: "一级(新剑)vs二级(五洲)谁攫最厚利润:一级绑定+IPO产能天花板 vs 二级已审厂+98万套定增?"
      source_hint: "新剑招股书 + 五洲定增预案 + 价值量分配披露"
    - question: "海外反扑:Rollvis/Schaeffler扩产+墨西哥本地化挤压中国窗口 vs 中国一小时产业圈集群优势不可复制?"
      source_hint: "海外厂官网/年报 + 特斯拉墨西哥工厂进展 + Rollvis29%/GSA27%市占现状"

  l4_hunting:
    - question: "Gen3 2026 7-8月投产能否如期启动?爬坡合格率数据是否公开?2026Q4首条10万台级产线完成爬坡?"
      addresses: [K1]
      search_keywords: ["Optimus Gen3 投产", "爬坡合格率", "2026 量产"]
      source_hint: "特斯拉Q2财报电话会 + 产业链调研 + Counterpoint"
    - question: "新剑传动2026 IPO能否完成?招股书披露的实际产能/客户/单价能否验证一级绑定深度?"
      addresses: [K2]
      search_keywords: ["新剑传动 招股书", "IPO 进展", "产能 客户"]
      source_hint: "浙江证监局辅导公告 + 招股书(若已申报)"
    - question: "五洲新春98万套PRS定增达产进度+实际向特斯拉交付合格率/放量节奏?2026机器人收入占比能否跳升?"
      addresses: [K3]
      search_keywords: ["五洲新春 定增", "98万套 达产", "特斯拉 交付"]
      source_hint: "cninfo定增进度公告 + 年报机器人业务拆分"
    - question: "国产高端PRS良率/单根成本能否从样品降到规模化量产区间?螺纹磨床国产突破(长坂2亿→2000万)?"
      addresses: [K4]
      search_keywords: ["行星滚柱丝杠 良率", "单根成本", "螺纹磨床 国产"]
      source_hint: "券商深度研报良率曲线 + 设备厂公告 + 专家访谈"
    - question: "Rollvis/GSA/Schaeffler是否为人形需求扩产锁产能?特斯拉墨西哥工厂本地化是否挤压中国供应商份额?"
      addresses: [K5]
      search_keywords: ["Rollvis 扩产", "Schaeffler 人形", "墨西哥 本地化"]
      source_hint: "海外厂官网/年报 + 特斯拉墨西哥工厂 + Counterpoint供应链报告"

