key_risks_to_monitor:
- 新剑传动IPO进展/定价 → 上市公司群估值锚重定
- Tesla Optimus Gen-3量产节奏 + PRS用量是否变化
- 头部整机准直驱切换信号(赛道天花板风险)
- 各厂良率/产能爬坡 vs 承诺差
- 丝杠批价 → 是否进入谐波式价格战
analogies_to_study:
- name: 谐波减速器国产化 (中国·机器人零部件·2020-2026)
  logic: 同为人形机器人高价值精密件国产替代；绿的/来福从高毛利→价格战毛利走低
  limits: 谐波技术壁垒(柔轮)与PRS(磨床)不同；PRS海外磨床卡脖子更硬，价格战节奏或滞后
- name: 刀具/滚珠丝杠国产替代 (中国·机床件·2015-2023)
  logic: 同为精密传动件从进口替代到国产放量的降价路径
  limits: 机床需求周期性 vs 人形机器人成长期；PRS单价/壁垒更高
