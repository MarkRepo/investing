key_risks_to_monitor:
  - "比亚迪自研「天神之眼」在主力车型上替代 Momenta 方案——触发 kill"
  - "华为城市 NOA 市占率在 2026 年突破 30%——竞争格局从一家独大变双寡头"
  - "许可收入增速在 2026H2 降至 <30%——核心增长逻辑断裂"
  - "L3 法规落地延迟至 2028+——Robotaxi/L3 估值期权价值大幅缩水"
  - "Momenta 上市后首个财报季毛利率出现环比下滑——商业模式质变逻辑遭质疑"
analogies_to_study:
  - name: "Mobileye (以色列→Intel 收购→再 IPO，2014-2024)"
    logic: "第三方智驾方案商的完整生命周期：独立成长→被芯片巨头收购→再独立上市。验证「纯算法方案商能否长期独立存在」这一核心命题。Mobileye 最终靠 EyeQ 芯片实现软硬一体——Momenta 自研 BMC 7X 芯片是否是同一剧本？"
    limitation: "Mobileye 是视觉芯片+算法绑定，Momenta 是纯软件；Mobileye 的历程跨越 20 年+，Momenta 才 10 年"
  - name: "3dfx/ATI 被 NVIDIA/AMD 收购 (1990s-2000s)"
    logic: "软硬一体（NVIDIA）最终胜出 vs 纯软件（3dfx Glide API）或纯硬件（早期 ATI）被淘汰/收购。类比智驾行业「软硬一体才是终局」的争议——如果这个历史剧本在智驾重演，Momenta 纯软件路线将面临生存危机"
    limitation: "消费显卡市场竞争逻辑与汽车 Tier 1 供应链不完全可比——车企有分散供应商的动机"
  - name: "Argo AI (关闭) / Cruise (暂停运营) / Uber ATG (出售) — 自动驾驶烧钱→商业化不及预期"
    logic: "三家自动驾驶公司累计烧掉 >200 亿美元后关闭/暂停/出售。验证：(1) 纯 L4 路线（不靠量产反哺）的现金流不可持续；(2) 主机厂对自动驾驶投入的耐心有限。Momenta 的「量产反哺」正是针对这个失败剧本的对冲设计"
    limitation: "Momenta 不是纯 L4 公司——量产收入已占主导（许可+技术服务 >95%），历史失败案例可能不直接适用"
