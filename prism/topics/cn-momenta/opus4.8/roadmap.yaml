# roadmap.yaml — 研究路线图 (由 workflow 01 生成)
slug: cn-momenta
created: '2026-06-30'
variant: opus4.8
primer_scope: >
  L1/L2 坍缩为 primer scope，由 00_primer 全权承担：自动驾驶 L0-L5 分级与监管含义、端到端
  大模型架构相对模块化方案的差异、中国智驾产业链结构与三种模式（第三方方案商 / 车企自研 /
  华为全栈）、Momenta「一个飞轮两条腿」战略、收入模式拆解（软件授权 vs 技术开发，为何 70%+
  毛利）、客户即股东即潜在竞争者三重身份、智驾平权对单价/放量的双面影响、Robotaxi 单位经济
  构成、IPO 招股/基石/绿鞋/破发机制、评估方案商竞争地位的可观测信号。roadmap 集中 L3+L4。

learning_track:
  # L3 争议层：分歧在哪，各方逻辑（喂决策链环④多空 + 环②估值）
  l3_debates:
    - question: "纯软件方案商护城河争议：Momenta 纯算法路线 vs 华为/地平线软硬一体——价格战中纯软件 71.6% 高毛利能否持续，还是终被软硬一体 / 客户自研夹击？"
      addresses: [K1, K2]
      source_hint: 华为 ADS 技术路线 + 地平线征程 6 + 中金/中信软硬一体专题研报 + 招股书风险因素章节
    - question: "第三方方案商 TAM 收缩风险：比亚迪天神之眼、上汽零束、通用都在自研——「不自研的车企」TAM 在 2026-2028 是扩大还是缩小？两条腿走路缓冲是真是假？"
      addresses: [K2]
      source_hint: 东吴证券智驾平权梳理 + 各车企技术发布会/IR + 招股书客户集中度趋势 + 雷峰网天神之眼
    - question: "毛利率拐点 vs 周期高点：71.6% 毛利率是「卖算法」可持续常态，还是智驾平权（比亚迪 7.88 万智驾车）+ 客户压价下的周期高点？量增价跌能否撑住总收入高增长？"
      addresses: [K1]
      source_hint: 招股书 ASP/许可收入拆分 + 行业定价数据 + 智驾平权价格战追踪
    - question: "$9bn 估值定价合理性：Momenta ~90 亿美元 vs 地平线(09660) vs Pony/WRD——市占率溢价是否合理？不同商业模式（纯软件 vs 软硬一体 vs 纯 Robotaxi）应给不同 P/S 倍数吗？"
      addresses: [K3, K5]
      source_hint: 地平线 2025 年报 + Pony/WRD 20-F + 招股书估值对比 + 联席保荐人首覆（待上市后）
    - question: "Robotaxi 商业化节奏分歧：前装量产反哺（Momenta/Uber/享道）vs 专门 Robotaxi（Waymo/萝卜快跑）——谁更快实现正向单位经济？Momenta 轻资产模式是否真更低成本，还是仍纯烧钱期权？"
      addresses: [K4]
      source_hint: Waymo/萝卜快跑运营数据 + Uber-Momenta 慕尼黑 + 享道上海 Robotaxi 运营 + robotaxi cost-per-mile 分析

  # L4 狩猎层：哪里有错误定价（每条对齐一个 K#，附 search_keywords）
  l4_hunting:
    - question: "上市后首份财报（2026 中报/Q3）毛利率能否在智驾平权降价压力下守住 ≥65%？2025 许可收入 +180% 的隐含增速 2026H1 能否延续？市场隐含预期多少？"
      addresses: [K1]
      search_keywords: ["Momenta 毛利率 2026", "Momenta 许可收入 半年报", "06880 财务 业绩预测"]
      source_hint: 招股书管理层讨论章节 + 2026-08 首份半年报 + 卖方首覆财务模型
    - question: "前五大客户（占比 ~62%）2026-2027 是否出现实质订单削减或切自研？比亚迪天神之眼与 Momenta 是否在同车型并存，2026 新车型 Momenta 方案占比是升是降？"
      addresses: [K2]
      search_keywords: ["比亚迪 天神之眼 Momenta", "Momenta 客户 自研 切换", "智驾 供应商 定点 2026"]
      source_hint: 比亚迪新车配置表 + 懂车帝/汽车之家智驾方案标注 + 财经媒体深度报道
    - question: "第三方城市 NOA 市占率（中汽协口径）2026 能否守住 ≥50%？华为「超」是否进一步逼近、新玩家（元戎/卓驭）是否分流？华为 2026 新增哪些定点？"
      addresses: [K3]
      search_keywords: ["城市NOA 市占率 2026", "华为 ADS 定点 2026", "Momenta 华为 元戎 三强"]
      source_hint: 中汽协 2026H1 报告 + 灼识咨询更新 + 各车企定点公告
    - question: "Robotaxi/L4 第二条腿 2026-2027 是否出现可量化单位经济改善（cost-per-mile 下行 + 车队规模增长）？慕尼黑(Uber)/上海(享道)运营数据、单车日收入、是否产生收入贡献？"
      addresses: [K4]
      search_keywords: ["Uber Momenta 慕尼黑 Robotaxi", "享道 Momenta 上海 运营", "Robotaxi 单位经济 cost per mile"]
      source_hint: Uber 季度更新/Momenta 自愿公告 + 享道运营数据 + 萝卜快跑/Waymo 对标
    - question: "上市首日（2026-07-08）是否破发（参 WRD/Pony 破发）？IPO 认购倍数/灰盘溢价/基石锁定比例如何？$9bn 估值隐含增速与利润率，能否被后续 2-3 季度业绩支撑？"
      addresses: [K5]
      search_keywords: ["Momenta IPO 认购 倍数", "Momenta 暗盘 灰盘 溢价", "Momenta 首日 破发 上市"]
      source_hint: 招股结果公告 + 暗盘交易数据 + WRD/Pony 上市首日复盘镜鉴

