key_risks_to_monitor:
  - "比亚迪天神之眼在主力车型上替代 Momenta 方案——触发 K2 kill"
  - "华为城市 NOA 市占率 2026 进一步逼近、第三方份额跌破 50%——竞争格局恶化（K3）"
  - "上市后首财报季毛利率跌破 65%——软件授权「魔术」瓦解、估值逻辑受损（K1）"
  - "IPO 首日破发（参 WRD/Pony）——稀缺性溢价证伪、介入纪律收紧（K5）"
  - "L4/Robotaxi 仍纯烧钱无单位经济改善 + L3 国标落地延迟——远期期权价值缩水（K4）"

analogies_to_study:
  - name: "Mobileye（以色列→Intel 收购→再 IPO，2014-2024）"
    logic: "第三方智驾方案商完整生命周期：独立成长→被巨头收购→再独立上市。验证「纯算法方案商能否长期独立存在」。Mobileye 最终靠 EyeQ 芯片软硬一体——Momenta 自研 BMC 7X 是否同一剧本？"
    limitation: "Mobileye 是视觉芯片+算法绑定，Momenta 纯软件；Mobileye 历程 20 年+，Momenta 才 10 年"
  - name: "Argo AI（关闭）/ Cruise（暂停）/ Uber ATG（出售）——纯 L4 烧钱商业化不及预期"
    logic: "三家累计烧 >200 亿美元后关闭/暂停/出售。验证 (1) 纯 L4 路线现金流不可持续；(2) 主机厂对自动驾驶耐心有限。Momenta「量产反哺」正是对冲此失败剧本的设计"
    limitation: "Momenta 非纯 L4——量产收入已占主导（>95%），历史失败案例可能不直接适用"
  - name: "WeRide(WRD) / Pony.ai(PONY) 2024-2025 美股上市破发"
    logic: "同业 Robotaxi 优先标的上市首日/后续破发，提示市场对未盈利智驾标的耐心有限——直接镜鉴 Momenta K5 首日破发概率与 $9bn 估值可持续性"
    limitation: "WRD/Pony 是 Robotaxi 优先（烧钱主导），Momenta 是量产反哺（近盈亏平衡），质地不同；上市地（美股 vs 港股）流动性与基石结构亦不同"
