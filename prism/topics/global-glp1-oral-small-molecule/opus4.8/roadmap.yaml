  - 口服占新增 GLP-1 处方份额（放量斜率兑现/证伪 K1）
  - orforglipron TRx/收入斜率 vs 注射装机（K1）
  - aleniglipron/VK2735 口服 Phase 3 顶线读出时点与疗效%（K2）
  - VKTX/GPCR 并购动态与隐含估值（K2）
  - 口服小分子专利到期时点 + 首个 generic 申报（K3）
  - IRA/TrumpRx/PBM 对口服净价与覆盖的落地（K1）

# 历史类比 → arena-mirror 收料 todo（喂决策链环⑤）
analogies_to_study:
  - name: 丙肝 DAA 口服小分子（Gilead Sovaldi/Harvoni，2013–2018）
    logic: 口服小分子颠覆性疗法快速铺量、利润池急速做大，但专利到期+竞争(AbbVie/Merck)+付费方压价在数年内快速摧毁利润池
    limits: 丙肝是一次性治愈（存量耗竭），减重是慢病长期用药（存量可复用），摧毁节奏可能不同
    addresses: [K3]
    ring: arena-mirror
  - name: 他汀 vs PCSK9 疗效↔可及性分层（口服他汀统治 vs 注射 PCSK9 小众）
    logic: 口服(疗效够+可及性强)统治大众市场、注射(疗效更强但依从性差)退居小众——类比口服减重"疗效弱但铺量"能否成利润池主体
    limits: 他汀疗效与注射差距远小于口服减重 10.5% vs 20%+ 的落差，可及性优势能否补偿疗效落差存疑
    addresses: [K1, K2]
    ring: arena-mirror
  - name: DPP-4 / SGLT2 口服糖尿病小分子平权放量（西格列汀/达格列净）
    logic: 口服小分子在糖尿病的放量斜率 + 长期 generic 化后利润池演变，作为口服减重放量与 generic 节奏的镜鉴
    limits: 糖尿病口服疗效定位与减重不同，且未经历减重级别的需求爆发
    addresses: [K1, K3]
    ring: arena-mirror
