# L1/L2 坍缩为 primer scope 备注（背景理解交给 00_primer）
primer_scope: >
  primer 该覆盖：口服减重药三条技术路线（多肽口服=口服司美 vs 小分子=orforglipron/GSBR-1290/VK2735 口服）、
  口服 vs 注射的机理/疗效/可及性/成本差异、TAM 平权化逻辑（注射窄口→基层扩容）、
  口服玩家定位（LLY 规模领跑 / GPCR·VKTX 疗效领跑 / NVO 口服存量 / 恒瑞·华东国产小分子）、
  口服小分子的专利结构与 generic 悬崖机制（化学合成 vs 多肽生物类似药）。

learning_track:
  # L1/L2 略（见 primer_scope）
  l3_debates:         # 争议层：分歧在哪，各方逻辑
    - question: 口服"疗效弱"是否致命——orforglipron 10.5% vs 注射 20%+，口服是利润池迁移目标，还是仅"可及性补充入口"而利润仍留在高疗效注射剂？
      source_hint: LLY/GPCR/VKTX 10-K + 口服 vs 注射疗效对照 + 卖方对口服利润池的定性
    - question: "规模领跑 vs 疗效领跑分离能否持续——LLY 靠规模+可及性(orforglipron)统治，还是 GPCR/VKTX 疗效收敛后夺走高价值口服利润池？"
      source_hint: aleniglipron/VK2735 Phase 3 顶线 + 口服疗效收敛轨迹
    - question: 口服小分子 generic 悬崖是否比多肽更陡——小分子化学合成门槛低，专利到期后利润池会否被 generic 快速摧毁（比司美多肽生物类似药更凶）？
      source_hint: 口服小分子专利到期时点 + 化学 generic vs 生物类似药竞争速度对照 + 丙肝 DAA 镜鉴
    - question: 保险/PBM 已装机注射剂是否把口服放量斜率限制在慢坡——支付方偏好、formulary 卡位、净价压制是否让"平权化放量"斜率不及预期？
      source_hint: 美国 PBM/formulary 口服覆盖政策 + IRA/TrumpRx 净价路径
    - question: 口服"可及性平权"是否真兑现——绕开冷链/依从性/产能后，口服能否把 TAM 从注射窄口真扩到基层，还是被净价/支付/疗效落差堵住扩容？
      source_hint: 口服产能/成本 economics + 基层放量数据 + TAM 口径

  l4_hunting:         # 狩猎层：哪里有错误定价（逐条对齐 thesis K#）
    - question: orforglipron/口服 Wegovy 上市后首 12 月 TRx/收入斜率，是兑现"平权化放量"，还是被注射装机+保险偏好限制在慢坡？市场目前隐含的放量斜率是多少？
      addresses: [K1]
      search_keywords: [orforglipron 上市 处方, 口服 Wegovy 新处方份额, oral GLP-1 launch uptake]
      source_hint: LLY/NVO 季报口服口径 + IQVIA/处方追踪 + 卖方放量模型
    - question: GPCR aleniglipron / VKTX VK2735 口服 Phase 3 顶线读出时点与疗效，能否既"疗效强"又"可及"，成为独立高价值利润池，还是仅为 LLY 过贵时的替代入口？
      addresses: [K2]
      search_keywords: [aleniglipron Phase 3, VK2735 oral Phase 3, GSBR-1290 顶线]
      source_hint: GPCR/VKTX 10-Q 临床进度 + Phase 3 设计与读出时点 + 疗效收敛卖方评估
    - question: 疗效领跑者(GPCR/VKTX)最终是被 LLY/大厂并购(替代入口、期权兑现)还是独立商业化(独立利润池)？当前市场隐含的并购概率与估值是多少？
      addresses: [K2]
      search_keywords: [Viking 并购 收购, Structure Therapeutics acquisition, VKTX takeover target]
      source_hint: VKTX/GPCR 市值与现金 + 并购传闻/卖方 M&A 估值 + 大厂口服管线缺口
    - question: 口服小分子专利悬崖的时点与陡度——小分子化学 generic 上市速度是否远快于多肽生物类似药？利润池被摧毁的时间窗有多长？
      addresses: [K3]
      search_keywords: [orforglipron 专利到期, oral GLP-1 generic, 小分子 专利悬崖 减重]
      source_hint: orforglipron/GSBR-1290 专利结构 + 化学 generic vs 生物类似药竞争速度 + 丙肝/他汀镜鉴
    - question: 净价/支付(IRA 谈判、TrumpRx、PBM formulary)对口服放量斜率与利润率的限制有多大？口服是否因净价下压反而利润池更薄？
      addresses: [K1]
      search_keywords: [口服 GLP-1 保险覆盖, oral obesity PBM formulary, orforglipron 定价 净价]
      source_hint: 美国 PBM/formulary 政策 + IRA/TrumpRx 净价落地 + 口服现付价对照

