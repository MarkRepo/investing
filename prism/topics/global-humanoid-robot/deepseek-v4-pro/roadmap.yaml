key_risks_to_monitor:
  - "Tesla Optimus 量产时间表再次推迟（最核心风险，影响全行业）"
  - "具身智能进展不及预期——VLA 模型泛化能力不足以支撑商业场景"
  - "执行器技术路线突变——谐波减速器被滚柱丝杠或直驱方案替代"
  - "中国厂商供应链被海外客户排除（地缘政治风险外溢到人形机器人）"
  - "主题炒作退潮——估值回归导致持仓标的腰斩（2015/2021 机器人周期教训）"
  - "日本精密传动龙头扩产缓慢，上游供给瓶颈制约全球量产节奏"

analogies_to_study:
  - case: "中国新能源汽车 2014-2018"
    logic: "同样经历政策驱动→技术突破→供应链从0到1→Tesla催化→估值泡沫→回归基本面。人形机器人当前更像 2015-2016 年的电动车——方向确定但技术路线未收敛"
    limitation: "电动车是存量替代（替代燃油车），人形机器人是纯增量市场，需求不确定性更大。电动车有里程/成本等硬指标可追踪，人形机器人商业化的评判标准更模糊"
  - case: "中国工业机器人 2015-2019（机器人十三五规划→国产替代→估值泡沫→出清）"
    logic: "类似的政策驱动+国产替代叙事。2015-2017 绿的谐波/埃斯顿/机器人 PE 达 100x+，2018-2019 产能过剩+需求下滑后跌 60-80%。关注历史上'机器人概念股'的估值回归节奏"
    limitation: "工业机器人需求来自制造业自动化（确定性强），人形机器人需求来自AI泛化能力（确定性强弱取决于技术进展）"
  - case: "全球协作机器人 2019-2022（Universal Robots 估值泡沫→增长远低于预期）"
    logic: "同样以'下一代机器人'叙事被热捧。Teradyne 2015 年 $285M 收购 UR，2022 年 UR 收入仅 $300M 级别——远低于当初预测的 CAGR 50%+ 曲线。警告：机器人叙事容易高估渗透速度"
    limitation: "协作机器人本质是工业机械臂的简化版，应用场景有限；人形机器人的泛化潜力更大，但不确定性也更大"