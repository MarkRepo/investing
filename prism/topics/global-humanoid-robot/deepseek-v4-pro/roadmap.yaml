slug: global-humanoid-robot
created: 2026-05-17
learning_track:
  l1_orientation:
    - question: "人形机器人行业边界在哪？产业链如何划分（上游零部件→中游整机→下游应用场景）？各环节价值占比？"
      source_hint: "Goldman Sachs 行业框架报告、产业链图谱"
    - question: "全球主要玩家有哪些？Tesla Optimus、Figure AI、宇树、优必选、傅利叶各自的定位、进展和差异化？"
      source_hint: "各公司官网/发布会、卖方竞争格局分析"
    - question: "市场规模多大（当前出货量、2030E/2035E 预测范围）？主要增长驱动力是什么？"
      source_hint: "Goldman Sachs 2025-2026 系列、GGII 数据"
    - question: "核心零部件（执行器、传感器、灵巧手、AI芯片）各自的技术壁垒和毛利率水平？哪个环节最受益？"
      source_hint: "产业链调研报告、核心供应商年报"

  l2_history:
    - question: "人形机器人经历了哪几个技术代际？从 Asimo→Atlas→Optimus 的演进逻辑是什么？"
      source_hint: "行业史文章、学术综述"
    - question: "为什么是现在（2024-2026）？关键使能技术（大模型/AI、精密传动、电池能量密度、力传感器）何时达到临界点？"
      source_hint: "技术路线图、特斯拉 AI Day 材料"
    - question: "历史上几轮机器人投资热潮（2015 工业 4.0、2017-2018 AI、2021 协作机器人）如何兴起和退潮？有什么教训？"
      source_hint: "历史研报复盘、相关标的股价走势"
    - question: "2022-2026 年产业化进程中的关键催化剂事件（Tesla AI Day、Optimus Gen1/2/3、Figure AI 融资、宇树量产公告）？"
      source_hint: "新闻时间线整理"

  l3_debates:
    - question: "特斯拉能否兑现 Optimus 大规模量产时间表？市场对 2026-2027 年出货量的预期是否过于乐观？"
      source_hint: "Tesla 10-K/股东会、供应链跟踪数据"
    - question: "中国厂商能不能跑出来？宇树/优必选/傅利叶是跟随者还是差异化竞争者？谁最可能拿到大客户订单？"
      source_hint: "中国厂商官网、融资信息、客户公告"
    - question: "执行器技术路线之争：谐波减速器 vs 行星滚柱丝杠 vs 连杆直驱——哪个方案会赢？哪些公司会被颠覆？"
      source_hint: "技术对比分析报告、核心零部件公司年报"
    - question: "具身智能（Embodied AI）是即将突破还是远未成熟？VLA/VLM 模型在实际场景中的泛化能力到什么程度了？"
      source_hint: "AI 论文（RT-2, Octo, π0）、Figure AI/特斯拉技术博客"
    - question: "当前相关标的估值（绿的谐波 PE 100x+、鸣志电器 PE 80x+）是否已透支未来 3-5 年的增长？历史上机器人主题估值泡沫如何收场？"
      source_hint: "各公司年报+估值对比、历史泡沫案例"

  l4_hunting:
    - question: "如果市场对 Tesla Optimus 供应链概念股高估了实际业绩贡献（多数公司人形机器人收入占比 <5%），哪些标的跌得最多？"
      source_hint: "各公司收入拆分、供应链实际订单量"
    - question: "反向思考：有没有被市场忽视的受益环节？（如测试设备、精密加工、热管理——人形机器人对精度和散热的要求可能远超汽车）"
      source_hint: "产业链盲点分析、非主流供应商调研"
    - question: "日本精密传动龙头（Harmonic Drive、Nabtesco、THK）是否被低估？中国谐波减速器厂商在精度和寿命上是否真的追上了？"
      source_hint: "日股年报、技术指标对比、下游客户调研"
    - question: "什么催化剂会迫使市场大幅修正商业化时间预期？最早什么时候能验证或证伪？"
      source_hint: "关键节点日历（Tesla 发布会、Figure AI 融资、宇树出货数据）"

