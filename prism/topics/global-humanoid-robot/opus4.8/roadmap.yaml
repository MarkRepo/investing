key_risks_to_monitor:
  - Tesla 垂直整合执行器 → 供应链有定点无放量
  - A 股估值继续证伪消化 → 基本面改善不反映股价
  - 中国整机低价内卷 → 供应链被压价"有量无利"
  - 量产仍千台级 → 人形收入占比长期 <5% 期权定价破灭

analogies_to_study:    # → 落成 industry-mirror 收料 todo（环⑤）
  - case: 中国光伏 2010s（叙事先行、产能过剩、利润被压）
    logic: 政策强推 + 国产替代 + 高估值，最终产能过剩利润崩
    limit: 人形仍在需求创造期，非过剩期
  - case: 协作机器人/服务机器人 2015-2020（cobot 泡沫）
    logic: 机器替人叙事先行，商业化兑现远慢于预期，估值回调
    limit: 大模型/VLA 是本轮新变量，具身智能可行性更高
  - case: 无人驾驶 2018-2022（Robotaxi 叙事 vs 兑现滞后）
    logic: L4 时间表反复跳票，烧钱长、兑现晚，估值大幅回调
    limit: 人形工业场景比开放道路更结构化，落地可能更快
