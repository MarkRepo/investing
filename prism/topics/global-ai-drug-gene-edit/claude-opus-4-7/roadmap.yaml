key_risks_to_monitor:
  - "in vivo 基因编辑 2026-2027 出现 ≥2 起严重安全性事件（脱靶/免疫原性导致死亡或永久损伤），整个路线被监管冰封"
  - "Casgevy 2026 全年治疗人数仍 <500，市场重新定义 ex vivo 基因编辑 TAM 为『罕见病小众市场』"
  - "AI 制药管线 2026-2027 集体临床失败（Recursion + Isomorphic + Schrödinger 任 2 家有 Phase 2 失败），范式革命论破产"
  - "传统 CRO（药明康德/康龙化成）用低价 AI 工具吃掉 Schrödinger / 晶泰的 software licensing 业务"
  - "中美科技脱钩升级 → 中国 AI 制药公司无法访问 AlphaFold 3 / OpenAI API / NVIDIA H100，技术能力被锁在 2 代之前"
  - "NMPA 对基因编辑疗法定价指导上限 <50万 → 中概基因编辑公司商业化模型彻底破产"

analogies_to_study:
  - case: "2017-2019 CAR-T 浪潮（Kite-Gilead $11.9B / Juno-Celgene $9B / Bluebird Zynteglo $1.8M 定价）"
    why_alike: "同样是『一次性 cure』+ 治疗中心受限 + 高定价（$220万 Casgevy ≈ $475k Yescarta + 治疗复杂度）；早期商业化爬坡极慢，最终市场重估 TAM"
    why_different: "CAR-T 主要做血液瘤，市场天花板较低；基因编辑潜在适应症更广（遗传病 + 心血管 + 代谢），如果 in vivo 突破，TAM 量级差 1-2 个 zero"
  - case: "2020-2022 mRNA 浪潮（Moderna 估值 10x → 收缩 60%；BioNTech 类似轨迹）"
    why_alike: "技术革命 narrative + 大药企合作背书 → 估值预期超调；最终被 commercial reality 校准"
    why_different: "mRNA 有 COVID 疫苗这个超预期 killer app；AI 制药目前没有同等量级『杀手应用』，估值修复更慢更难"
  - case: "1990s-2000s 单克隆抗体革命（Genentech IPO 1980 → 2009 Roche 收购 $46.8B）"
    why_alike: "技术从早期质疑到 dominant therapeutic modality 用了 20 年；前 10 年估值反复，后 10 年指数级放量"
    why_different: "单抗的工程化成熟度 1990s 已较高，基因编辑/AI 制药的工程化（脱靶率、临床转化率）仍在攻坚"
