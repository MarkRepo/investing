key_risks_to_monitor:
  - 中美关系恶化导致 SEC 加强 PCAOB 审计 → FUTU 退市风险（极小概率但需监控）
  - HKMA 收紧加密牌照（如 2026 VATP 整改）
  - 富途自身合规事件（反洗钱罚款 / 数据泄露）
  - 港币联系汇率制度异变（影响利息收入计价）
  - 腾讯 / 经纬创投等股东减持（FUTU 大股东历史多次大宗减持）

analogies_to_study:
  - case: Robinhood 2021 IPO → 2022 崩盘 → 2024 重生
    similarity: 都是新一代互联网券商 + 加密敞口 + 经纪佣金压缩压力 + 利率高敏感
    difference: HOOD 0 佣金 vs FUTU take rate ~5bp；HOOD 用户更年轻散户 vs FUTU 高净值；HOOD 美国本土 vs FUTU 跨境
  - case: 老虎证券 TIGR 2022-2025 监管冲击 + 海外扩张
    similarity: 同样的中资跨境券商 + 2022 CSRC 新规冲击 + 同样向新加坡/新西兰扩张
    difference: TIGR 体量 1/5 FUTU；TIGR 加密牌照进度落后
  - case: 嘉信理财 SCHW 2023 SVB 风波 + 利率敏感性危机
    similarity: 经纪商利率敏感性 + 客户存款迁移 cash sorting 问题
    difference: SCHW 美国本土 + 银行牌照 + 体量大 5-10×；FUTU 无银行牌照 + 客户存款主要在 HKD/USD
  - case: Coinbase COIN 2021-2024 周期
    similarity: 加密收入波动给二级市场估值的影响
    difference: COIN 纯加密 vs FUTU 加密只是边缘业务

