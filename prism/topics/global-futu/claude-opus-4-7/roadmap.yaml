      addresses: [K3]
      kill_trigger: 任一月 ADV <1500 亿 → bear；≥2500 亿 → bull
    - id: L4-K4
      question: 美联储 2026-2027 累计降息路径（鲍威尔 dot plot + 联邦基金期货）——对 FUTU NIM 的量化冲击
      addresses: [K4]
      kill_trigger: 12 月期货隐含 2026 降息 ≥125bp → bear 触发
    - id: L4-K5
      question: 2026 CSRC/CAC/HKMA 跨境券商新规风险地图——哪些政策动作可能触发 super-bear
      addresses: [K5]
      kill_trigger: 任一新规明文限制大陆居民使用境外券商 → super-bear，清仓多仓 + 加仓空仓
    - id: L4-K6
      question: CSRC 5-22 罚款的执行进度 + "2 年单向整治期"对存量大陆客户业务的实际边界——Q2 业绩会管理层披露的业务隔离方案 / 罚没款现金流影响 / 是否还有后续监管动作
      addresses: [K6]
      kill_trigger: 罚款扩展到存量客户清退 / 二次处罚 → super-bear；管理层明确 "存量不动 + 罚款一次性" → bear → neutral
    - id: L4-K7
      question: Airstar Bank 第二估值锚 — 持牌数字银行的估值水平（市净率 / 市值 / 存款规模）+ FUTU 51% 控股的并表 / SOTP 处理方式 + 2026 业务进展（贷款规模 / 客户数 / 牌照扩张）
      addresses: [K7]
      kill_trigger: Airstar 估值贡献 <每股 5 HKD → 第二锚证伪，回到纯券商估值；≥每股 15 HKD → bull 强化
    - id: L4-K8
      question: FUTU vs TIGR / IBKR / HOOD / SCHW 2026 Q1 业绩横向对标 — 付费客户净增 / ARPU / NIM / 美股零售活跃度的同业方向是否一致，区分 FUTU 个体问题 vs 行业 beta
      addresses: [K8]
      kill_trigger: 同业 Q1 净增同向下滑（行业 beta）→ FUTU 估值折价缩小；仅 FUTU 单边走弱（个体 alpha 反转）→ bear 强化

