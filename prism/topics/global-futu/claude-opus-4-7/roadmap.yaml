    - id: L4-K2
      question: 2026 全年加密交易收入占总收入比例预测 — 看卖方分歧（多方 5-8%，空方 2-4%），实际兑现路径
      addresses: [K2]
      kill_trigger: H1 实际 <3% → 看空；≥5% → bull 修正
