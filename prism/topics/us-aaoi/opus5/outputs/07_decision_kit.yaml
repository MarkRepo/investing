honest_gaps:
  - ring: 1
    kind: data-missing
    priority: P0
    note: >-
      分段毛利率（CATV 硬件 vs datacom 模块）从未披露——**v2 新增且为全案最要紧的缺口**。命门 M1「代工位」
      的唯一定量核心是「AAOI 27.72% vs 旭创 46.59%」，但 AAOI 含 53.8% CATV 硬件而旭创是纯 datacom，
      苹果比橘子；18.9pp 差额里有多少来自代工位、多少来自业务混合无法拆开。已攻两轮（04 收料 + 05 critic 补料）
      仍不存在，非收料覆盖度问题。**M1 置信度已因此从中高下调到中，且在此数拿到前不得回升。** 替代承重路径
      已建立（同一家公司九年纵向分部序列），并踢 07-drilldown（P0）
