analogies_to_study:
  - case: "2015-2018 锂价周期（赣锋上一轮转型）"
    similarity: "周期底部回弹 + 公司从锂盐扩张到锂电池中游；估值底 + 业务转型双重 catalyst"
    divergence: "上轮是新能源车爆发驱动需求，本轮是 eVTOL/低空 + 储能驱动；上轮无半固态期权"
  - case: "比亚迪刀片电池 2018-2020 量产前两年"
    similarity: "narrative shift（铁锂 → 刀片）类似赣锋 narrative shift（液态 → 半固态）+ 单一龙头客户绑定（比亚迪自用 vs 赣锋绑沃飞）"
    divergence: "比亚迪是垂直一体化自用，赣锋是 to-B 卖电池给 eVTOL；客户集中度风险方向相反"
  - case: "宁德时代钠离子电池 2021-2024 估值期权曲线"
    similarity: "市场对未量产新技术的期权定价 → 多次高潮 + 多次冷却；赣锋半固态 narrative 大概率复刻类似估值波动"
    divergence: "钠电池 BOM 成本压力来自原材料，半固态压力主要来自硫化物固态电解质良率；驱动逻辑不同"
