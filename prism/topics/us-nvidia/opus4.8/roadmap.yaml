key_risks_to_monitor:
  - 超大厂 AI capex 拐点（K1，最致命，需求侧不可控）
  - 定制 ASIC 在推理放量期加速抢份额、压制毛利（K2/K3）
  - 中国市场双向夹击持续流失（K5）
  - forward PE 是"分母虚高"陷阱而非便宜（K6/命门3）

analogies_to_study:
  - name: 思科 (Cisco) 2000 互联网泡沫顶（美国/网络设备/1999-2002）
    logic: 同为某轮技术革命(互联网↔AI)的"卖铲人"龙头、高增速高估值、被视为不可撼动；泡沫顶后收入增速骤降、股价长期不回前高
    limits: 思科当年 forward PE 100x+ 且客户是杠杆电信商(资金易断)；NVDA 现 22x 且客户是现金充裕超大厂——估值起点与客户质地差异巨大。是否真类比取决于 capex 可持续性
    covered_by: [mat-c138a5, mat-cfcbc6, mat-f3c93c]
  - name: NVDA 自身 2018 挖矿周期崩盘（美国/GPU/2018-2019）
    logic: 需求端(加密挖矿)突然蒸发致库存积压、毛利与股价腰斩——警示"需求集中于单一狂热用途"的脆弱性(今日=AI capex 集中于少数超大厂)
    limits: 挖矿是投机性需求、规模远小于今日 AI capex；AI 需求有真实生产力应用支撑(但 ROI 待证)。镜鉴价值在"需求断点如何传导到财务"的机理
    covered_by: []  # 训练知识粗述，实证镜鉴待 07 深挖时补
