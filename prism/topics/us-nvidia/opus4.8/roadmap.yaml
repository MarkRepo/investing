primer_scope: >
  primer 该覆盖：AI 数据中心 GPU 为什么是训练/推理的基础设施 / CUDA 软件生态如何形成开发者锁定护城河 /
  rack-scale 系统(GB200 NVL72)"卖整柜而非单卡"的商业逻辑与价值抬升 / 通用 GPU vs 定制 ASIC(TPU/Trainium)
  的适用场景与性价比差异 / HBM·CoWoS 先进封装为何是全行业供给瓶颈 / NVDA 财年(1月末结束)与自然年口径差异 /
  AI capex 周期驱动逻辑与"泡沫/见顶"担忧从何而来 / 对华出口管制(H20/许可证/15%分成)机制 /
  高毛利(75%)生意为何天然吸引竞争与客户自研(均值回归压力) / 观察 NVDA 该盯的可观测信号。

