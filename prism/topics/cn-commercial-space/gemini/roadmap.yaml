l1_orientation:
  - question: "中国商业航天的产业链边界在哪里？火箭发射与卫星制造的价值分配机制是什么？"
  - question: "当前市场的主要参与者（国家队 vs 民营航天）如何分工与竞合？"
  - question: "受『千帆星座』、『GW星座』等低轨宽带互联网星座计划驱动，市场规模潜力有多大？"
  - question: "目前行业的瓶颈是在发射产能、发射成本，还是卫星制造产能？"

l2_history:
  - question: "从 2014 年政策破冰至今，中国商业航天经历了哪些关键的发展阶段与融资热潮？"
  - question: "SpaceX 的发展路径（从猎鹰 1 号到星舰）对中国民营航天有哪些借鉴意义和误导？"
  - question: "过去几年中，哪些技术突破（如液氧甲烷发动机、海上发射）或政策拐点实质性地改变了行业进程？"

l3_controversy:
  - question: "液氧甲烷路线与液氧煤油路线，哪一个更适合中国商业航天实现可重复使用的降本目标？"
  - question: "市场共识认为『产能为王』，但如果低轨星座需求被证伪或推迟，谁的抗风险能力最差？"
  - question: "『国家队』（如航天科技、航天科工）是否会对民营企业形成降维打击，挤压其生存空间？"
  - question: "卫星互联网的商业闭环（2C 手机直连、2B 行业应用）在中国市场是否真的跑得通？"

l4_hunting:
  - question: "如果目前对于发射成本下降曲线的预期过于乐观，哪些火箭制造企业的估值存在泡沫？"
  - question: "哪些上游元器件（如 T/R 组件、星载计算机、姿轨控系统）或材料供应商，能享受到高于整箭/整星制造商的确定性溢价？"
  - question: "观察文昌商业航天发射场 1、2 号工位及后续工位的排期与实际发射成功率，什么样的数据偏离能作为行业加速或低于预期的左侧信号？"
  - question: "如果星舰（Starship）全面成熟并极大拉低全球发射均价，中国商业航天的防御壁垒在哪里？"

materials:
  tier1:
    - title_direction: "商业航天/卫星互联网行业深度报告"
      type: "卖方研报"
      source: "国内头部券商军工/通信组（如中信、国泰君安、华创）"
      reason: "提供最基础的产业链图谱、市场规模测算逻辑及国家队与民营公司的全景对比。"
    - title_direction: "国家及地方关于低轨星座（千帆、GW）及商业航天发射场的规划文件"
      type: "政策文件"
      source: "发改委、工信部、海南省/上海市政府官网"
      reason: "国内航天属于强政策驱动，发射排期和补贴政策直接决定了行业景气度和企业的生死存亡。"
    - title_direction: "头部上市及拟上市公司（如长光卫星、星际荣耀等）招股书或财务报告"
      type: "财务报告"
      source: "交易所/证监会"
      reason: "透视真实的成本结构、毛利率水平及现金流消耗速度，验证商业模式是否跑通。"

  tier2:
    - title_direction: "SpaceX 发展史及财务模型测算"
      type: "海外研报/深度分析"
      source: "Morgan Stanley 等海外投行或行业媒体"
      reason: "作为绝对的行业标杆，其成本下降曲线和盈利模型是衡量国内企业天花板的重要参考。"
    - title_direction: "火箭发动机、卫星通信载荷的技术路线对比分析"
      type: "学术/行业报告"
      source: "《宇航学报》等期刊或垂直自媒体"
      reason: "帮助判断不同技术路线（如固/液推进、相控阵天线）的商业化成熟度及技术壁垒。"

  tier3:
    - title_direction: "海外卫星互联网运营（如 Starlink、OneWeb）的用户数据及 ARPU 分析"
      type: "行业数据"
      source: "咨询机构/财报"
      reason: "用于终局推演：当卫星放上去之后，究竟靠什么赚钱，市场空间到底有多大。"

analogies:
  - name: "中国新能源汽车产业（2014-2020）"
    logic: "早期依赖强政策补贴驱动，随后通过规模效应和供应链本土化实现成本大幅下降，最终跑出全球竞争力的巨头。"
    limitation: "新能源汽车是典型的 2C 消费品，市场空间巨大且决策分散；而航天目前主要是 2G/2B 市场，且具有极强的国家安全属性，准入门槛更高。"
  - name: "美国商业航天（SpaceX 崛起期）"
    logic: "通过 NASA 订单兜底（COTS 计划）扶持民营企业，打破传统军工巨头垄断，倒逼技术创新与降本。"
    limitation: "中国缺乏类似 NASA 这样极其成熟且极具魄力的'超级甲方'，军民融合的体制差异导致技术溢出和订单转移的路径不同。"
