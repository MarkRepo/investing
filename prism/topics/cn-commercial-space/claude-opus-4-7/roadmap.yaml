thesis_summary: "2026 中国商业航天处于「政策/产能/IPO 三重共振 vs 业绩兑现+技术回收双重滞后」的 alpha-与-陷阱并存期；强度 5/10；最大未定价空头：千帆星座 ITU 频段缺口 83%"

learning_track:

  # L1 定向层：是什么，多大，谁玩
  l1_orientation:
    - question: "中国商业航天产业链分哪几层（上游元器件/中游卫星+火箭制造/下游发射+运营+应用），每层 A 股可投标的+一级市场龙头分别是谁"
      source_hint: "中信建投/中航证券商业航天产业链深度研报"
    - question: "千帆星座（垣信卫星）+ GW 国网（中国星网）两大星座的运营主体、规划目标（千帆 12000+/GW 12992）、当前实际进度（2025-12 千帆 108 颗 / GW 136 颗）和差异是什么"
      source_hint: "新华网+SpaceMapper.cn+垣信/中国星网官网"
    - question: "中国商业航天 2025 市场规模 2.3 万亿 / 2030 目标 8 万亿 的拆分（火箭发射服务/卫星制造/地面段/数据应用各占多少）"
      source_hint: "国家航天局白皮书+艾瑞咨询行业报告"
    - question: "海南商发+酒泉+太原+西昌+东方港 5 大发射场 2026 设计年发射能力 vs 实际利用率（2025 全国 92 次 / 2026 目标 100+ 次），哪个是瓶颈环节"
      source_hint: "新华社海南分社+各发射场官网+CNSA 公告"

  # L2 历史层：怎么来的，周期节奏
  l2_history:
    - question: "中国商业航天 2014 政策开闸至今 4 个阶段（导入 2014-2018 / 资本热 2018-2021 / 技术攻关 2021-2024 / 量产元年 2025+）各自市场表现和事件特征"
      source_hint: "中信建投/华泰证券回顾性深度+知乎商业航天系列长文"
    - question: "5 次主题驱动事件对 A 股商业航天板块估值的影响周期（2023-08 Mate 60 / 2024-Q3 千帆首发 / 2025-12 朱雀三号入轨 / 2026 电科蓝天 IPO / 2026-04 天龙三号失利）"
      source_hint: "Wind 板块指数 + 同花顺概念股复盘"
    - question: "SpaceX 2014-2020 类比：Falcon 9 复用 2015-12 首次成功 → 2017 商业常态 → 2020 Starlink 大规模组网，星座建设到收入兑现间的时滞规律"
      source_hint: "SpaceNews 历史档案 + 华尔街见闻 SpaceX 系列报道"

  # L3 争议层：分歧在哪，各方逻辑
  l3_debates:
    - question: "千帆 ITU 频段保留风险是否被市场充分定价：2025 底实际 108 颗 vs 规划 648 颗，缺口 83% —— 看多方说『政策会修正/分阶段提交/ITU 实践宽松』，看空方说『频段实质性损失 → 一期估值崩』"
      source_hint: "ITU 网站频谱保留实践 + 千帆官方+境外卫通行业评论（SpaceNews/Via Satellite）"
    - question: "A 股商业航天标的业绩 vs 估值剪刀差：6 家 2025 业绩 5 家差（中国卫星净利率 0.58% / 海格亏 7.86 亿 / 上海瀚讯亏 1.22 亿 / 国博营收 -7.92% / 航天电器净利 -47% / 铖昌已 ST），市场仍给主题溢价 —— 业绩拐点 H2 兑现 vs 主题股估值二次下杀"
      source_hint: "中航证券军工组 / 民生证券军工组 季度跟踪报告"
    - question: "可回收火箭技术路线之争：液氧甲烷（蓝箭朱雀/星河智神星/星际双曲线）vs 液氧煤油（天兵天龙/中科力箭二号）vs 国家队长征系列，2026-2027 谁先实现复用决定产业链定价"
      source_hint: "航天专家访谈（钱学森空间技术实验室专家公众号）+ 21 世纪经济报道技术深度"
    - question: "千帆/GW 卫星采购份额分配：到底分给民营卫星制造商（银河航天/格思航天/时空道宇/微纳星空）多少，国家队（中国卫星）是否被边缘化"
      source_hint: "上交所采购公告+垣信/中国星网官方招标信息+一级市场圈内访谈"
    - question: "下游应用商业化时点之争：手机直连（华为 Mate 60 → 后续放量主体？）vs 海事终端 vs 应急通信 vs 太空算力，哪个先放量给地面段（华力创通/上海瀚讯/海格）的拐点"
      source_hint: "中国卫通公告+三大运营商财报卫星业务披露+艾瑞行业拐点报告"

