key_risks_to_monitor:
  - "千帆星座 ITU 频段保留 2027 deadline 倒计时（每季度发射节奏 vs ITU 25%/50%/100% 时间表）"
  - "可回收火箭连续失败（朱雀三号 Q2 / 长征十号 04-28 / 天龙三号归零后再飞）— 任何一家二次失败都会重定整个板块"
  - "电科蓝天 IPO 后股价/成交量持续下跌 → 板块情绪锚崩"
  - "中美关系恶化 → T/R 芯片国产化进程逆转 / SpaceX 标杆压力骤增"
  - "蓝箭航天 IPO 流产或推迟 → 民营火箭一级市场估值踩踏"

analogies_to_study:
  - case: "SpaceX 2014-2020：Falcon 9 复用 2015-12 → 2017 商业常态 → 2020 Starlink 组网放量"
    similar: "可回收 → 成本下降 → 星座组网 → 商业兑现 5-7 年完整周期；中国民营 2025-12 朱雀三号入轨+回收失败 ≈ SpaceX 2015 起点"
    different: "中国不是 Musk 单点决策（国家队+民营并行 + 资本市场科创板 vs 私募轮）；中国民营融资环境对回收试错容忍度更低"
  - case: "2023-2024 中国新能源车板块业绩股 vs 主题股剪刀差"
    similar: "业绩股先反弹（宁德/比亚迪）、主题股二次下杀（多家 ST）的相同分化路径；当前商业航天板块业绩股=航天电器/铖昌/中国卫星，主题股=部分纯概念股"
    different: "新能源车下游 C 端需求已成熟，商业航天 C 端（手机直连/海事终端）规模远小于车；不可线性外推估值"
  - case: "1998-2002 美国 Globalstar / Iridium / OneWeb 等早期卫星运营商热潮 → 破产 / 重整"
    similar: "星座建设成本远高于运营收入兑现速度 → 估值预期与现金流脱钩"
    different: "SpaceX 已证明星链可商业化（2025 营收 $80 亿+），下游需求侧今天已不可同日而语；中国千帆/GW 国资背书风险敞口比当年小很多"
