    - question: "2026-09 千帆星座在轨累计能否突破 250 颗？月度发射节奏（需要每月 ≥18 颗）。<200 颗 → ITU 风险被市场定价板块杀；≥300 颗 → 反方 1 暂时被推翻"
      addresses: [K2]
      source_hint: "SpaceMapper.cn 月度数据 + 长征八号系列发射通告（CNSA + 中国航天报）"
    - question: "2026-04-28 长征十号海上回收验证是否成功？央企可回收一旦成功改写竞争格局，国家队估值上修"
      addresses: [K3]
      source_hint: "CNSA 官方 + 央视新闻 + 航天科技集团公告"
    - question: "2026 年内第二家民营火箭企业是否完成入轨级回收尝试（星河智神星一号 / 天兵天龙三号 T2 / 星际荣耀双曲线三号 / 中科宇航力箭二号）？0 家 → 行业 -1；≥1 家 → +2"
      addresses: [K4]
      source_hint: "各民营火箭官网+微信公众号+界面新闻硬科技头条"
    - question: "2026 H1 半年报主流 A 股标的（航天电器/铖昌/中国卫星/国博/海格/上海瀚讯）商业航天业务收入 yoy 是否 >100%？同时跟订单转收入时滞、毛利率走势、订单结构。<50% → 反方 2 加重 H2 主题股二次崩；>150% → 业绩兑现确认"
      addresses: [K5]
      source_hint: "巨潮资讯+各公司 IR 网站+卖方业绩点评+wind 板块业绩跟踪"
    - question: "蓝箭航天 IPO 2026 内是否完成？发行 PE 与电科蓝天估值锚（首日 +750%）的关系。完成且发行 PE >120x → 板块情绪重燃；流产 → 系统性下杀"
      addresses: [K6]
      source_hint: "上交所科创板审核进度 + 蓝箭官方 + 21 世纪经济报道 IPO 跟踪"

