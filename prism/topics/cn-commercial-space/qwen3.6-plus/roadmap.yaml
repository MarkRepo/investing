historical_analogies:
- case: 美国 SpaceX 发展路径（2002-2025）
  logic: 从可复用火箭→星链→估值平台化的路径可部分复制到中国
  limitation: 中国市场环境、体制差异、技术起点不同，不能简单线性外推
- case: 中国高铁/风电产业崛起（2005-2015）
  logic: 国家主导基础设施投资→技术引进消化→规模化降本→全球竞争力
  limitation: 航天技术壁垒更高，国际竞争环境不同
- case: 中国新能源车产业（2015-2024）
  logic: 政策驱动初期→技术拐点→市场化竞争→头部集中
  limitation: 航天出口受限，地缘政治因素影响更大
