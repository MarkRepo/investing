# L1/L2 已坍缩为 primer scope 备注（背景理解交给 00_primer，primer-first）
primer_scope: >
  primer 该覆盖：光通信价值链（芯片 EML/CW/VCSEL → 模块收发器 → 系统交换/传输）与 Lumentum 卡位 /
  EML 是什么、为何是 800G/1.6T 收发器核心瓶颈、200G-per-lane 意义 / InP 晶圆尺寸(3→4→6 寸)与良率
  如何决定成本-稀缺-定价权 / Lumentum 三身份变迁(JDSU 分拆→telecom+3D 感测→AI 光学龙头) /
  毛利率为何从 ~16% 跳到 ~48%、稀缺定价机制 / 四大增长引擎(EML/Cloud 收发器/OCS/CPO) /
  NVIDIA $2B 入股结构(优先股+采购承诺+双供应商)为何双刃 / 竞争格局(Coherent 头号/日系 EML/
  中国模块厂旭创·新易盛/SiPho 替代) / 财年特殊性(FY 截 6 月底) + Components vs Systems 分部 /
  AI 光学股估值为何用 PS/EV-Sales/forward PE、~50x forward PE 计入了什么 / CPO·OCS 路线之争对
  可插拔光模块价值链的中长期重构。

learning_track:
  # ── L3 争议层：把 thesis"最大反方观点"展开为可调研的分歧点 ──
  l3_debates:
    - question: Lumentum 的 ~48% 毛利率与定价权由 EML 稀缺(~25-30% 缺口)驱动，而 Coherent 正用 6 寸 InP(4x dies/wafer+更低成本)主动消灭稀缺并同获 NVIDIA $2B——稀缺定价能撑到 CY2027 吗？这是整份 thesis 的命门。
      maps_to: [命门1, K1, K2]
      source_hint: Coherent OFC 2026 deck [mat-6deb5b] + chipstrat 激光瓶颈分析 + OFC 技术披露 + LightCounting/Yole 份额拆分(待收)
    - question: ~$900、forward PE 50x、PS 27x、PEG 0.40、24 位分析师 Buy/0 Sell、目标价 $1,113——是反向风险信号(利好定满)，还是真实盈利能见度支撑？
      maps_to: [命门2, K2, K4]
      source_hint: 估值统计 [mat-6d2dc1] + 一致预期 [mat-f8057b][mat-b4a168] + 历史"卖方狂热即顶"复盘(待收)
    - question: 股价计入了 OCS(CY27 $1B)+ CPO(H2 CY26 拐点)两个尚未规模兑现的引擎——是真实增量还是已被过度计价的期权？
      maps_to: [命门3, K3]
      source_hint: OCS backlog/协议 [mat-95ad42] + 卖方引擎拆解(待收) + 逐季兑现跟踪
    - question: 需求高度集中在 NVIDIA + 2-3 家 hyperscaler，NVIDIA 双供应商(同投 Coherent)本身暗示不想给任一方定价权——客户集中+不对称议价是否在产能释放后压制毛利？
      maps_to: [命门3, K5]
      source_hint: NVIDIA 采购承诺条款 [mat-95ad42] + 10-K 客户集中度披露(待收) + hyperscaler capex 指引
    - question: 这轮是否复制光通信史上的崩塌剧本——JDSU dot-com 泡沫(本体即 LITE 前身)与 LITE 自身 2022-24 telecom+3D 下行(营收 $17.7→$13.6 亿、连续巨亏)？哪里相同/不同？
      maps_to: [命门2, K4]
      source_hint: 历史镜鉴(JDSU 2000-02 + LITE 2021-24 10-K) + macrotrends 周期史 [mat-d832fb]

  # ── L4 狩猎层：逐条对齐 thesis Killer Question，找错误定价 ──
  l4_hunting:
    - question: Lumentum 3 寸 InP vs Coherent 6 寸 InP 的良率/成本赛跑现状？Coherent 6 寸良率是否真追平、200G/400G EML 产能与认证进度、行业供给缺口是否从 ~30% 收窄、LITE EML ASP 季度走势？(承重命门，最高优先级)
