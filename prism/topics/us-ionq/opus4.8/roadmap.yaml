key_risks_to_monitor:
  - 并购整合失败 / 商誉减值
  - 经营性现金消耗扩大 + 再启大额稀释
  - 逻辑比特/纠错落后 Quantinuum/Google
  - 量子主题资金退潮 / 权威"时间线太远"表态
  - 逼空/期权驱动的向上波动（看空方尾部风险）

analogies_to_study:
  - 案例: 美股 3D 打印股 2013-2015（DDD/SSYS）
    类比逻辑: 革命性制造技术叙事 + 高 P/S，商业化兑现慢于预期后估值腰斩
    类比局限: 3D 打印当期已有实收入体量；量子当期效用更早期
  - 案例: 2020-2021 pre-revenue SPAC 科技股（QuantumScape/Nikola 等）
    类比逻辑: SPAC 上市 + 远期技术叙事 + 极高估值 → 里程碑延期后回归
    类比局限: IonQ 已有 100%+ 增长的真实营收，非纯 pre-revenue
  - 案例: 2000 光通信/互联网泡沫
    类比逻辑: 技术长期正确但股价因兑现时点错配崩盘
    类比局限: 宏观/利率环境不同
