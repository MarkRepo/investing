learning_track:
  l1_orientation:
    - question: "卫星通信载荷的三大子系统（相控阵天线、转发器、星间激光终端）各自的技术原理、价值量占比和国产化阶段是什么？"
      source_hint: "行业研报技术综述章节 + 学术论文"
    - question: "低轨星座对载荷的核心性能要求是什么？与高轨通信卫星的载荷需求有何本质差异？"
      source_hint: "GW/千帆星座技术指标公开资料 + 对比Starlink v2载荷规格"
    - question: "中国卫星通信载荷产业链全景：上游（TR组件/光模块/FPGA）、中游（天线整机/转发器整机/激光终端整机）、下游（星座运营商）各有哪些主要玩家？"
      source_hint: "卖方产业链图谱 + 各公司招股书/年报"
    - question: "全球卫星通信载荷市场规模多大？中国市场在其中占比和增速如何？"
      source_hint: "NSR/Euroconsult行业报告 + 国内券商测算"
  l2_history:
    - question: "Starlink载荷从v0.9→v1.0→v1.5→v2.0的技术迭代路径是什么？每次升级的核心变化和成本影响？"
      source_hint: "SpaceX公开FCC文件 + 国外技术分析文章"
    - question: "中国卫星载荷过去5年的技术演进：从'跟跑'到哪些环节开始'并跑'？关键突破事件（如首颗星间激光通信验证）在何时发生？"
      source_hint: "科研项目验收公告 + 行业里程碑事件梳理"
    - question: "全球星间激光通信的技术路线收敛过程：相干探测vs直接探测、1550nm vs 1064nm、哪些路线已被淘汰？"
      source_hint: "学术综述论文 + 行业标准文档"
  l3_debates:
    - question: "相控阵天线：硅基CMOS vs 氮化镓(GaN) vs 传统T/R组件——哪条路线会在LEO星座中成为主流？成本曲线何时交叉？"
      source_hint: "芯片厂商技术路线图 + 成本模型测算"
    - question: "星间激光终端：中国与Mynaric/Tesat-Spacecom等海外龙头的代际差距是2年还是5年？差距在'做不出来'还是在'做不便宜'？"
      source_hint: "国内外激光终端参数对比 + 在轨验证进度"
    - question: "转发器：是'夕阳环节'（透明转发→再生处理演进中被边缘化）还是'被低估的瓶颈'（多波束/跳波束能力决定频谱效率上限）？"
      source_hint: "3GPP NTN标准进展 + 转发器厂商技术路线"
    - question: "批量制造的良率与一致性：卫星载荷从'实验室手工打磨'到'产线批量下线'的过程中，最大的工程挑战在哪个环节？"
      source_hint: "卫星制造企业调研 + 良率爬坡案例分析"
    - question: "谁是载荷环节的最大价值捕获方——天线整机厂（集成溢价）还是核心芯片厂（技术壁垒溢价）？类比：手机产业链中富士康 vs 高通"
      source_hint: "价值链利润分配模型 + 各环节毛利率对比"
  l4_hunting:
    - question: "如果市场在用'航天概念'整体给载荷公司定价，那么技术壁垒最高（星间激光）的那家公司是否被系统性低估？"
      source_hint: "已上市载荷相关公司PE/PS对比 + 技术含金量评分"
    - question: "星间激光终端是否存在'从0到1再直接到100'的非线性放量机会——一旦通过首套在轨验证，GW星座直接下单1000+套？"
      source_hint: "GW星座采购招标信息 + Starlink激光终端放量历史"
    - question: "哪些公司同时在载荷和地面终端两个市场布局，从而享有'天地一体化'的估值溢价？"
      source_hint: "公司战略/年报 + 地面终端市场规模测算"
    - question: "如果2026-2027年某家中国激光终端公司实现与Starlink同等性能但成本降低50%，其估值天花板在哪？参照：Mynaric被收购的估值"
      source_hint: "海外对标公司交易数据 + DCF估值模型"
material_priority:
  tier1:
    - title: "卫星通信载荷产业链深度研报（相控阵+转发器+激光终端技术对比+国产化率）"
      type: "sell-side"
      source: "中信/华泰/国金等头部券商行业深度"
      why: "提供完整的产业链图谱、市场规模测算、各环节国产化率——是后续所有分析的基础数据源"
    - title: "Starlink载荷技术演进分析（FCC文件+专利+逆向工程报告）"
      type: "sell-side"
      source: "外资券商（如Morgan Stanley Starlink深度）+ 国外技术博客"
      why: "作为中国载荷的技术追赶参照系，理解差距在哪、差距多大"
    - title: "中国星间激光通信在轨验证进展汇总（各星座/各公司试验结果）"
      type: "data"
      source: "中国航天科技集团/中科院公告 + 行业媒体跟踪"
      why: "激光终端是当前技术壁垒最高、差距最大的环节，在轨数据是最直接的验证"
    - title: "相控阵天线TR组件/芯片国产化专题报告（GaN/GaAs/SiGe/CMOS路线对比）"
      type: "sell-side"
      source: "电子行业券商（如华创/天风电子团队）"
      why: "TR组件是相控阵天线的核心成本项和性能决定因素，国产化进度决定成本曲线"
  tier2:
    - title: "3GPP NTN（非地面网络）标准进展及对卫星载荷架构的影响"
      type: "policy"
      source: "3GPP Release 18/19标准文档 + 行业解读"
      why: "标准化程度决定了转发器是否需要再生处理能力，进而影响技术路线和成本"
    - title: "上海瀚讯/国博电子/航天电子等上市公司年报及载荷业务拆分"
      type: "annual-report"
      source: "巨潮资讯网/公司官网"
      why: "提供真实的财务数据（毛利率、研发投入、订单）来判断'价值捕获'假设"
    - title: "海外激光终端对标：Mynaric/Tesat/Honeywell产品参数与估值"
      type: "data"
      source: "海外公司官网+行业数据库"
      why: "提供全球竞争参照系和估值锚——中国公司最终需要达到什么水平？"
    - title: "GW/千帆星座技术需求规格书或招标技术条件（如可获取）"
      type: "data"
      source: "行业渠道/公开招标信息"
      why: "直接验证星座运营商对载荷的真实需求——是'能用就行'还是'指标苛刻'"
  tier3:
    - title: "卫星批量制造及测试验证专题（产线自动化+环境测试+在轨故障统计）"
      type: "sell-side"
      source: "券商专题报告"
      why: "帮助理解'从实验室到产线'的工程挑战，判断良率爬坡节奏"
    - title: "手机直连卫星技术路径及对载荷的新需求（AST SpaceMobile vs Starlink Direct to Cell）"
      type: "sell-side"
      source: "海外技术分析报告"
      why: "如果手机直连卫星成为主流，相控阵天线需求将爆发且规格完全不同"
key_risks_to_monitor:
  - "星间激光终端在轨验证反复失败或性能不达标，导致星座运营商回归微波链路方案"
  - "硅基CMOS相控阵在太空辐射环境下的可靠性问题，可能需要GaN路线回退"
  - "星座运营商（GW/千帆）自行垂直整合载荷研制，第三方供应商被'内化'"
  - "海外对中国禁运关键光器件/FPGA，导致激光终端和数字转发器研发停滞"
analogies_to_study:
  - "Starlink载荷从外购→自研的垂直整合路径（2018-2023）：SpaceX如何通过自研将单星成本从~50万降至~25万？载荷自研是降本主力还是次要因素？"
  - "中国5G基站AAU（有源天线单元）的国产化历程（2019-2023）：相控阵天线技术在5G AAU中已大规模商用，技术扩散到卫星载荷的速度和瓶颈在哪？"
  - "光模块行业从10G→100G→400G→800G的国产替代路径（2015-2023）：星间激光终端本质上是一个'太空版相干光模块'，光模块行业的国产替代节奏能否类比？"