learning_track:
  l1_orientation:
    - question: "CEG 业务结构：核电 22GW / 天然气 / 可再生 / 输配电 各 segment 的容量、营收、EBITDA 占比？"
      source_hint: "CEG 10-K segment 表 + 投资者日 deck"
    - question: "美国核电行业边界：96 台运营机组 / 94GW 总容量分布在哪些运营商？CEG/Vistra/PSEG/Duke 的市场份额？"
      source_hint: "EIA / NRC reactor list / 各家 10-K"
    - question: "PPA 市场结构：核电 PPA vs 燃气 PPA vs 可再生 PPA 在期限、价格、合同条款上的差异？"
      source_hint: "S&P Global Platts / LevelTen Energy PPA index / hyperscaler 可持续报告"
  l2_history:
    - question: "美国核电过去 30 年走势：1979 三哩岛 → 2011 福岛 → 2019 三哩岛 1 号退役 → 2024 重启宣布的关键拐点与估值多重切换？"
      source_hint: "EIA 历史数据 + S&P 公用事业指数 PE 多年时间序列"
    - question: "Exelon 拆分到 CEG 独立上市（2022.02）后股价/估值演化？哪些催化剂触发了重估？"
      source_hint: "CEG 上市公告 + 2022-2025 年 sell-side 报告"
    - question: "上一轮 PPA 黄金期（2000s 美国核电与公用事业的长期 PPA）vs 当前 hyperscaler PPA 的根本差异？"
      source_hint: "EIA 历史合同数据 + 卖方核电深度报告"
  l3_debates:
    - question: "核电 PE 应该是 15-18x（公用事业）还是 22-28x（科技基础设施）？多空双方核心分歧？"
      source_hint: "Bull/Bear sell-side notes 对照 + Morningstar/Argus 估值方法对比"
    - question: "存量核电 vs SMR 期权的估值偏差：为什么 NuScale（无收入）市值能超 $5B 而 CEG 重估困难？"
      source_hint: "父 topic peer_matrix + NuScale FY2025 10-K + SMR 行业报告"
    - question: "可再生 + 长时储能（LDES）2028-2030 是否能稀释核电 24/7 PPA 溢价？储能 LCOE 下降速度？"
      source_hint: "NREL ATB cost curve + Form Energy/ESS 进展 / NEE 24/7 PPA 公告"
    - question: "PPA 锁定后 CEG 是否丧失现货市场上行 beta？2027-2030 美国电价情景下 PPA vs 现货的机会成本？"
      source_hint: "PJM 长期电价预测 + 卖方电力 commodity 报告"
    - question: "Calpine 整合后核电 + 燃气混合的『绿色 + 可调度』叙事 vs 纯核电叙事，哪个估值更高？"
      source_hint: "CEG-Calpine 合并 proxy + 卖方对 NEE/Vistra 多元能源结构的估值方法"
  l4_hunting:
    - question: "未来 18 个月（截至 2027-11）CEG 是否新增 ≥2 份大科技 PPA（≥500MW、≥15 年）？"
      addresses: [K1]
      source_hint: "CEG 8-K + hyperscaler 能源采购声明 + Bloomberg PPA tracker"
    - question: "Crane 项目 NRC 换发许可证 2026Q4 前是否获批？2028 重启时间表是否维持？"
      addresses: [K2]
      source_hint: "NRC ADAMS 系统 license amendment 状态 + CEG 季报"
    - question: "Calpine 整合后 FY2027 核电 segment EBITDA margin 是否 ≥ 55%？"
      addresses: [K3]
      source_hint: "FY2026/FY2027 10-K + integration call + 卖方 segment model"
    - question: "CEG 已签 PPA 加权均价是否 ≥ $90/MWh？连续两份新 PPA 单价是否阶梯上行？"
      addresses: [K4]
      source_hint: "财报 PPA disclosure + Platts core earnings call commentary"
    - question: "FY2026/FY2027 共识 EPS 12 个月内是否 ≥ +15% 上修？管理层是否给 FY2028+ 数字 guidance？"
      addresses: [K5]
      source_hint: "FactSet/Bloomberg 共识 + 季报 transcript"

