key_risks_to_monitor:
  - "NRC 监管事故（任一）→ 行业 derate 与 CEG 重估溢价归零"
  - "Crane 重启延期 ≥ 12 个月 → 估值时间表后移、IRR 下移"
  - "Calpine 整合摩擦持续（2026-2027 一次性费用）→ 利润下修 + 共识 EPS 下行"
  - "储能 LCOE 加速下降（年降 ≥ 15%）→ 核电 24/7 溢价被稀释"
  - "PJM 现货电价下行（如果 AI 投资降温）→ PPA 锁定机会成本变小但绝对收入下行"
  - "2026 大选政策反复 → IRA Section 45U PTC 修订或撤销"

analogies_to_study:
  - case: "Vistra (VST) 收购 Energy Harbor 重估（2024-2025）"
    similarity: "同样是核电资产从批发市场暴露 → 通过 PPA 锁定长期收入"
    difference: "VST 资产更小（4GW vs CEG 22GW），且 VST 同时还有大量燃气和煤电；CEG 是更纯的核电"
  - case: "ASML / TSMC 从'制造业'到'半导体基础设施'的估值重构（2017-2021）"
    similarity: "存量稀缺资产 + 技术不可复制 + 受益于结构性需求 → PE 倍数从 15x 区间扩张到 25-35x"
    difference: "ASML/TSMC 是技术领先壁垒，CEG 是监管 + 资产年龄壁垒，可能上限低；且半导体没有'监管事故'风险"
  - case: "1990s 美国铁路重组 → 重定价为'基础设施资产'（Buffett 投资 BNI 案例）"
    similarity: "存量物理资产 + 不可复制 + 长期合同锁定 → 估值倍数扩张"
    difference: "铁路无安全黑天鹅，核电有；铁路无替代技术压力，核电面临 SMR/储能"

