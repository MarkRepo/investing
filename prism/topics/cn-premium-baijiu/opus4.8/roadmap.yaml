# L1/L2 已坍缩为 primer_scope（背景理解层全权交给 00_primer，roadmap 只列驱动收料的 L3/L4）
primer_scope: >
  00_primer 须覆盖：高端白酒行业边界与价格带分层（超高端/高端/次高端 + 代表单品玩家）；
  赚钱机理（提价权+品牌+老酒稀缺+渠道杠杆）与厂→经销→终端利润分配；
  价格体系科普（批价/打款价(出厂价)/开票价/倒挂，为何批价是需求领先指标）；
  财报关键科目（营收/净利/毛利率/合同负债/预收款/经营现金流）及"压货"如何在报表留痕；
  库存周期如何驱动业绩 + 第三方草根如何交叉验证厂家口径；
  本轮(2023-)下行周期成因/节奏与 2013-15 轮异同；消费税改革对白酒的潜在影响路径。

learning_track:
  # L3 争议层：把 thesis 三条"最大反方观点"展开为可调研争议点
  l3_debates:
    - question: 2026Q1 板块降幅骤收窄（营收 -0.66%/净利 -1.75%）是真实需求企稳，还是低基数+厂家压货+会计节奏制造的"假筑底"？多空分歧的核心证据各是什么？
      source_hint: 中信建投/浙商板块季报点评 + 各家合同负债/经营现金流交叉验证（压货会现"收入增but现金流/合同负债背离"）
    - question: 飞天批价的"底"（年初破 1499 创新低→控货反弹至 ~1665）是真实动销支撑的可持续底，还是厂家控量稳价撑出的脆弱平衡，控货一松就二次探底？
      source_hint: 今日酒价/酒价内参高频序列 + i茅台限购(12→6→1)对社会库存真实影响 + 卖方对"控量可持续性"的判断
    - question: 估值先于批价见底在本轮是否成立？当前龙头 PE 历史分位是否已确认"杀估值"走完，还是仍有戴维斯双杀下半场（杀业绩）风险？
      source_hint: 茅五泸+汾酒 PE-TTM/PB/股息率历史分位 + 13-15 轮"PE 先于 EPS 拐点"复盘对位
    - question: 本轮 alpha 究竟归属高端龙头还是次高端弹性？次高端里谁是真弹性（汾酒青花全国化）谁是价值陷阱（洋河/口子窖持续失血）？错配的代价多大？
      source_hint: 茅五泸+汾酒/洋河/古井/舍得/口子窖逐家渠道健康度+报表质量横比 + 口子窖净利预降50-60%预警
    - question: 长逻辑逆风（政务/商务消费受地产+反腐压制未真实回暖、年轻人饮酒变迁、人群老龄化）会否让"筑底"演变为"长期低位横盘"而非 V 型反转？
      source_hint: 卖方对政务消费/场景重构的判断 + 行业需求结构深度报告

  # L4 狩猎层：逐条对齐 thesis Killer Question（K1-K6），找错误定价
  l4_hunting:
    - question: 2026Q2/Q3 板块（尤其茅五泸）营收或净利能否同比转正或降幅继续收窄至个位数？市场目前隐含的拐点节奏与卖方分歧在哪？
      addresses: [K1]
      search_keywords: [白酒 2026Q2 业绩, 板块 降幅收窄, 茅五泸 季度拐点]
      source_hint: 卖方拐点研报合集(浙商筑底2026Q2/中信建投杨骥/东吴出清筑底) + 各家季报趋势
    - question: 飞天散瓶批价能否站稳 1500 以上不破前低(1490)、普五批价回到 850+ 且倒挂收窄？哪个时点能验证/证伪批价二次探底？
      addresses: [K2]
      search_keywords: [飞天茅台 批价, 普五 批价 倒挂, 酒价 高频序列]
      source_hint: 高频批价序列(今日酒价/酒价内参) + 价格体系科普 + 控量稳价政策可持续性
    - question: 渠道库存是否经第三方草根验证回到正常水位(高端~1-2个月)、经销商主动打款意愿回升？还是"库存压缩"仅厂家口径、草根仍显高库存（业绩收窄系压货假象）？
      addresses: [K3]
      search_keywords: [白酒 渠道库存, 动销 草根调研, 经销商 打款 去库存]
      source_hint: 渠道库存草根调研 + 合同负债/现金流报表识别压货
    - question: 消费税改革 2026 是否落地、是否触及白酒、征收环节后移对高端厂家/渠道净利的实际冲击幅度多大？什么信号能确认/排除这一尾部风险？
      addresses: [K4]
      search_keywords: [消费税改革 白酒, 征收环节后移, 白酒 加税 测算]
      source_hint: 消费税改革测算专题 + 财税三中全会解读
    - question: 茅五泸三家在本轮修复中批价弹性/报表质量/渠道健康度谁最优？泸州费用弹性 vs 五粮液价盘修复 vs 茅台直营吨价提升，谁风险收益比最佳？管理层资本配置(分红/回购/增持)取向如何？
      addresses: [K5]
      search_keywords: [茅五泸 横比, 白酒 估值 分位, 茅台 五粮液 分红 回购]
      source_hint: 估值历史分位 + 茅五泸分红回购资本配置史 + 三家年报/季报横比
    - question: 次高端(汾酒/洋河/古井/舍得/口子窖)中谁是"降幅收窄+全国化兑现"真弹性(汾酒青花)，谁是"持续失血"价值陷阱(洋河/口子窖)？
      addresses: [K6]
      search_keywords: [汾酒 青花 全国化, 次高端 白酒 分化, 洋河 口子窖 业绩]
      source_hint: 次高端逐家年报+动销/库存 + 口子窖净利预减公告

material_priority:
  tier1:              # 必读，研究不可缺（已全部入库）
    - title: 茅五泸三家 2025 年报 + 2026Q1 季报（营收/净利/毛利率/合同负债/经营现金流全表）
      type: annual-report
      ticker: SSE_600519
      source: cninfo / 公司 IR（已入库 mat-6fe639/9519f5/3bdade + 各 Q1）
      why: 拐点真伪(K1/K3)与龙头分化(K5)的报表地基，合同负债/现金流识别压货
      addresses: [K1, K3, K5]
    - title: 高频批价序列（飞天/普五/国窖 散瓶+原箱+开票价，近6-12月）
      type: data
      source: 今日酒价/酒价内参/财联社酒价播报（已入库 mat-765cbf + prescan 批价快照群）
      why: 批价是需求真伪照妖镜——命门2(最低置信、最该砸料)的核心证据
      addresses: [K2]
    - title: 渠道库存与动销草根调研（高端+次高端，交叉验证厂家口径 vs 真实库存月数）
      type: channel-check
      source: 卖方草根纪要/渠道调研/行业自媒体动销汇总（已入库 mat-ec60d5）
      why: 去库存真伪(K3)，识别"业绩收窄系压货假象"
      addresses: [K3]
    - title: 白酒周期/拐点卖方深度研报合集（浙商筑底2026Q2 / 中信建投杨骥十年一遇大底 / 东吴出清筑底）
      type: sell-side-note
      source: 同花顺/Wind/券商研报库（已入库 mat-0225c4，含 consensus 一致预期）
      why: 拐点确认(K1)+批价企稳(K2)的卖方共识与分歧，A合同 consensus 必收
      addresses: [K1, K2]
  tier2:              # 补充，有助验证
    - title: 茅五泸+汾酒 估值历史分位（PE-TTM/PB/股息率 + 近10年分位）
      type: data
      source: Wind/理杏仁/雪球（已入库 mat-d42e97，含 valuation-anchor）
      why: 判"估值底是否已现/杀估值是否走完"(K5)，A合同 valuation-anchor
      addresses: [K5]
    - title: 次高端逐家 2025 年报 + 2026Q1（汾酒/洋河/古井/舍得/口子窖）
      type: annual-report
      ticker: SSE_600809
      source: cninfo（已入库 mat-857153/c27f59/08c1da/fee915/3a9e91 + 各 Q1）
      why: 判次高端弹性 vs 陷阱(K6)，口子窖净利预减是预警
      addresses: [K6]
    - title: 茅五泸 分红/回购/资本配置史（近5年分红率/注销式回购/集团增持）
      type: company-filing
      source: 公司公告（已入库 mat-78157e，含 mgmt-capital-alloc）
      why: 判管理层股东回报取向，高股息为左侧布局提供安全垫(K5)，A合同 mgmt-capital-alloc
      addresses: [K5]
    - title: 消费税改革对白酒影响的卖方专题测算（征收环节后移/加税对厂家+渠道净利冲击）
      type: policy
      source: 券商食饮/财税专题（已入库 mat-01c06e）
      why: 外生尾部风险(K4)冲击幅度测算，喂环⑤证伪机制
      addresses: [K4]
  tier3:              # 可选，深研参考
    - title: 2012-2015 轮白酒调整复盘（批价/估值/各家修复路径）
      type: industry-research
      source: 卖方复盘报告（已入库 mat-118a9e，arena-mirror 历史镜鉴）
      why: 环⑤历史镜鉴——"相似剧本怎么崩/曾经赢家如何修复掉队"，A合同 arena-mirror
      addresses: [K1]
    - title: 高端白酒价格体系与批价机理科普（批价/打款价/开票价/倒挂 + 库存周期机制）
      type: industry-research
      source: 行业科普/卖方入门（已入库 mat-e04a4e）
      why: 喂 00_primer 入门目标 1/3/7 背景料
      addresses: [K2]

key_risks_to_monitor:
  - 飞天散瓶批价跌破年初新低(1490) → 拐点延后/筑底证伪
  - 2026Q2 板块降幅重新走阔 → "周期大底"叙事崩，thesis 强度下调至 ≤4
  - 消费税改革落地且重度触及白酒 → 重估全赛道（外生不可对冲）
  - 渠道草根持续显高库存而厂家口径报正常 → 业绩收窄系压货假象
  - 次高端持续失血扩散(洋河/口子窖) → 错配弹性重伤收益

analogies_to_study:
  - name: 中国白酒 2012-2015 轮调整（限制三公消费 + 塑化剂 + 去库存）
    similarity: 同为政策压制(政务消费)+渠道高库存+批价崩塌驱动的下行周期；茅五泸均经历杀估值再杀业绩；龙头率先修复、二三线分化
    limitation: 本轮无塑化剂式信任危机；当前金融属性已大幅弱化(飞天)、电商/即时零售渠道结构不同；宏观地产下行是新增长期逆风
    ring: arena-mirror
    material: mat-118a9e（已收实证：13-15轮复盘研报）
