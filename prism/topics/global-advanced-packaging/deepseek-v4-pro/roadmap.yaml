key_risks_to_monitor:
  - "TSMC 法说会提及 CoWoS '供需趋平衡'或下调扩产计划 → 周期从紧缺→过剩"
  - "Non-TSMC 封装厂（Amkor/ASE）获得大客户 CoWoS 认证 → TSMC 垄断地位松动"
  - "台湾 7 级以上地震或两岸冲突 → TSMC 生产中断（尾部风险，致命）"
  - "Samsung 先进封装获得 NVDA 或 AMD 订单 → 竞争格局质变"
  - "SoIC 技术路线验证失败或量产延迟 → TSMC 第二增长曲线受阻"

analogies_to_study:
  - name: "1990s 半导体前道制程（光刻）从 IDM 一体化→Foundry 分工"
    analogy: "当年晶圆制造从 IDM 独立出来成就了 TSMC 的崛起。先进封装正在经历类似的'从后道到前道'的价值重估——封装不再是被动的后端工序，而是决定芯片性能的关键环节。"
    limitation: "先进封装的技术壁垒更高（3D 堆叠、混合键合），参与者的数量远少于当年的晶圆代工爆发期。不一定出现大量竞争者。"
  - name: "ASML EUV 光刻机的垄断故事（2010-2025）"
    analogy: "ASML 在 EUV 光刻机领域近乎 100% 垄断 15 年，与 TSMC 在 CoWoS 的地位类似。EUV 的不可替代性使其定价能力极强。TSMC CoWoS 的不可替代性会持续多久？"
    limitation: "EUV 光刻机的技术壁垒（物理极限、供应链深度）远超先进封装。封装的进入门槛相对低——Amkor/ASE 可以在 3-5 年内追赶，但 EUV 追赶至今无解。"
  - name: "2017-2019 DRAM 存储器从紧缺→过剩周期"
    analogy: "存储行业的三星/SK Hynix/美光寡头格局类似今天的 CoWoS/HBM。2017-2018 供给紧张→疯狂扩产→2019 产能释放→价格暴跌——先进封装会不会重复？"
    limitation: "先进封装是定制化服务（不是标准化商品），价格由客户谈判决定而非公开市场定价。客户（NVDA/AVGO）愿意接受一定的价格溢价换取供应保障——波动性可能小于存储。"