key_risks_to_monitor:
  - "氧化物路线（三星 SDI 主推）若 2026-2027 量产顺利，绕开硫化锂卡点，K1/K3 整体逻辑破产"
  - "欧美对中国硫化锂产业链非市场化封锁（IRA / 欧盟关键原材料法案）"
  - "CATL 凝聚态 + 钠电挤压全固态量产时点 → 硫化锂需求曲线推迟 3-5 年"
  - "出光/三井若开放专利授权给中国厂商，专利墙护城河消失，日韩技术租金窗口归零"

analogies_to_study:
  - case: "2017-2020 三元正极材料工艺学习曲线（30 万 → 15 万元/吨）"
    why_alike: "同样是规模化 + 干法工艺 + 纯度提升驱动的 50% 降本；硫化物 LPSC 4000 元/kg 目标的可信度参考"
    why_different: "三元正极有钴/镍金属价波动的扰动，硫化物降本主要靠工艺/规模，无原料价格扰动"
  - case: "2010-2015 LFP 正极价格下行（80 万 → 4 万元/吨）"
    why_alike: "新材料商业化早期价格断崖式下行 + 中国厂商规模化追赶日韩"
    why_different: "LFP 化学体系简单、专利墙弱；硫化物专利墙更强 + 工艺更复杂"
  - case: "1990s 索尼锂离子电池负极石墨化（10 年从 2000 美元/kg → 20 美元/kg）"
    why_alike: "锂金属负极如能复制石墨化的工艺学习曲线，K4 可乐观；'锂金属是新石墨'的叙事是否成立"
    why_different: "石墨是稳定材料，锂金属是高活性碱金属，加工和封装难度高 5 个数量级"
