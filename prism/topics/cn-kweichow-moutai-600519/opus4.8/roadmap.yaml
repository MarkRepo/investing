# L1/L2 已坍缩为 primer scope 备注（背景理解交给 00_primer，primer-first）
primer_scope: >
  00_primer 须覆盖：茅台收入/利润结构（飞天 / 非标生肖·精品·年份 / 系列酒·茅台1935）；
  飞天"出厂价 vs 官方指导价 1499 vs 市场批价"三价体系与价差含义；批价为何是行业景气晴雨表
  （散瓶 / 原箱 / 整件价差各反映什么）；直销（i茅台）vs 经销（批发）的吨价·毛利差与渠道扁平化；
  "合同负债=业绩蓄水池"含义及压货式 vs 动销式增长之别；护城河来源（品牌 / 稀缺 / 产能周期 /
  酱香 5 年窖藏）；白酒"金融属性·硬通货"现象及其对需求的双面性；白酒行业周期
  （2012-15 调整 / 2016-21 牛市 / 2023 起下行）驱动因子；消费税从量+从价复合机制与征收环节
  后移的报表传导路径；资本配置工具箱（分红 / 注销式回购 / 控股股东增持）如何影响每股价值；
  茅台 vs 五粮液·泸州老窖·汾酒的价格带错位；PE 历史区间与估值中枢上下移的关键因素。

