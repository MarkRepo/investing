key_risks_to_monitor:
  - 飞天散瓶批价重新跌破 1499 并持续（命门2 恶化 / 破 1400 触发 kill）
  - 2026Q2/Q3 营收增速重新走阔转负（命门3 拐点证伪）
  - 稳态毛利率系统性跌破 ~85% 不回升（命门1 根基动摇）
  - 合同负债续降 + 直销吨价对冲失败（蓄水池消失后真实动销不足）
  - 消费税征收环节后移最终纳入酒类（尾部政策风险 re-open）

