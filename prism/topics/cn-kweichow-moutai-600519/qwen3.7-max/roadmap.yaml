analogies_to_study:
  - name: "2013-2014白酒反腐调整期"
    logic: "三公消费禁令→飞天批价从¥2000跌至¥800→茅台PE从30x跌至10x→2年触底回升。当前批价跌幅（-34%）vs当时（-60%），本轮需求端（人口/消费降级）vs当时（政策端）"
    limitation: "本轮是需求+供给+库存三期叠加，非单一政策冲击；行业库存¥1万亿远高于当时"
  - name: "LVMH 2008-2009金融危机期间"
    logic: "全球奢侈品龙头在经济危机中股价-50%+，但品牌力未损，2年内回升。茅台品牌力+产能稀缺性与LVMH类似"
    limitation: "中国白酒市场封闭性vs全球奢侈品多元化；茅台金融属性/收藏属性是LVMH没有的风险维度"
  - name: "日本清酒行业1990s缩量期"
    logic: "日本清酒在人口拐点+消费代际切换中行业量缩20年+，头部品牌（獺祭）逆势增长。中国白酒面临类似人口/代际挑战"
    limitation: "中国白酒市场远大于清酒；茅台的定价权/品牌壁垒远超日本清酒龙头"
