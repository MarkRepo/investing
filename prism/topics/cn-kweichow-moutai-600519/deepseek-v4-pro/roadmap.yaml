analogies_to_study:
  - name: "2013-2014 中国白酒反腐调整期"
    logic: "最直接的历史类比——批价暴跌（2000→850）、营收个位数下滑、PE 从 25x 跌至 10x、反腐+塑化剂双杀后 2015-2016 强势复苏。本轮是否有类似剧本？"
    limitation: "本轮无塑化剂式黑天鹅、茅台品牌力远强于 2013 年、直营占比从 ~14%→44%+ 改变了渠道结构、投资性库存规模远大于当时"
    todo: "收 historical-mirror 实证：2013-2014 茅台批价/营收/利润/PE 月度量化序列 + 复苏路径复盘"

  - name: "日本 1990s 高端清酒/威士忌去泡沫"
    logic: "奢侈品+投资品双重属性在资产价格下行期的去泡沫过程——日本高端威士忌（山崎/響）在 1990s 的价格崩塌与品牌重塑，可作为茅台'投资品属性'去化的参考"
    limitation: "中日消费文化差异、茅台社交货币属性在日本无直接对标、中国白酒无海外参照"
    todo: "收 historical-mirror 实证：日本高端威士忌 1990-2000 价格序列 + 品牌复苏路径（英文/日文资料）"