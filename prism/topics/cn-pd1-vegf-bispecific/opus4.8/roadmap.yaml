key_risks_to_monitor:
  - FDA PDUFA 2026-11-14 审评结论 / ODAC 排期（K1 · 命门1 翻盘点）
  - 707/BNT327/LM-299 任一在 1L NSCLC 头对头/OS 追平依沃西（K2 · 命门2 证伪点）
  - 首个 PD-1/VEGF 医保谈判降幅 >50% 或赛道 ≥5 家国产 III 期（K3 · 命门3 价格战预警）
