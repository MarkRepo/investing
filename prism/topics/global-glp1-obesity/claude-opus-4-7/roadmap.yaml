key_risks_to_monitor:
  - BALANCE Model 实际入网受益人数 (CMS 月度数据)
  - retatrutide TRIUMPH-3 Phase 3 顶线数据时间窗 (预期 2026 H2 - 2027)
  - CT-388 ENITH-1 Phase 3 启动 + 中期数据
  - VK2735 VANQUISH 数据 + Viking 收购溢价 (3-5x catalyst)
  - 中国 sema 仿制 NMPA 审批节奏 (NDA → 上市 6-12 个月)
  - retatrutide / CagriSema / amycretin 任一安全性事件 (FDA 警示)
  - LLY/NVO 任一季度 net price 披露异常 (gross-to-net 附注)

analogies_to_study:
  - name: 2014-2018 索菲布韦 (Sovaldi/Harvoni) 政府压价
    geo: US
    period: 2014-2018
    similarity: 短期单价巨高 + 政府"年复年成本"压力 → BALANCE Model 类似机制
    difference: HCV 治愈性短疗程 (12 周)，GLP-1 终身服药 → 政府压力实际更持续

  - name: 2015-2020 PCSK9 抑制剂 (Repatha/Praluent) 商保拒付
    geo: US
    period: 2015-2020
    similarity: 临床数据强但定价权被支付方反噬 → 实际营收远低于预期
    difference: PCSK9 是预防性，GLP-1 是减重个人意愿 + DTC 渠道 → 个人付费意愿强 → 不会完全复现

  - name: 1990s NVO 胰岛素霸权 → 2010s 长效胰岛素被 LLY/Sanofi 侵蚀
    geo: GLOBAL
    period: 1990-2020
    similarity: NVO 单一品类依赖在长周期里的脆弱性 → 现在 sema 依赖度 40%+ 是同一陷阱
    difference: 胰岛素是仿制后被价格战吞噬，GLP-1 仍处于新分子涌现期 (reta/CT-388/VK2735)
