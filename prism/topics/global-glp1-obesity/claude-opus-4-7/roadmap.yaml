note: |
  L4 hunting 逐条对齐 thesis_v1 K1-K6（硬规则 workflow 01 Step 2）。
  tier1/2/3 复用 thesis_v1 已写的 12 个 user_todos（P0→tier1, P1→tier2, P2→tier3）。

learning_track:
  l1_orientation:
    - question: GLP-1 全球总市场规模 2024-2030 + 减肥/糖尿病/心衰/OSA 各适应症金额拆分
      addresses: [scope]
      source_hint: GS/MS GLP-1 industry primer / Evaluate Pharma / IQVIA
    - question: 全球分子代际谱 — sema vs tirz vs cagri vs reta vs orfo vs CT-388 vs VK2735 vs HRS9531 vs maz vs MariTide 临床数据 head-to-head
      addresses: [K1, K6]
      source_hint: SURMOUNT / REDEFINE / TRIUMPH / ENITH / VANQUISH 论文 + 各家 IR
    - question: 美国/欧洲/中国/日本 4 大市场支付与医保框架（商保 PBM / Medicare BALANCE / IRA / NRDL / 个人自费 DTC）
      addresses: [K2, K3, K5]
      source_hint: KFF / Health Affairs / CMS / 米内 / 国家医保局
    - question: GLP-1 终端售价 / 净价 / 毛利 / 销售模式（处方 PBM / LillyDirect+NovoCare DTC / HIMS compounded → 品牌）
      addresses: [K3, K5]
      source_hint: NVO/LLY 季报附注 + IQVIA channel data + GoodRx / pharnexcloud

  l2_history:
    - question: GLP-1 临床代际跃迁史（byetta 2005 → 利拉鲁肽 2014 → sema 2017 → 减重 sema 2021 → tirz 减重 2023 → reta/CT-388 2026+）— 减重百分比阶梯 + 安全性
      addresses: [scope]
      source_hint: NEJM / Lancet 综述 + FDA approval letters
    - question: 全球减肥药安全性退市史（西布曲明 / 利莫那班 / 氯卡色林）— 评估 GLP-1 长期安全性边界
      addresses: [scope]
      source_hint: FDA / EMA 撤市公告 + 大型流行病学研究
    - question: NVO vs LLY 2010-2026 拉锯史（胰岛素时代 → GLP-1 时代）— 双 #1 反转节奏
      addresses: [K1, K5]
      source_hint: 两家年报 + 雪球 NVO/LLY 长文 + Bloomberg 复盘
    - question: 中国 GLP-1 政策史（利拉鲁肽中标谈判 → 司美格鲁肽 PTE 争议 → mazdutide 首批 → 仿制大潮）
      addresses: [K3, K4]
      source_hint: 国家医保局 / NMPA / 米内网

  l3_debates:
    - question: LLY 估值能否消化 BALANCE + IRA + 第二梯队 + DTC 四轨同时压价？PE 50x 是否为戴维斯双杀起点？
      addresses: [K2, K5, K6]
      stance_long: 替尔泊肽 unit volume +50% 仍能扛 net price -20%，而 LLY 自有产能 + DTC 控价能力 ≫ NVO
      stance_short: 第二梯队 (CT-388 22.5% / VK2735 12.2%) 已迫近 → estimation cut + multiple compression 双杀
      source_hint: GS/MS LLY 深度 + LLY 季报 + 卖方 BALANCE 敏感性表
    - question: NVO 是否已被 over-sold？amycretin + oral Wegovy + NovoCare DTC + HIMS 合作能否驱动均值回归？
      addresses: [K1, K3]
      stance_long: 当前股价 price in CagriSema 失望 + sema 仿制；amycretin 数据强 + 渠道扩张
      stance_short: sema 全球净价 2026-2028 持续衰减；amycretin 商业化最早 2028
      source_hint: NVO IR + 卖方 NVO 翻多/翻空报告
    - question: GLP-1 终身服药商业可持续性 — 支付方对长期 entitlement 的政治压力会否倒逼定价持续下行？
      addresses: [K2, K3]
      stance_long: 净 medical cost saving (心衰/CV/OSA/CKD) 长期 ROI 正向 → 支付方愿意付
      stance_short: 停药 1 年内反弹 50-70% → 终身付费 → 政府无法承受 → BALANCE 是开始而非终点
      source_hint: KFF / Health Affairs / NEJM cost-effectiveness 综述
    - question: retatrutide 真能续 LLY 下一代护城河？还是只达 22.5% 与 CT-388 持平 → 代际优势消失？
      addresses: [K1]
      stance_long: Phase 2 减重 24.2% 48w；Phase 3 数据预期 ≥25% + CV outcome 阳性
      stance_short: 三靶 GLP-1/GIP/GCG 安全性边际收窄；TRIUMPH-3 顶线若 ≤22.5% → "下一代独占"叙事破裂
      source_hint: TRIUMPH 论文 + LLY Investor Day + 卖方 next-gen GLP-1 横向对比
    - question: 第二梯队收购溢价是否会改变 LLY/NVO 估值锚？Roche CT-388 已是先例
      addresses: [K6]
      stance_long: Big pharma 2026-2027 集中收购（Pfizer/Merck/AbbVie 急需 GLP-1 暴露）→ 二梯队 3-5x 溢价
      stance_short: 临床数据未读出前不收购；Phase 3 失败概率 30-40% → 锁不住溢价
      source_hint: Endpoints / STAT / FierceBiotech M&A 追踪 + Carmot $2.7B 复盘

  l4_hunting:
    - question: K1 — retatrutide TRIUMPH-3 / CT-388 ENITH-1/2 / VK2735 VANQUISH-1/2 三家 Phase 3 数据日历表 + headline 减重百分比谁先谁高？
      addresses: [K1]
      validate_threshold: |
        retatrutide >25% + CV outcome 阳性 → LLY 一家独大叙事保留
        retatrutide ≤22.5% (仅平 tirz 当前) → LLY 下一代护城河存疑
        CT-388 ≥23% 且数据先出 → Roche 抢位 → LLY/NVO 双弱
      timeline_to_resolve: 2026-12 ~ 2027-12 三家 Phase 3 顶线密集读出
      source_hint: ClinicalTrials.gov + 各家 IR 季度披露 + Endpoints/FierceBiotech/STAT

    - question: K2 — BALANCE Model 2026-2027 Medicare/Medicaid 实际加入受益人数 + $245/月对 NVO+LLY 单位营收冲击 + 商保跟价比例
      addresses: [K2]
      validate_threshold: |
        BALANCE 覆盖 >1000 万 + 商保跟价 → 利空兑现
        BALANCE 覆盖 <300 万 + 商保不跟价 → 量大于价压制 → 利好
      timeline_to_resolve: 2026 Q3 起 CMS 月度 enrollment 数据 + 2027 Q1 NVO/LLY 季报跟价披露
      source_hint: CMS 月报 / KFF Tracker / NVO+LLY US net realized price 季度披露

    - question: K3 — sema 2026-2028 全球分国家分渠道 net price 衰减斜率 + NVO sema 总营收 2027 vs 2025 ±多少？
      addresses: [K3]
      validate_threshold: |
        NVO sema 2027 营收 < 2025 → 仿制+IRA+BALANCE 三重压制兑现
        NVO sema 2027 营收 ≥ 2025 → DTC+适应症扩展抵消
      timeline_to_resolve: 2027 Q1 季报（覆盖 2026 全年）即可初判，2028 Q1 终局
      source_hint: NVO 10-K segment + IQVIA Symphony + 米内 sema 仿制价格表

    - question: K4 — HRS9531 全球 Phase 3 启动时点 + mazdutide 2026 季度销售爬坡 + 华东医药利鲁平国内市占率
      addresses: [K4]
      validate_threshold: |
        HRS9531 美国 Phase 3 2026 Q3 前启动 → 恒瑞 $5.7B 里程碑路径打开
        mazdutide 2026 销售 ≥¥15 亿 → 国产 GLP-1 商业化曲线验证
      timeline_to_resolve: 2026 Q3 Kailera 启动 + 2026 H2 信达半年报 + 2026 Q3 华东季报
      source_hint: 恒瑞 IR / kailera.com / 信达半年报 / 华东季报 / 米内分子销售榜

    - question: K5 — LLY 2026-2027 tirzepatide 单位 net price 拆分（list / DTC / PBM rebate / BALANCE 渠道差）+ unit volume 增长是否覆盖跌价
      addresses: [K5]
      validate_threshold: |
        unit volume +50% + unit net price -20% → 营收 +20% → 估值可承受
        unit volume +30% + unit net price -30% → 营收 -10% → 估值杀
      timeline_to_resolve: 2026 Q4 season pass + 2027 Q1 全年指引
      source_hint: LLY 10-Q gross-to-net 附注 + 卖方 channel mix 模型

    - question: K6 — Viking / Structure / Carmot 之后 Big pharma 是否实际收购 GLP-1 biotech？溢价倍数？
      addresses: [K6]
      validate_threshold: |
        Viking 收购溢价 ≥3x ($30 → ≥$90) → 二梯队估值上修 → LLY PE 收敛压力↑
        无收购 + 二梯队继续融资稀释 → LLY 一家独大溢价保留
      timeline_to_resolve: 2026 H2 - 2027 H2（行业 M&A 周期窗口）
      source_hint: Endpoints / STAT / FierceBiotech M&A 跟踪 + 各家 IR

