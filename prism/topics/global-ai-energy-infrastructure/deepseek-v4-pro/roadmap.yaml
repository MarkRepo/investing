key_risks_to_monitor:
  - "AI 效率突破（DeepSeek 效应）导致单位算力能耗大幅下降 → 数据中心电力需求预测下调"
  - "SMR 监管审批延迟或 NuScale 现金耗尽 → SMR 赛道泡沫破裂"
  - "燃气轮机供过于求（GEV/Siemens/Mitsubishi 同时扩产）→ 利润率压缩"
  - "美国州级监管否决 GW 级数据中心项目 → 需求断崖"
  - "天然气价格上涨 → 燃气轮机经济性恶化 vs 可再生能源"

analogies_to_study:
  - name: "2000-2008 中国电力基建爆发（电网投资 + 火电建设）"
    analogy: "经济高速增长→电力需求井喷→电网投资 CAGR 15%+ 持续 8 年→设备商订单积压 3-5 年→估值从 10x→30x。AI 数据中心电力需求的爆发性与当时中国工业化电力需求类似。"
    limitation: "中国是政府主导的基建投资，美国 AI 电力是私营企业需求驱动——政策风险不同。但设备商的受益逻辑相通。"
  - name: "2011-2021 全球核电衰退（福岛后）"
    analogy: "福岛事故后全球核电进入 10 年寒冬——Siemens 退出核电、Toshiba/Westinghouse 破产。当前 SMR 核电复兴叙事与 2000 年代初的'核电复兴'（福岛前）高度相似——历史可能重复。"
    limitation: "SMR 的被动安全设计理论上比传统反应堆安全得多，监管框架（NRC Part 53）也已更新。但'业界说这次不一样'永远是危险信号。"
  - name: "2015-2020 美国 LNG 出口终端建设潮"
    analogy: "页岩气革命→LNG 出口终端建设潮→工程承包商（Bechtel/Fluor）和设备商（GE/Baker Hughes）享受多年订单可见性。AI 数据中心电力基础设施建设可能类似——需求确定、周期长、参与者少。"
    limitation: "LNG 终端是出口导向（全球需求），数据中心电力是内需导向——需求来源不同。但'大型基建项目→设备商多年受益'的逻辑相同。"