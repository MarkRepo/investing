analogies_to_study:
  - name: Seagen 2014-2018 ADC 浪潮 + 2023 Pfizer 430 亿$ 收购
    similarity: 单管线 ADC 公司从烧钱研发 → BD 出海 → 巨型并购的资本路径；与 RC48/RC148 路径高度同构
    divergence: Seagen 是 first-in-class 创新（Brentuximab），荣昌是 fast-follower（HER2 ADC + PD-1×VEGF）；Seagen 估值溢价更高、研发投入更分散
    use_for: K1/K4 估值天花板对照、BD 现金兑现率历史基线
  - name: 君实生物 2020-2024 PD-1 出海 + 礼来/Coherus 合作
    similarity: 中国 PD-1 龙头出海 → 早期 BD 估值高 → 实际里程碑兑现率仅 10-20%
    divergence: 君实 BD 对手 Coherus 兑付能力远弱于 AbbVie；荣昌 BD 总额绝对值大（56亿$ vs 君实 11亿$）
    use_for: K1 RC148 49.5 亿里程碑实际兑现率折扣计算
  - name: 信达生物 2022-2025 信迪利单抗 FDA 失败 + 国内化 + mazdutide 出海
    similarity: 港股+A股双重市场创新药 + 国内放量 + 出海重启路径
    divergence: 信达没有 ADC 大单 BD；信达 mazdutide 出海路径不同（自营 vs 授权）
    use_for: K4 估值消化路径 + 港股 A 股折溢价机制

