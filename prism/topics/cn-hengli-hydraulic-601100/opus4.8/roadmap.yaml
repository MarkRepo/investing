key_risks_to_monitor:
  - 汪立平留置事件升级至上市公司层面（资金占用/资产牵连/易主）— K9
  - PRS长期停留送样、被双林/新剑/五洲新春纯玩家抢占定点 — K1
  - 后续季度净利增速持续跑输营收（毛利趋势下行确认）— K8
  - 工程机械主业周期反转（挖机内销回落/出口受阻）— K7
  - 再融资稀释（机器人投入若需大额定增）— K6/环②

analogies_to_study:
  - 案例: 三花智控 / 汇川技术（汽车/工控龙头成功切入机器人第二曲线）
    类比逻辑: 制造know-how迁移+厚基本盘+期权兑现的成功范式
    类比局限: 三花热管理/汇川电控与恒立液压→丝杠的工艺迁移距离不同
  - 案例: A股"蹭机器人概念"回吐股（叙事定价后未兑现）
    类比逻辑: PE先付机器人溢价、期权证伪后估值回归
    类比局限: 恒立有真实液压主业+近零负债做下行垫，非纯蹭概念
  - 案例: 实控人被查/留置对上市公司的历史冲击样本
    类比逻辑: 治理黑天鹅传导渠道（战略中断/资金占用/易主）
    类比局限: 每案牵连程度差异大，需看官方定性是否涉公司
