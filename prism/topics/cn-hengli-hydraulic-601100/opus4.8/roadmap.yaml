# L1/L2 已坍缩进 primer_scope（背景理解交给 00_primer）
primer_scope: >
  00_primer 该覆盖：液压油缸/泵阀马达在挖机中的作用与恒立护城河来源（打破 KYB/川崎垄断）；
  行星滚柱丝杠(PRS)是什么、在人形机器人线性关节里为何是"最值钱环节"(~占Optimus成本30%)；
  滚珠丝杠 vs PRS vs 谐波/RV减速器技术定位与门槛；PRS 量产核心壁垒（螺纹磨削精度/良率C3-C5/磨床卡脖子）；
  恒立液压能力向丝杠迁移的逻辑与真实可复用度边界；主业周期属性（挖机/地产/基建/更新周期）；
  财务质量为何在工程机械链里罕见（毛利41.6%/近零负债/高ROIC来源）；PRS赛道竞争格局与恒立相对位
  （纯玩家双林/新剑/五洲新春/恒而达 vs 恒立"厚基本盘+期权"型）；特斯拉Optimus供应链("O链")结构与恒立
  真实位置（送样 vs Tier1）；机器人期权对估值的双面性；实控人留置类治理事件对上市公司的传导渠道与可观测信号。

learning_track:
  # L3 争议层 → 喂决策链环④（多空分歧、共识可能错在哪）
  l3_debates:
    - question: 汪立平留置是止于个人层面，还是会传导至上市公司（资金占用/资产/战略连续性中断/机器人投入放缓/易主）？市场已反弹至市值1432亿是否消化过度或不足？
      source_hint: cninfo/sse 601100 公告流 + 监察委官方通报 + 财经媒体后续跟踪
      why: 反方观点1（最重·治理黑天鹅）；厚基本盘"稳态"假设的前提
    - question: PE51.7x/PS12.2x 隐含多少机器人期权溢价？机器人仍处"送样"（对营收贡献<5%）而估值先付——若PRS慢兑现，溢价回吐幅度多大？
      source_hint: 卖方分部估值/SOTP模型 + 纯玩家(双林/新剑)估值对照 + 历史PE-Band
      why: 反方观点2（叙事已定价 vs 期权未证实）；环④EV核心分歧
    - question: 2026Q1 营收+32.5%/归母净利+5.59% 的背离——是费用前置/丝杠扩产投入（一次性、可接受）还是毛利趋势下行/价格战（趋势性、伤基本盘）？FCF从2024的14亿降到2025的8.87亿的原因？
      source_hint: 2025年报+2026Q1季报成本/费用/现金流拆分 + 卖方点评
      why: 反方观点3（盈利质量裂缝）；基本盘成色的直接证据
    - question: 液压精密制造know-how（冷拔管/珩磨/热处理）迁移到丝杠螺纹磨削的真实可复用度有多高？"再造一个恒立"是可兑现路径还是叙事？相对纯玩家弹性是否被百亿液压基数摊薄？
      source_hint: 华创/华西/浙商深度研报 + 五洲新春vs恒立丝杠精度对比 + 产业链工艺对比
      why: 反方观点4（弹性不如纯玩家）+ 护城河可迁移性争议；环①核心

