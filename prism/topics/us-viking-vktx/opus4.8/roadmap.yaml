key_risks_to_monitor:
  - VANQUISH-1/2 topline(2027) 减重不及针剂龙头或 AE 停药率升高 → 独立价值与并购价值同崩(腰斩)
  - pivotal 读出前深度折价增发 → 摊薄侵蚀每股期权价值
  - 具名买家明确退出/自研填补缺口 → 并购期权大幅贬值、估值回落独立 DCF
  - 口服腿净值转负 → 从差异化资产变"烧钱难变现"负债、加重稀释命门
  - 竞品(orforglipron 商业放量/aleniglipron 三期领先)挤压独立商业化空间

analogies_to_study:
  - 案例: CagriSema(Novo/减重/2024-12 + 2026-02 两次失望)
    类比逻辑: 高预期减重药 pivotal/关键读出不达预期→单日崩盘的二元风险剧本；VKTX pivotal miss 的镜像
    类比局限: CagriSema 是已上市巨头的次世代资产、非纯 biotech；VKTX 是单资产弹性池、下行有现金/管线残值托底
  - 案例: Pfizer danuglipron(口服小分子GLP-1/2023-2025 受挫)
    类比逻辑: 口服减重资产因耐受性/剂量问题受挫→口服腿差异化叙事崩塌；VK2735 口服净值风险的镜像
    类比局限: danuglipron 是 BID 给药耐受差的早期失败；VK2735 口服已有 12.2%/13周 数据、给药与机制不同
  - 案例: Metsera(被 Pfizer $10bn 收购/2026/早期 obesity 资产竞价战)
    类比逻辑: obesity 后期/干净资产的并购拍卖期权定价锚；VKTX 上行情景的正向镜像
    类比局限: Metsera 更早期(Pfizer 付溢价抢时间)，VKTX 更后期(pivotal 二元未消)——买家风险偏好不同
