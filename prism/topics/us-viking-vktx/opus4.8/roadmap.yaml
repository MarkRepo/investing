# L1/L2 坍缩为 primer_scope（背景深度交 00_primer 承担；roadmap 只驱动 L3/L4 收料）
primer_scope: >
  primer 该覆盖：GLP-1/GIP 双激动剂 vs 单GLP-1/三激动剂机制差异；皮下 vs 口服减重药开发/商业/耐受差异
  与"口服圣杯"含义；临床期 biotech 价值来源(风险调整 NPV + 并购期权)与市值跳动机理；VK2735 皮下/口服两条腿
  进度与竞争位置；减重 III 期读什么(减重%/AE停药率/维持)与二元性；减重竞争地图(LLY/Novo 双寡头 + 追赶者 +
  小 biotech 弹性池)与 VKTX 位置；obesity 并购逻辑(Metsera 案例)；VKTX 现金/烧钱/runway/稀释机制；
  VK2735 vs VK2809(MASH)/VK0214(X-ALD) 价值权重；THR-β 平台；维持研究与长期用药经济性；如何读 biotech 分析师目标价。

learning_track:

  # 争议层：多空分歧在哪、共识可能错在哪（喂决策链环④）
  l3_debates:
    - question: 市场把 VKTX 当"皮下 pivotal 期权 + 并购标的"定价，还是已把口服腿受损/稀释风险充分 price in？$4.33B 隐含的成功概率是多少？
      source_hint: 卖方目标价模型(25家/聚合~$95) + 市值史(2024峰值~$9-10B→$4.33B) + WMBT 反推
    - question: 皮下 VK2735 13周 14.7% 的斜率是"接近 best-in-class 真资产"，还是短疗程幻觉——78周长疗程疗效平台/GI耐受衰减是否被低估？
      source_hint: VENTURE PMC论文 + 替尔泊肽/司美长疗程对照 + VANQUISH extension 设计
    - question: 街炒 $20B 收购的买家动机是否已被自研(orforglipron已批/retatrutide/MariTide)或并购(Pfizer拿Metsera)填补，VKTX 是否已非刚需？
      source_hint: 逐买家(LLY/Pfizer/Novo/Amgen/Roche/AZ)管线缺口盘点 + Metsera成交条款
    - question: 口服腿在 Foundayo(已批) + aleniglipron(44周-16.3%) 夹击下是差异化资产还是无差异跟随者——净值符号是正是负？
      source_hint: VK2735口服 vs orforglipron vs aleniglipron 头对头效力/耐受/机制对照
    - question: pivotal 读出前(2027)是否必然增发稀释？$603M runway 名义到 2028 但同跑 VANQUISH-1/2+口服三期+维持，market timing 风险多大？
      source_hint: Q1'26 烧钱轨迹(净亏$158M) + Lian 历次融资时点/定价史 + runway 结构

  # 狩猎层：找错误定价，逐条对齐 thesis Killer Question
  l4_hunting:
    - question: VANQUISH-1/2 皮下78周减重是否 ≥15%(安慰剂调整)且 AE 停药率 <15%？市场当前隐含的成功概率是多少，13周→78周衰减风险如何定价？
      addresses: [K1]
      search_keywords: [VK2735 VANQUISH 三期设计, VENTURE 减重曲线, tirzepatide 78周耐受]
      source_hint: clinicaltrials.gov VANQUISH-1/2 全文 + VENTURE PMC论文 + IR extension 公告
    - question: 2026-2027 是否出现实质要约/管理层松口卖身/具名买家尽调？隐含 EV 落 $10B/$15B/$20B 哪档，Metsera $10bn 成交为 VKTX 设的可比锚是否成立？
      addresses: [K2]
      search_keywords: [VKTX 并购 传闻, Pfizer Metsera 条款, obesity biotech M&A 溢价]
      source_hint: Pfizer-Metsera 公告 + 街头号标的报道 + 历史减重并购 premium 中位
    - question: pivotal 读出前是否增发？规模/定价折让/摊薄股数——$603M runway 是否真到 2028 不需补，Lian 资本配置史暗示独立还是卖身倾向？
      addresses: [K3]
      search_keywords: [VKTX 增发 历史, Viking runway 现金, Brian Lian 融资]
      source_hint: 10-K/10-Q 现金流+股数史 + DEF14A + earnings call transcript
    - question: VK2735 口服三期是否如期 4Q26 启动，相对 Foundayo(已批)/aleniglipron(16.3%) 是否仍有可辩护差异化(疗效上限/耐受/双激动剂)？口服净值符号？
      addresses: [K4]
      search_keywords: [VK2735 口服 12.2%, aleniglipron ACCESS II, orforglipron ATTAIN 对照]
      source_hint: ECO2026 poster + Structure/LLY IR + 口服头对头效力/耐受对照
    - question: VK2735 维持给药试验(2026读出)停药后体重反弹曲线与维持剂量耐受性是否支持长期用药标签与商业经济性？
      addresses: [K5]
      search_keywords: [VK2735 维持 试验, GLP-1 停药 反弹, obesity maintenance dosing]
      source_hint: IR maintenance trial 公告(启动2025-10-21/入组完成2026-01-08) + clinicaltrials.gov

