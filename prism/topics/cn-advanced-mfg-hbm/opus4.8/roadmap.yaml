key_risks_to_monitor:
  - 中芯7nm良率证伪（~30%传言若坐实）+ ROIC长期低位 → 命门3翻盘
  - 澜起等龙头估值透支，最确定铲子安全边际收窄 → 命门2买点纪律
  - 「华为自研HBM」稀释长鑫价值捕获 → 命门1价值归属
  - 芯片层需求不及预期（H20/B30/智算中心闲置）→ 上游过剩
  - 出口管制HBM成品端进一步收紧 or 设备端意外松动改变竞争格局

analogies_to_study:
  # 落成 historical-mirror 收料（O3 接线，喂决策链环⑤）—— 父级已复用，本 arena 用 arena-mirror code
  - name: 中国面板/京东方（份额登顶但ROIC长期低迷）
    logic: 国产替代份额兑现≠利润兑现，重资产+价格战吞噬回报
    limit: 面板是完全竞争大宗品，先进制程/HBM/接口有更强技术壁垒与管制护城河，未必同样内卷
    mirror_material: 父 [mat-1d1f97]（已复用，addresses K4）
  - name: DRAM存储周期（三星/海力士/长鑫追赶）
    logic: 存储是强周期重资产，后发者靠份额难赚钱，价格由龙头产能节奏主导
    limit: HBM因AI需求呈结构性紧缺+对华管制制造隔离市场，国产HBM短期定价环境优于普通DRAM
    mirror_material: 长鑫招股书深度 [mat-080ac4] 含存储行业周期镜鉴

