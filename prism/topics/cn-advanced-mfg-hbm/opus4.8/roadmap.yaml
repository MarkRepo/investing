# L1/L2 坍缩为一行 primer scope（背景理解交给 00_primer，见 S2/附录A2）
primer_scope: >-
  primer 该覆盖：上游制造链分层（先进制程代工→存储/HBM→先进封装→载板→内存接口/高速连接→设备材料）、
  各层商业模式与盈利质量差异、"卖铲人"逻辑、HBM/先进封装/ABF载板/内存接口机理、
  超节点系统战 vs 单颗先进制程两条路线、出口管制双向影响、"份额≠利润"产业规律、各环节可观测兑现信号。
  详见 decomposition_v0 §三 12 条 primer 入门目标。

