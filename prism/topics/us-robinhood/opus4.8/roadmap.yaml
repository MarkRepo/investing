key_risks_to_monitor:
  - 加密收入再现 ≥30% 同比/环比下滑且交易总收入未被期权/期货/预测市场补上（总营收转负/个位数）→ 多元化平滑论证伪（K4 命门）
  - NII 连续两季同比转负（余额增长不再对冲降息）→「准经常性」腿证伪（K3）
  - SEC（Atkins）重启 PFOF 限制立法/规则 → 商业模式根基动摇（K1 命门）
  - EPS 连续 miss guidance（如 Q2 < $0.40）→ 增长叙事受损，34x 倍数难维持（K2/K6）
  - 事件合约量连续两季环比下滑 ≥20% 或遭 CFTC 实质限制 → 新引擎熄火（K7）
  - Gold 订户净增连续两季放缓至 <20% YoY 或 ARPU 同比转负 → 订阅飞轮失速（K5）

analogies_to_study:
  - case: HOOD 自身 2021→2022（美国·零售券商·$38→$7）
    logic: 同一标的，meme 热潮后交易量退潮 + 倍数压缩双杀，高 beta 实证样本
    limitation: 彼时无多元化基本盘（NII/Gold/预测市场），盈利结构已不同——正是本次 thesis 的核心争点
    ring: historical-mirror
  - case: Coinbase 2021→2022（美国·加密交易所·暴跌 ~85%）
    logic: 加密 volume 周期退潮如何摧毁高估值交易平台盈利与倍数
    limitation: COIN 纯加密敞口，HOOD 加密仅占交易收入一部分——对冲程度待 K4 量化
    ring: historical-mirror
  - case: 嘉信 Schwab 2023 现金 sorting 危机（美国·全能券商）
    logic: 利率快速变动下客户现金搬家侵蚀 NII，券商「类银行」收入腿的脆弱性
    limitation: HOOD 规模/久期错配结构不同，但 NII「准经常性」叙事面临同类利率风险
    ring: historical-mirror
