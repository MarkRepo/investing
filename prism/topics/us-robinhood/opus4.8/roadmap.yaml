      search_keywords: [Order Competition Rule 撤回, SEC Atkins PFOF, Reg Best Execution 现状]
      source_hint: SEC.gov 规则页 / 卖方法规 note / HOOD 10-K item_1A
    - question: HOOD 营业杠杆兑现度——逐季 opex/收入比与 EPS 兑现 guidance（Q2 $0.45 / Q3 $0.50）的概率？盈利质量是否被一次性项目美化？
      addresses: [K2]
      search_keywords: [HOOD opex 杠杆, EPS guidance 兑现, 一致预期目标价]
      source_hint: 10-Q item_2 MD&A + 业绩会 + 卖方 consensus
    - question: 收入三分（交易 PFOF / NII / 订阅其它）逐季占比趋势 + NII 利率敏感度（每 25bp）——非交易腿能否平滑交易周期？
      addresses: [K3]
      search_keywords: [HOOD 收入分部, NII 利率敏感度, 净存入余额]
      source_hint: 10-Q item_2 MD&A 分部 + item_3 quant_risk + 10-K item_7A
    - question: 加密收入季度序列 + 占交易收入比 + 与 COIN 同期加密营收对比——加密去化是否被其它腿补上（总营收 beta 拆解）？
      addresses: [K4]
      search_keywords: [HOOD 加密收入 季度, Coinbase 营收 对比, 交易收入 拆分]
      source_hint: HOOD 10-Q + COIN 10-Q（已在 materials/sec）+ 财报
    - question: Gold/退休金/Legend/Banking/Strategies 的订户/AUC/ARPU 与留存——产品飞轮兑现度？
      addresses: [K5]
      search_keywords: [Robinhood Gold 订户, ARPU 退休金, Strategies AUC]
      source_hint: 业绩会 + 10-K item_1 business + IR deck
    - question: HOOD vs SCHW/IBKR/COIN 估值横比（PE/PS/ROE/ROIC + 历史区间）+ beta/回撤情景 + 卖方目标价分布（$79.79-$164）模型假设？
      addresses: [K6, K2]
      search_keywords: [HOOD 估值 横比, HOOD 目标价 分布, beta 回撤 情景]
      source_hint: market_data + 3-5 份卖方深度 + 4 套竞品 10-K（已在 materials/sec）
