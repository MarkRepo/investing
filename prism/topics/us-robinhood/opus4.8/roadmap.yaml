learning_track:

  # ---- L3 争议层：分歧在哪，各方逻辑（喂决策链环④ 多空）----
  l3_debates:
    - question: 多元化「平滑论」真伪——非交易收入（NII + Gold/订阅）究竟是逆周期对冲，还是又一堆顺周期品类的叠加？
      source_hint: 10-Q item_2 MD&A 收入分部逐季 + 业绩会 Q&A；Q1 反例（加密 -47% 但总营收 +15%）vs 隐忧（NII 增长靠余额非利差）
    - question: PE 34.6 + beta 2.29 在「市场/加密转熊」下行情景，是错杀后的安全边际，还是合理甚至偏贵？
      source_hint: 与 IBKR/SCHW/COIN 横比 PE/ROE/利息效率；下行情景盈利弹性 × 倍数弹性双杀幅度
    - question: NII「准经常性」叙事是否被高估——降息周期下单位 NIM 终将承压，余额增长能撑多久？
      source_hint: 10-K item_7A / 10-Q item_3 利率敏感度披露（每 25bp 影响、sweep/margin/证券出借余额）
    - question: 新增长引擎（预测市场/加密/期权）本质是否都是「顺周期高频」——所谓多元化是否在最需要时一起失灵？
      source_hint: WSJ「预测市场波动大」+ 各引擎与市况相关性；CFTC 对事件合约的潜在限制
    - question: PFOF 监管在 Atkins SEC 下究竟「撤回/永久搁置/仍悬」——商业模式根基是否真安全？
      source_hint: SEC.gov 规则页 Order Competition Rule / Reg Best Execution 现状 + HOOD 10-K item_1A 风险因子

  # ---- L4 狩猎层：找错误定价，逐条对齐 thesis Killer Question ----
  l4_hunting:
    - question: SEC（Atkins）是否已正式撤回/永久搁置 Order Competition Rule 与 Reg Best Execution？市场隐含的 PFOF 存续概率？
