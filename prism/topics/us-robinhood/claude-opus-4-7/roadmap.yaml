key_risks_to_monitor:
  - "PFOF 监管：Trump SEC 任期内意外重启 OCR 推进，或 2028 大选后民主党回归再启动"
  - "加密 cycle：BTC 跌破 $60K 持续 2+ 季度，HOOD 加密季度收入跌破 $100M（Q1'26 已 $134M）"
  - "Event Contracts：2027 大选后 demand 断崖，+320% YoY 增速跌至个位数"
  - "Schwab/Fidelity 推出加密+预测市场+AI 投研对标 + 大规模用户补贴 → HOOD 差异化收窄"
  - "Gold 订阅增速跌破 +15% YoY → 订阅飞轮天花板早于预期到来"
  - "美联储 2026-2027 累计降息 ≥150bp → net interest revenue 受冲击（margin book $17B 有部分对冲）"
  - "Bitstamp 整合协同效应不达预期 → take rate 提升 <50% → 加密垂直整合证伪"
  - "管理层减持持续放量（Steadview Q2'26 已减持）→ 市场信心动摇"

analogies_to_study:
  - name: "Charles Schwab 1992-2008 — 折扣券商向全栈金融转型"
    analogy: "SCHW 从纯交易券商（1990s 早期）→ 整合 mutual fund supermarket（OneSource 1992）→ 共同基金管理（1998 收购 USTrust）→ 银行业务（2003）→ 净息收入主导（2008+）。HOOD 当前 2025-2026 阶段类似 SCHW 1996-2000：从交易工具向多产品平台演化，加密/Banking/Strategies/Cortex 对应 SCHW 当年的 OneSource/银行/资管。若复制 SCHW 路径，HOOD 未来 10 年有望从 PE 35x 经历短期均值回归后重估到稳定 PE 25-30x（vs SCHW 长期 PE 20-25）"
    limitation: "HOOD 用户基数仅 27.4M Funded（SCHW 当年类似阶段 7-10M），AUM $307B 仅 SCHW 当年 $1.5T 的 ~20%——平台扩展空间存在但绝对体量小一个数量级；且 SCHW 当年没有加密 cycle 风险"

  - name: "Coinbase (COIN) 2021-2024 — 加密 cycle 估值过山车"
    analogy: "COIN 2021-04 IPO $381 → 2021-11 peak $429 → 2022-12 低点 $33（-92%） → 2024 回升至 $200+ → 2026 ~$300。HOOD 加密收入占比 2021 Q2 峰值 ~50%（vs COIN 100% 加密暴露），2026 Q1 已降至 12.5%——但 HOOD 加密 cycle 弹性仍显著，COIN 的暴跌路径警示 K2 风险落锤后的估值幅度"
    limitation: "HOOD 多元化对冲深度远超 COIN：Net interest 33% / Options 24% / Event Contracts 14% / Equities 8% / Gold 5% / Other 4%——加密风险敞口仅 12.5%，整体 beta 远低于 COIN"

  - name: "Block (SQ) 2018-2024 — 多产品金融超级 App 估值演化"
    analogy: "SQ 2018-2021 Cash App 加密/股票/银行多元化叙事推 PE 至 80-120x → 2022-2023 多元化故事破灭 PE 跌至 15-20x → 2024 趋稳。HOOD 当前 2025-2026 类似 SQ 2020-2021——多元化叙事强、PE 35-37 已较高；若 Event Contracts/Banking 不达预期，可能复制 SQ 估值压缩路径"
    limitation: "HOOD 用户更聚焦（投资 vs SQ 支付+商户），且加密业务 Bitstamp 提供真正的差异化技术资产（SQ 仅 Cash App 接入 BTC，无独立交易所）；用户 LTV 显著更高"
