key_risks_to_monitor:
  - 头部车厂集体推迟 SOP（K1 触发）
  - 液态电池超预期降本（K2 触发）
  - 一线半固态车型出现安全事故（K4 触发）
  - 头部美国玩家破产/被收购（K5 触发）
  - 中国氧化物路线在 2027 前未实现量产突破（K3 反方触发）

analogies_to_study:
  - case: 液态锂电 2009-2015（从样品到量产的 5-7 年窗口）
    relevance: 时间表很像——固态可能也是 2025-2031 的相似窗口
    limit: 液态成功时是从"无"到"有"，固态是与"已成熟液态"竞争，难度更大
  - case: 钙钛矿光伏 2021-（明星新材料叙事兴奋 vs 工程瓶颈）
    relevance: 资本周期形态相近——技术叙事先行、装车/装机数据滞后
    limit: 钙钛矿主要是稳定性问题，固态主要是固固界面+量产工艺问题，工程难点不同
  - case: 氢燃料电池历次过山车（30 年间多次叙事-退潮循环）
    relevance: 最像"硬骨头"——技术原理早已成熟，但工程化反复挫败；为投资者上了一堂"不要相信第一个时间表"的课
    limit: 氢燃料电池受加氢站基建拖累，固态是电芯本体工艺问题，瓶颈位置不同
