  geo: US
  question: SanDisk (SNDK, Nasdaq, US, deep)：赌这是 NAND 上行周期叠加 AI 企业级 SSD(eSSD) 结构性需求下的买入机会。核心命门=NAND
    供需/价格拐点的持续性 + SanDisk 相对铠侠/三星/SK海力士的成本与技术位;共识押 HBM 抢产能挤 NAND 供给推涨价,我要验证这轮涨价是周期性补库还是结构性,以及
    2025 分拆后独立资本开支纪律与铠侠JV关系。买/卖方向与目标价赌注待 prescan+估值校准。
