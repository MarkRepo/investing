# 历史类比 → 落成 historical-mirror 收料 todo（O3 接线，喂决策链环⑤）
analogies_to_study:
  - case: AbbVie / Humira 专利悬崖（美国 2023 生物类似药侵蚀）
    parallel: 单一重磅药占公司收入大头、峰值后被生物类似药快速侵蚀——映射 LLY GLP-1 集中度风险
    limitation: Humira 是单分子单适应症；LLY 是多分子（注射+口服+三靶点）多适应症组合，护城河更宽
  - case: Gilead / HCV（Sovaldi/Harvoni 治愈型药物销售断崖）
    parallel: 极速达峰后极速衰退——警示"高增长不等于高耐久"，市场对峰值后曲线的误判
    limitation: HCV 是治愈型（治好即流失存量），GLP-1 是慢病长期用药、复购属性强，断崖逻辑不直接套用
  - case: 高估值成长股增速换挡杀估值（如疫情红利股 / 2000 年高 PE 成长股 de-rate）
    parallel: ~31x forward 对 50% 增速看似便宜，但"便宜"建立在增速延续假设——增速换挡时 PEG 重定价
    limitation: LLY 有真实在售现金流与第二曲线，非纯叙事估值；de-rate 幅度应小于无盈利成长股
