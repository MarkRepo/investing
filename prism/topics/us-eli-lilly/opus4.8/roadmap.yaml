primer_scope: >
  00_primer 须覆盖：制药/incretin 赛道边界与参与者（LLY/Novo 双寡头 + 第二梯队）、
  GLP-1/GIP/glucagon 多靶点机制与效力梯队（注射~20% / 口服~12% / 三靶点~28.7%）、
  LLY 收入结构（GLP-1 占比~65%）与从胰岛素老业务到 GLP-1 的转型曲线、
  减重药支付/可及性链条（商保 vs Medicare GLP-1 Bridge vs 自费）、
  GLP-1 之外第二曲线资产（Kisunla/Verzenio/免疫管线）量级、
  当前估值水位（~31x forward、~$1T 市值）在制药/成长股里的位置、
  减重药安全性争议（NAION/肌肉流失/停药反弹）现状与未决性、
  专利悬崖与口服化对长期 franchise 的侵蚀路径。

learning_track:
  # L3 争议层 → 喂决策链环④（多空分歧、共识可能错在哪）
  l3_debates:
    - question: >
        减重市场会随"口服化 + 仿制 + 竞争"结构性商品化，还是 LLY/Novo 高利润双寡头
        维持 5-10 年？口服 orforglipron ~12% 效力远低于注射 ~20%——市场是会分层为
        "低价口服走量 + 高价注射保效"（拖低整体 ASP），还是口服扩 TAM 而注射守高利润？
      source_hint: 卖方 incretin 单位经济模型 + IQVIA 处方份额序列 + net price 历史；命门1 主战场
    - question: >
        ~$1T 市值 / ~31x forward 是否已计入"高增长延续到 2028+"？56% 同比数学上必然回落，
        若 2027-2028 增速从 40%+ 降到 15-20%，是否触发成长股最痛的"增速换挡杀估值"？
        市场对"减重 TAM $1000 亿+"的乐观若被支付/可及性现实打折，叙事会松动到什么程度？
      source_hint: 卖方一致预期 trend + 估值拆分（隐含 CAGR/终值PE）；命门3 收口
    - question: >
        $50B+ 美国产能超级周期是放量杠杆还是折旧拖累？为追需求砸的 4 新厂 + 德州 API，
        一旦口服化/竞争使注射需求或价格回落，新厂折旧会否从"放量杠杆"变"毛利拖累"
        （制药版"周期顶建厂"）？产能利用率与 performance margin 守得住 50% 吗？
      source_hint: 年报 capex 明细 + 投产时间表 + 卖方产能/利用率模型；命门2/环②
    - question: >
        第二曲线是真接棒还是 LLY = 单一 GLP-1 豪赌？retatrutide/Kisunla/肿瘤免疫管线
        能否在 GLP-1 增速换挡时提供新增长极？任一非 GLP-1 资产 2027 前做到年销 >$3B 增量？
        管线 readout 时间/结果是训练知识盲点最大处（薄拆解最弱环）。
      source_hint: retatrutide P3 时间表 + Kisunla 放量曲线 + 并购管线 readout 日历；命门2
    - question: >
        政策/安全性尾部：Medicare GLP-1 Bridge 2027 到期后转常规覆盖还是收回？IRA 第二批
        是否纳入更多 LLY 产品长期压利润？NAION/肌肉流失/停药反弹是否升级为 FDA 标签/REMS
        或触发需求逆转？低概率但高杀伤——美国 TAM 天花板会否被下压？
      source_hint: CMS 后续规则 + IRA 名单 + FDA 安全行动 + 真实世界停药率；环⑤ signpost

  # L4 狩猎层 → 喂 K#（逐条对齐 thesis Killer Question，找错误定价）
  l4_hunting:
    - question: >
        orforglipron 口服上市后 18-24 月内，Zepbound/Mounjaro 净价(net price)与 incretin
        市场份额走向如何？若注射净价年降 >15% 或 LLY+Novo 合计份额跌破 80%，则"高利润双寡头"被证伪。
      addresses: [K1]
      search_keywords: [GLP-1 净价 趋势, Zepbound net price rebate, incretin 市场份额 IQVIA]
      source_hint: 季度净价披露 / IQVIA 处方份额 / SSR Health net price 序列（多半付费）
    - question: >
        $50B+ 新产能（4 新厂 + 德州 API）的投产时间表与产能利用率？若 2027-2028 出现
        "产能到位但需求/价格回落"，毛利率/performance margin 从当前高位回撤 >5pct。
      addresses: [K2]
      search_keywords: [Lilly 50B capex 投产时间, 礼来 德州 API 产能, performance margin 50%]
      source_hint: 10-K MD&A capex 明细 + 卖方产能模型 + 新厂 SOP 时间
    - question: >
        retatrutide Phase 3 完整读出 + 适应症外延（MASH/OA/CV/HFpEF）能否如期？Kisunla
        阿尔茨海默放量曲线？任一非 GLP-1 资产 2027 前年销 >$3B 增量？全部延迟则 = 单一 GLP-1 豪赌。
      addresses: [K3]
      search_keywords: [retatrutide Phase 3 读出 时间, Kisunla 销售 放量, Lilly 管线 readout 2026 2027]
      source_hint: ClinicalTrials.gov + Lilly IR + 卖方管线跟踪
    - question: >
        2026-2027 营收/EPS 兑现 vs 指引（$80-83B / EPS $35.5-37），卖方一致预期修正方向？
        若连续两季 miss 指引或增速从 40%+ 骤降到 <15%，~31x forward 的成长定价被证伪。
      addresses: [K4]
      search_keywords: [Lilly 2026 指引 EPS, LLY 一致预期 修正, 礼来 forward PE 估值]
      source_hint: 季度业绩 vs 指引 + 卖方一致预期 trend + performance margin 守稳
    - question: >
        Medicare GLP-1 Bridge 2027 到期后是否转常规覆盖/收回？IRA 第二批是否纳入更多 LLY 产品？
        NAION/肌肉流失等安全信号是否触发 FDA 标签/REMS 或需求逆转？任一向坏 = 美国 TAM 天花板下压。
      addresses: [K5]
      search_keywords: [Medicare GLP-1 Bridge 2027, IRA 谈判 第二批 名单, GLP-1 NAION FDA 安全性]
      source_hint: CMS 规则 + KFF 政策评论 + FDA 标签 + NANOS/AAO 共识

