key_risks_to_monitor:
  - 极端估值下任一增速/毛利证伪触发戴维斯双杀
  - Q1 一次性收益掩盖主业真实增速（扣非含金量）
  - CXL 商用继续延后 / Retimer 被 Astera 压制，第二曲线放量不及预期
  - 前五大客户 77% + 境外 71.6% 的集中/地缘敞口
  - A/H 情绪定价透支，折溢价剧烈波动

analogies_to_study:
  - 案例: Astera Labs（美国·PCIe Retimer/CXL 互连芯片·2024 IPO–2026）
    类比逻辑: 同赛道龙头，AI 互连高成长高估值，上市后股价暴涨暴跌
    类比局限: 纯 fabless 互连、无内存接口现金牛，估值波动更极端
  - 案例: A 股半导体高估值成长股（兆易创新/圣邦股份等·2020–2022 周期）
    类比逻辑: 内存/模拟高 PE 在周期与流动性回落中的消化/双杀过程
    类比局限: 澜起 moat 更强、寡头格局更稳，杀估值幅度或较小
  - 案例: 澜起自身 2021–2023 内存周期下行（营收从高点回落）
    类比逻辑: 内存接口生意对服务器/DRAM 周期的敏感性镜鉴
    类比局限: 当前 AI 互连第二曲线为过去所无，周期敏感性或被稀释
