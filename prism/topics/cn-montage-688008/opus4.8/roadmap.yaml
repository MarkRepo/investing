      search_keywords: [澜起 前五大客户 占比, 澜起 境外收入, 澜起 AH 折溢价]
      source_hint: 2025 年报客户/地区分部 + A/H 行情
    - question: PCIe Switch 战略转向的收入/客户支撑？"暂缓部分 AI 芯片开发"放弃了什么、机会成本多大？
      addresses: [K5]
      search_keywords: [澜起 PCIe Switch 产品, 澜起 暂缓 AI 芯片, 运力芯片 战略]
      source_hint: 业绩说明会 + 投资者关系记录 + 研发投入拆分

