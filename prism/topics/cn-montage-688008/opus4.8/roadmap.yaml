primer_scope: >-
  primer 该覆盖：内存接口芯片(RCD/DB)是什么、装在哪(服务器 RDIMM/LRDIMM)、DDR 世代升级如何量价齐升；
  全球三强寡头格局与 JEDEC/原厂认证壁垒；四款 AI 互连新品(MRCD/MDB、PCIe Retimer、CKD、CXL MXC)各自用途；
  内存接口 vs HBM 的区别(为何非 HBM 概念股)；fabless 轻资产模式双面性；全球生意客户结构；A+H 两地上市基本含义。

learning_track:
  l3_debates:
    - question: 极端估值(A股 TTM PE 三位数 / 港股市值超 6000 亿)是否已透支未来 3 年增长？牛熊双方对合理估值中枢的分歧在哪？
      source_hint: 卖方估值表 + 历史 PE-band 分位 + 可比 Astera Labs
    - question: 2026H1 预增 85-102% 的"含金量"之争——多头看主业 AI 放量，空头看一次性收益(Q1 含 2.4 亿)+内存周期高点，剔非后真实增速几何？
      source_hint: 半年报扣非明细 + 分季度收入结构
    - question: AI 互连第二曲线(Retimer/CXL)是澜起的真增量，还是 Astera Labs 主导下的边缘份额？CXL 商用延后是否证伪估值隐含的放量斜率？
      source_hint: 产业研报 + Astera 财报 + 机构调研纪要
    - question: '被当 HBM 概念股的预期差——市场叙事(AI/HBM 运力芯片)与实际 BOM(内存接口，与 HBM 无直接关系)的偏离，是 alpha 还是估值陷阱？'
      source_hint: 年报业务拆分 + 卖方对标的定位
    - question: A/H 两地估值分化——港股情绪定价(半导体新王)与 A 股定价谁更接近内在价值？折溢价如何收敛？
      source_hint: A/H 折溢价序列 + 南向资金

  l4_hunting:
    - question: AI 互连新品从 2.69 亿基数，2026-2027 季度收入占比/绝对额的爬坡曲线如何？Retimer 客户导入名单与 PCIe Switch 送样节点？
      addresses: [K1]
      search_keywords: [澜起 互连芯片 收入, PCIe Retimer 客户, PCIe Switch 送样]
      source_hint: 半年报/季报分部收入 + 业绩说明会 + 卖方拆分
    - question: A 股/港股当前 PE-band 处历史什么分位？卖方 2026-2027 EPS 一致预期与目标价分布？可比 Astera Labs 的 EV/Sales、PE 对照下澜起贵还是便宜？
      addresses: [K2]
      search_keywords: [澜起 目标价 一致预期, 澜起 估值 历史分位, Astera Labs 估值对比]
      source_hint: 卖方深度模型 + Wind 一致预期 + 可比估值表
    - question: 2026H1 半年报扣非同比(剔除 2.4 亿一次性)与毛利率环比趋势？内存周期位置(DDR5 现货价/DRAM 周期)是见顶还是主升？
      addresses: [K3]
      search_keywords: [澜起 半年报 扣非, DDR5 价格 2026, DRAM 内存周期]
      source_hint: 半年报正文 + TrendForce 内存价格
    - question: 前五大客户 2025 最新占比与境外收入结构？A/H 折溢价序列如何演变？集中/地缘风险是否因 AI 服务器需求分散而改善？
