  talent 生命周期机理（出道→成长→头部→毕业）的造血/折旧含义；
  日本财年制与 COVER 季节性（Q4 演唱会/年末旺季）；
  "增收不增利"的会计构成（一次性减损/在库评价减 vs 经营性利润率）；
  YouTube 平台依赖机理；VTuber/IP 公司估值锚（PER/EV-EBIT/订阅·talent 规模）；
  中国大陆/地缘舆论风险传导路径。

