key_risks_to_monitor:
  - FY2027 Q1 决算（2026-08-12）营益率是否止跌——命门1 触底反弹 vs 结构性下滑分水岭
  - 物販 YoY 增速与在库评价减是否反复（命门2 单引擎失速）
  - ANYCOLOR 增速·营益率差是否继续扩大（K3 输家折价固化）
  - ホロドリ セルラン 是否材料出尽后回落 / TCG 出货可持续性（K4 期权 vs 减损）
  - talent 头部毕业（2025 已7名含 Gawr Gura）对配信·EC 的量化拖累（命门3）
  - 中国大陆/地缘舆论敏感事件（bilibili活动/领土议题/权利侵害）

analogies_to_study:
  - 案例: ホロアース（COVER 自家元宇宙业务，2021-2025）
    类比逻辑: 同一管理层的"新增长曲线"赌注最终¥31.99亿减损撤退——检验 ホロドリ/TCG 是否重蹈"先烧钱后出清"覆辙
    类比局限: TCG/手游是已验证变现模式（非未成熟元宇宙），且 ホロドリ 依托既有 IP·talent 而非从零建平台
  - 案例: ANYCOLOR(5032) 轻资产范式（同业镜鉴，非历史失败）
    类比逻辑: 同赛道竞对以轻资产（talent数×打赏抽成）跑出36%营益率+高股东回报，映照 COVER 重资产范式的利润率天花板
    类比局限: 两家 IP 定位·海外占比·物販依赖度不同，营益率差部分是商业模式选择而非纯粹优劣
  - 案例: 万代南梦宫/任天堂等 IP·玩具·TCG 龙头的物販/授权周期
    类比逻辑: 成熟 IP 公司物販·TCG 收入的周期性与天花板，映照 COVER 物販见顶后的稳态增速
    类比局限: COVER IP 生命周期更短（talent 毕业折旧）、粉丝基数与全球化程度差异大
