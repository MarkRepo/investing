key_risks_to_monitor:
  - 经济价值量子优势始终未出现（K1 永远没答案）→ 整个产业叙事崩塌
  - FTQC 工程化卡壳（K2 持续推迟）→ 卖铲人订单萎缩 → 卖铲人标的也下跌
  - 大国脱钩加剧（中美量子技术封锁）→ 国产替代窗口提前 + 全球供应链分裂
  - 后量子密码学 (PQC) 提前部署完毕 → "破解 RSA" 叙事失效 → IonQ/Rigetti 类标的最大利空之一
  - 量子计算被 AI 大模型抢走资本叙事 → 行业融资断流（已经在发生，2024-2025 量子融资同比下滑）

analogies_to_study:
  - case: 1990 年代美国互联网早期（1993-2000）
    similarity: 基础设施先投入（光纤、路由器、Cisco）→ 5-7 年后应用层爆发；当下卖铲人逻辑类似 Cisco/Sun Microsystems
    difference: 互联网商业价值在 1995 年已经清晰（电商、门户），量子计算的商业价值至今未跨过 PoC 阶段

  - case: 1980 年代美国 AI 寒冬（专家系统泡沫破裂 1987-1993）
    similarity: 政府重金投入 + 学术狂热 + 创业潮 → 商业落地不及预期 → 资本撤退 + 10 年低谷
    difference: 当下量子计算的工程化基础（材料、低温、控制）远比 1980s AI 扎实，不太可能"完全归零"

  - case: 1960-1970 年代美苏航天竞赛 + 后续商业航天 50 年空窗
    similarity: 国家战略地位极高 → 长期资本投入 → 但真正商业化等了 50 年（直到 SpaceX）
    difference: 量子计算的"自然商业化诱因"（药物研发降本、金融组合优化、AI 加速）比航天的"卫星互联网"更内生
