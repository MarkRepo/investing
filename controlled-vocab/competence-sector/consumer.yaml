# 消费品（含消费服务、远程医疗）行业补丁
# 在通用 12 问之外追加，sector_score 最多 4 分
version: 1
sector: consumer
label: 消费品
sector_questions:
  - id: brand_power
    label: 品牌力
    prompt: 消费者心智占有、溢价能力、代际传承
  - id: channel_structure
    label: 渠道结构
    prompt: 直营 vs 分销、线上 vs 线下、渠道库存健康度
  - id: pricing_power
    label: 定价权
    prompt: 过去 5 年提价历史、提价后销量反应
  - id: generational_shift
    label: 代际变化
    prompt: 核心消费群年龄结构、下一代用户接续情况
