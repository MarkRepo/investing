        Intellia lonvo-z 的 PDUFA(2027/3/10) + ARK 增持，不构成方向级产业变化；
        且 ARKG 是主动管理 ETF，走势混着基金经理换仓。下期补查
    - name: 半导体材料 / 电子特气（"新材料"实为半导体上游）
      themes: ["cn:新材料"]
      note: >-
        本期最值得盯的二波候选。载体 588160 跟踪上证科创板新材料指数(000689)，
        前三权重沪硅产业/安集科技/中船特气——**主题名叫"新材料"，装的是半导体材料**。
        产业证据是硬的：9/7 商务部对日本二氯二氢硅(DCS)反倾销初裁、信越化学等按 99.2%
        征保证金(日本占全球 DCS >70%)；六氟化钨日本两厂永久停产、全球产能 -25%，
        6N 级报价 220-300 万元/吨、较 4 月初 +190%；9/15 工信部+发改委《电子信息制造业
        "十五五"规划》点名高端光刻胶与大尺寸晶片材料；12 英寸硅片全球前三同步提价 5%-22%。
        与国产算力链 ETF 零重叠(那些是设计/制造)，是**独立的一条腿**，不并入 T2。
        技术否掉：RS60 1.4 全池倒数、ret60 -30.08、空头排列。空头排列不排除它
        ——二波的前置状态就是它(DESIGN §6.2)
