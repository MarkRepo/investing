        成本冲击本身未结束：航油 $4.53-4.80/加仑(年初约 $2.50)，涨幅是原油的两倍
        (裂解价差走阔)；IATA 口径航油占全行业营业成本 31.4%(2025 年 25.4%)、
        全行业燃油账单 3,500 亿美元(上年 2,520 亿)；美航全年已吸收 40 亿美元增量燃油成本、
        Q4 再加约 10 亿、年内两次下调指引。**这是 B1 炼油的对立面，同一冲击的受害端。**
        技术亦未确认：空头排列、RS60 13.6、ret20 -1.89。
        不入黑名单——上涨有可证实的原因，只是原因是「成本压力缓解一周」而非趋势。
        附带线索：达美的 Monroe Energy 炼油厂是裂解价差的内部对冲(Q2 2026 预计贡献约
        3 亿美元)，但 JETS 把它稀释到 10.2%，载体拿不到这个 alpha
    - name: 美国国防航天（ITA）
      themes: ["us:国防航天"]
      note: >-
        **载体近半是民航链**：ITA 前三 GE 21.6 + RTX 17.2 + BA 9.1 = 47.9%，
        GE Aerospace 与波音的驱动力是民航周期，而民航正在削减运力、推迟交付
        ——与 JETS 同源受损。且 Europe Force Posture Review 推动欧洲承担主责，
        对美国承包商是中性偏负。技术：空头排列、ret20 -8.83、RS60 22.7，
        放量 1.36 是高位派发形态而非启动
    - name: 太空（ARKX）
      themes: ["us:太空"]
      note: >-
        **载体资格不成立**，同 ARKF 的处理。ARKX 前十：SPCX 10.2(这是一只 SPAC 篮子 ETF)、
        AMZN 4.6 + NVDA 4.3 + AMD 4.2 + GOOG 3.9 = 17.0% 大型科技股、DE 5.4(农机)，
        真正的太空标的只有 KTOS 6.4 + RKLB 4.9 + AVAV 4.3 = 15.6%。
        RS5 81.8 里有多少是 NVDA/AMD 贡献(与 T2 重叠)分不干净。且缩量 0.56。
        不作为方向判定
    - name: 美国再工业化（AIRR）
      themes: ["us:再工业化"]
      note: >-
        宏观前提直接否决：再工业化在加息(3.75-4.00%)+油价 $100 的环境下是**成本冲击**
        而非受益方——建厂是长久期资本开支。技术印证：RS60 3.0 池内倒数第二、
        ret60 -19.94、ret20 -7.69、空头排列。且持仓与 ITA/ARKX 重叠(KTOS/BWXT/HII)，
        「再工业化」的一部分其实是国防
    - name: 医疗服务 / 管理式医疗（IHF）
      themes: ["us:医疗服务"]
      note: >-
        **载体过半是保险**：UNH 20.1 + CVS 13.2 + ELV 7.1 + HUM 4.4 + CNC 4.1 + CI 3.9
        = 52.8%，驱动力是赔付率与费率博弈，不是产业变化——性质接近 theme_scope 的金融组。
        技术是最差的一种组合：位置分位 87.6、距 250 日高仅 -3.65(接近新高)，
        但 ret5 -2.83、RS5 9.1 全池垫底、量能 1.33 放量。**高位放量下跌 = 派发**
    - name: 医疗器械（美股）
      themes: ["us:医疗器械"]
      note: >-
        反查不到当期产业变化。IHI 前三 ABT 18.5 + ISRG 12.9 + SYK 10.8 = 42.2%，
        器械的驱动力是手术量 + 报销 + 设备资本开支(长久期，受加息压制)，
        本期没有可核实的拐点事件。技术 ret20 -7.37、位置 27.1、均线纠缠偏空，
        量能 1.2 仅勉强够池内门槛 1.19。不入黑名单——它既没涨也没逻辑，
        黑名单是给「涨了但找不到逻辑」的
    - name: A 股金融科技
      themes: ["cn:金融科技"]
      note: >-
        产业逻辑不成立：159851 跟踪中证金融科技(930986)，前十 52.5% 里同花顺 11.02 +
        东方财富 10.78 + 指南针 5.90 + 财富趋势 2.39 = 30.1% 是**券商流量/交易终端**，
        驱动力是 A 股成交量与开户数——这是券商 beta 的放大器，不是产业趋势。
        技术亦否：位置分位 12.2(极低，钱根本没进来)、距高 -36.39、板块 5 日资金 -14.35 亿。
        下期若仍如此，考虑并入 theme_scope 的金融组
    - name: 港股信息技术（载体名不副实）
      themes: ["cn:信息技术·港股"]
      note: >-
        **载体资格不成立**。159131 跟踪中证港股通信息技术(931573)，前十 71.3%：
        美团 10.24(本地生活) + 比亚迪 7.36 + 吉利 2.61(汽车) + 药明生物 4.63 +
        信达生物 4.09(生物药) = 34.9% 不是信息技术；真正科技只有腾讯 10.03 + 小米 9.98 +
        中芯 7.80 + 联想 5.01 = 32.8%。这是一只**港股大盘股篮子**。
        所以 RS5 84.8 不能算作国产算力的技术确认。
        另注：药明生物 4.63% 与医药卡片持仓重叠，若同时持有会放大单一风险敞口。
        技术亦弱：RS60 30.4、ret60 -13.16、量能 0.56 缩量
    - name: A 股消费系（食品饮料 / 白酒 / 家电 / 消费 / 旅游 / 养殖 / 游戏）
      themes: ["cn:食品饮料", "cn:白酒", "cn:家电", "cn:消费", "cn:旅游", "cn:养殖", "cn:游戏"]
      note: >-
        整类一次判掉，共用一个理由：**RS60 高是抗跌，不是趋势**。
        食品饮料 RS60 72.5 / 白酒 71.0 / 消费 73.9 / 养殖 85.5 / 旅游 63.8 看着都不低，
        但位置分位全部在 6.9-29.3 之间、量能比 0.44-0.96 无一放量。
        RS60 是 ret60 的池内百分位，下跌市里「跌得比别人少」同样排在前列
        ——这正是 theme_scope 第四条信号要求「RS60≥60 且位置≥60」的原因。
        且本期无一条可核实的产业催化：白酒仍在库存去化、家电以旧换新退坡、
        养殖猪价未走出成本线。位置分位低于 21 意味着钱根本没进来
    - name: A 股周期 / 地产链（建材 / 钢铁 / 化工 / 工程机械）
      themes: ["cn:建材", "cn:钢铁", "cn:化工", "cn:工程机械"]
      note: >-
