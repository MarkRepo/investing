# 本期 2×2 判定（DESIGN §2）。机器可读，供 /surf 首页渲染。
# 每期扫描由 SKILL Step 4 产出，与 summary.md 的判定必须一致。
# 主题键一律带市场前缀 cn:/us: —— 「软件」在两个池子里都存在，不加前缀会串台。
# themes: 该条判定**实际持仓**的主题键（与 scans/{date}/themes.json 对齐）。
# themes_covered: 同一判定覆盖、但未选作载体的主题——判过了，只是没买它。
# /surf/universe 靠它把方向级的判定广播到具体 ETF，漏写则那些 ETF 显示为「未判定」。
date: 2026-09-22
scan: "002"
headline: 无新建卡片；通道 B 补回炼油但阶段错；持仓查漏证伪了两个"新方向"；补判剩余 14 个方向后零未讨论
# ⚠️ themes 只登记**被真正判定过**的方向。仅作为佐证被引用的（如美股 ITB 用于
#    论证 A 股地产无全球共振、美股 ITA 用于论证 A 股军工无共振）不登记
#    ——那属于「未判定」，登记进来会虚报覆盖面。

