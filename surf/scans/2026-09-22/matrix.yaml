        ② **量能比 0.47 严重缩量**，RS5 仅 55.1
    - name: 美国大麻（Schedule III 税制）
      themes: ["us:大麻"]
      note: >-
        产业逻辑成立且可量化：2026-04 代理总检察长 Blanche 将州牌照医用大麻移入
        Schedule III，解除 IRS 280E，行业年省约 23 亿美元联邦税；Trulieve 登陆 NYSE；
        Curaleaf 要约收购 Aurora。
        三条压住：① **载体极端集中 + swap 敞口**——MSOS 前三 TRLV 31.31 + CURLF 26.24 +
        GTBIF 17.01(SWAP) = 74.56%，GTBIF/VRNO 通过掉期持有；
        ② Schedule III **不自动**解禁银行/支付/上市(9/18 法规分析)，9 月底 DEA 听证是
        **事件驱动不是趋势**；③ 技术上虽多头排列 RS60 75.8，但 ret5 +0.41 / ret20 -0.40
