        但三条压住：① **载体严重错配**——REMX 前十含北方稀土 6.6/金钼股份 5.3/厦门钨业 5.1
        = 17% 是中国公司(管制收紧时它们是受益方，与西方供应链逻辑相反)，
        ALB 8.1/SQM 5.7/PLS.AX 8.2 = 22% 是锂，真稀土仅 MP 6.8+LYC 6.8；
        ② 9 月 NdPr 复合体**首次整块下跌**(-1.98% ~ -2.54%)，篮子月度 +0.31% 走平；
        ③ MP 的 $110/kg 是**政府价格保护**(上半年确认 5,990 万美元价格保护收入)，不是市场价。
        技术 RS60 1.5 池内倒数、ret20 -12.98、空头排列。11/10 下期必盯
    - name: 铀与核能
      themes: ["us:铀与核能"]
      note: >-
