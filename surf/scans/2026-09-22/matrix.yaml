    - name: 金融科技 · ARKF（通道 B 发现，载体名不副实）
      themes: ["us:金融科技"]
      note: >-
        RS60 93.9、位置 50.2 看似最该查，查完结论是**载体名不副实**：ARKF 前九大持仓
        SHOP/CRCL/XYZ/COIN/HOOD/PLTR/TOST/AMZN/BLSH，其中 CRCL(USDC 发行方)/COIN/HOOD/
        BLSH 四只是加密标的。其 RS60 反映的是加密行情，不是金融科技产业趋势
        （Bloomberg：ARKF 的 29% 回报由 PLTR +135% 与 Roku +46% 撑起，核心支付业务萎靡）。
        稳定币方向本身是真的（市场规模约 3160 亿美元、BofA/Citi/GS/JPM 等大行联合设发行公司），
        但我没有独立的加密产业研究基础，且 ARKF 是主动管理 ETF（同 ARKG 的载体资格问题）。
        不作为方向判定，登记为载体资格发现

    - name: 基因治疗（通道 B 发现）
      themes: ["us:基因治疗"]
      note: >-
