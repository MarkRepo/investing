    - name: 航空运输（美股）
      themes: ["us:航空运输"]
      note: >-
        本期唯一「数据主动在喊」的矛盾，已解。放量 1.92 + RS5 75.8 的来源是
        ① 9/18 油价当周回落带来的超跌反弹、② 9/16 三大航宣布削减运力后的票价博弈、
