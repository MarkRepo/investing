        但与 T8「AI 电力」**同一个宏观否决**——核电是久期最长的资产，FOMC 9/16 加息至
        3.75-4.00%、SEP 中值还有一次到 4.1%。现货逼近 $100 的同时板块股票自 52 周高
        回撤 40-50%，说明贴现率压过了基本面。URA 位置 22.5、距高 -30.46、ret20 -6.71、
        均线纠缠偏空、量能 1.05 未过池内门槛 1.19
    - name: 欧洲重整军备
      themes: ["us:国防·欧洲"]
      note: >-
        与 A 股军工黑名单不同市场不同驱动，单独判。产业逻辑成立且有制度支撑：
        8/25 五角大楼启动 Europe Force Posture Review(约 6 个月)，推动欧洲承担常规防御主责；
        德国采购加速、SAFE/EDIP 等欧盟财政工具落地。
        技术未确认：**空头排列** + ret20 -6.09 + 量能 0.79。载体亦有瑕疵——EUAD 前七含
        空客 EADSY 4.6、MTU 航发 MTUAY 4.6，是**民航链**而非国防，与 JETS 的成本冲击同源
    - name: 中国教育（业绩兑现驱动）
      themes: ["cn:教育"]
      note: >-
        产业逻辑部分成立：新东方 FY2026 营收 56.61 亿美元 +15.5%、净利 4.75 亿美元 +27.8%，
        Q4 营收 +23%；考研考公需求回暖；行业逻辑从政策博弈切换到业绩兑现；
        指数 PE-TTM 34.18，处近 1 年 2.96% 分位。
        两条压住：① **载体一半是 AI 硬件马甲**——513360 跟踪中证全球中国教育(931456)，
        前十 70.6% 里真教育只有好未来 15.56+新东方 14.95+中公 6.86 = 37.4%，
        其余智微智能 6.64/拓维信息 5.27/视源 5.07/科大讯飞 4.71/优必选 4.46 = 26%
