# surf · 结构性不覆盖的主题登记
#
# 本文件解决一个统计口径问题：`/surf/universe` 的「未判定」分母里混着一批
# **本来就不该进 2×2** 的主题。它们每期都出现在未判定里，逼着我重新纠结一次，
# 同时把覆盖率人为做低——扫描 #002 的 57 个未判定里，有 24 个属于这一类。
#
# 判据：不是「这期没看」，而是「这个系统的框架对它不适用」。
# 与「判定淘汰」的区别——判定淘汰是**看过并否了**，这里是**不该用这把尺子量**。
#
# ⚠️ 加一条进来的门槛应当很高。理由必须是框架性的（驱动力类型不对、
# 标的不是产业聚合），不能是「这期技术不好」——那是判定，不是不覆盖。
groups:
  - id: finance
    label: 金融 · 驱动力不是产业变化
    why: >-
      银行/券商/保险/非银/REIT 的驱动力是利率方向与资产质量，不是产业供需或技术拐点。
      本系统 2×2 的横轴「产业逻辑是否成立」对它们无从落笔——利率下行时它们一起涨，
      与任何产业趋势无关。这是设计选择，不是遗漏（DESIGN §2）。
    themes:
      - cn:银行
      - cn:金融
      - cn:券商
      - cn:非银金融
      - cn:金融·港股
      - cn:券商·港股
      - cn:非银金融·港股
      - us:金融
      - us:银行
      - us:区域银行
      - us:保险
      - us:另类资管
      - us:房地产REIT
      - us:抵押REIT

  - id: sector_container
    label: 行业容器 · 不是产业方向
    why: >-
      GICS/晨星行业级 ETF（XLK、XLI、XLY 等）的成分按**行业分类**聚合，不按产业趋势聚合。
      「可选消费」里同时装着邮轮、汽车和奢侈品，判它涨不涨没有产业含义——
      同 DESIGN §6.1「载体资格」那条，只是这里的聚合口径是行业分类而非财务特征。
      注意与**宽基剔除**的区别：宽基（SPY/QQQ）在规则层就被剔了，这些进了池但不是方向。
    themes:
      - us:科技综合
      - us:工业
      - us:可选消费
      - us:必需消费
      - us:通信服务
      - us:电信
      - us:零售
      - us:运输
      - us:自然资源
      - us:全球基建
