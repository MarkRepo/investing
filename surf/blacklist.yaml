- 主题: A股军工 / 国防 / 航空航天
  判定日期: 2026-09-21
  扫描批次: "#001"
  代表标的:
    - 国防ETF鹏华
    - 军工龙头ETF富国
    - 军工ETF国泰
    - 航空航天ETF华夏
    - 航天ETF华安
  表面现象: 20 日涨幅 +4.48% ~ +4.94%，RS20 95–98，为 A 股全场最强
  判定理由:
    - ret60 为 -6.13% ~ -6.97%（RS60 32–38），20 日的强势只是超跌后的低位反弹
    - 位置分位 11.6 – 20.8，贴近 250 日最低点
    - 量能比 0.43 – 0.73，反弹全程缩量
    - 同花顺「军工装备」板块 5 日涨跌 -0.72%，已经停涨
    - 同花顺「军工装备」板块 5 日资金净额 -35.19 亿，主力净流出
    - 当日广度 88.8%（71 涨 / 9 跌）看似健康，但配合「5 日已停涨 + 资金净流出 35 亿」，
      这是普涨式派发的形态，不是启动——广度高本身不构成买入理由（DESIGN §6.2）
    - 美股对照 ITA 国防航天 ret20 -9.88%（RS20 2.0，全场最弱），空头排列——全球国防产业零共振
  结论: 低位 + 缩量 + 资金流出 + 已停涨 + 全球无共振。找不到真实产业变化解释 A 股军工的独涨。
  重新评估条件:
    - 出现可核实的订单/交付/军费预算层面的产业变化，且美股 ITA 同步转强
