# surf · ETF → 同花顺行业板块映射
#
# 用途：资金流与广度是板块层指标，扫描对象是 ETF，两者需要映射（DESIGN §6.3）。
# 原则：
#   1. 只映射 A 股 ETF。资金流与广度都是 A 股板块数据，港股 ETF 映射过去会张冠李戴；
#      港股标的的资金面佐证在卡片中定性处理（如南向资金），不走机械映射。
#   2. 不强求全覆盖。找不到单一对应板块的 ETF（如电子ETF 横跨元件/光学光电子/其他电子、
#      矿业ETF 横跨煤炭/有色/钢铁）宁可留空，不做勉强映射。
#   3. 无映射的 ETF 照常计算价格类指标，资金流与广度字段留空。
#
# 维护：随使用逐步补充。新增前先确认板块名出现在 scans/*/cn_boards.csv 的「行业」列中。

